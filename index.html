<p>Two roles, one buffer: <strong>producers</strong> generate items; <strong>consumers</strong> process
them. They run at different rates, so you decouple them with a <strong>thread-safe
queue</strong>. When the queue has a <strong>capacity limit</strong>, producers block when full and
consumers block when empty — automatic <strong>back-pressure</strong> that prevents unbounded
memory growth.</p>
<pre><code>   producer(s)                         consumer(s)
       │                                    ▲
       │ push when not full                 │ pop when not empty
       ▼                                    │
   ┌──────────────────────────────────────────────┐
   │  bounded queue  [ · · · | cap ]              │
   │  mutex + not_full_cv + not_empty_cv          │
   └──────────────────────────────────────────────┘
</code></pre>
<p>This pattern appears everywhere: log pipelines, job dispatch (Part 4.1&rsquo;s queue
is the consumer side of &ldquo;submit&rdquo;), GPU command buffers, and any &ldquo;generate then
process&rdquo; pipeline (Part 4.5). Part 1.3 and Part 2.3 introduced condition
variables; here we build the reusable component they were preparing you for.</p>
<hr />
<h2 id="421-why-bounded-not-unbounded">4.2.1 Why bounded, not unbounded</h2>
<pre><code>   unbounded queue:
      fast producer + slow consumer → queue grows without limit → OOM

   bounded queue (capacity = C):
      queue full  → producer blocks on not_full_cv
      queue empty → consumer blocks on not_empty_cv
      in-flight items ≤ C at all times
</code></pre>
<p><strong>Trade-offs ▸</strong> Bounded queues add latency under burst load (producers wait)
but give predictable memory and apply pressure upstream — a slow downstream
stage cannot be overrun. An unbounded queue is simpler but hides overload until
the process dies.</p>
<blockquote>
<p><strong>Rule ▸</strong> Every <code>wait()</code> on a condition variable must use the <strong>predicate
form</strong> (Part 1.3, Part 5.6). Both <code>not_full</code> and <code>not_empty</code> predicates
must also account for <strong>shutdown</strong> so threads can exit cleanly.</p>
</blockquote>
<hr />
<h2 id="422-two-condition-variables-not-full-and-not-empty">4.2.2 Two condition variables: not-full and not-empty</h2>
<p>One mutex, two condvars — the canonical design:</p>
<pre><code>   push(v):
       lock
       wait(not_full_cv,  q.size() &lt; cap || closed)
       if closed: return false
       q.push(v)
       notify_one(not_empty_cv)     // wake a waiting consumer
       unlock

   pop():
       lock
       wait(not_empty_cv, !q.empty() || closed)
       if q.empty(): return nullopt  // closed and drained
       v = q.pop()
       notify_one(not_full_cv)      // wake a waiting producer
       unlock; return v
</code></pre>
<p>Why two condvars instead of one?</p>
<pre><code>   single cv on bounded queue:
      producer wakes consumer ✓
      consumer wakes producer ✓
      but broadcast wakes EVERYONE → thundering herd on large pools

   two cv's:
      push  → notify not_empty only  (consumers)
      pop   → notify not_full only   (producers)
      less spurious contention
</code></pre>
<blockquote>
<p><strong>The API ▸</strong> <code>std::condition_variable::wait(lock, predicate)</code> is
equivalent to <code>while (!pred) wait(lock)</code> — use it always. Headers:
<code>&lt;condition_variable&gt;</code>, <code>&lt;mutex&gt;</code>, <code>&lt;queue&gt;</code>.</p>
</blockquote>
<hr />
<h2 id="423-back-pressure-in-the-pipeline">4.2.3 Back-pressure in the pipeline</h2>
<p>Back-pressure propagates stall signals backward through a chain:</p>
<pre><code>   stage A ──q1(cap=4)──▶ stage B ──q2(cap=4)──▶ stage C

   C slows down → q2 fills → B blocks on push to q2
                → q1 fills → A blocks on push to q1
</code></pre>
<p>No central coordinator needed — each bounded link enforces its own limit.
Part 4.5 uses this property for staged parallelism.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> A blocked producer is descheduled in the kernel (Part
0.3). It consumes no CPU while waiting; the scheduler runs other threads.
This is why blocking queues beat busy-wait spin loops for I/O-heavy or
mismatched rates.</p>
</blockquote>
<hr />
<h2 id="424-multiple-producers-and-multiple-consumers">4.2.4 Multiple producers and multiple consumers</h2>
<p>The two-condvar design is <strong>MPMC-safe</strong> as long as:</p>
<pre><code>   ✓ all queue mutations happen under one mutex
   ✓ wait predicates re-check state after wakeup
   ✓ notify after releasing is OK (std::notify is safe if lock was held)
   ✗ never pop outside the lock or read q_.empty() without it
</code></pre>
<p>Any number of producer threads may call <code>push</code>; any number of consumers may
call <code>pop</code>. The mutex serializes queue structure changes; parallelism comes
from consumers executing <strong>outside</strong> the lock after they pop an item.</p>
<p><strong>Trade-offs ▸</strong> A single mutex becomes hot under extreme contention. Lock-free
MPMC rings (Disruptor, bounded SPSC queues per pair) exist for microsecond
latency — but mutex + two condvars is correct, readable, and fast enough for
most C++ services.</p>
<hr />
<h2 id="425-shutdown-poison-pill-and-close">4.2.5 Shutdown: poison pill and close</h2>
<p>Two common shutdown styles:</p>
<pre><code>   (A) poison pill:  producer pushes sentinel value (e.g. -1)
                     each consumer exits on seeing sentinel

   (B) close flag:   queue.close() sets closed_=true, notify_all both cv's
                     pop() returns empty optional once drained
</code></pre>
<p>Style (B) scales better with multiple producers — no need to inject N
sentinels. The last producer calls <code>close()</code> after finishing; consumers drain
remaining items then observe <code>empty &amp;&amp; closed</code> and exit.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Forgetting to <code>notify_all</code> on <code>close()</code> leaves consumers
blocked on an empty closed queue forever (Part 5.6).</p>
</blockquote>
<hr />
<h2 id="426-a-compilable-bounded-queue">4.2.6 A compilable bounded queue</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread 02_producer_consumer.cpp -o 02_producer_consumer
#include &lt;atomic&gt;
#include &lt;chrono&gt;
#include &lt;condition_variable&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;optional&gt;
#include &lt;queue&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

template &lt;class T&gt;
class BoundedQueue {
    std::mutex              mu_;
    std::condition_variable not_full_, not_empty_;
    std::queue&lt;T&gt;           q_;
    size_t                  cap_;
    bool                    closed_ = false;

public:
    explicit BoundedQueue(size_t cap) : cap_(cap) {}

    bool push(T v) {
        std::unique_lock g(mu_);
        not_full_.wait(g, [&amp;] { return closed_ || q_.size() &lt; cap_; });
        if (closed_) return false;
        q_.push(std::move(v));
        not_empty_.notify_one();
        return true;
    }

    std::optional&lt;T&gt; pop() {
        std::unique_lock g(mu_);
        not_empty_.wait(g, [&amp;] { return closed_ || !q_.empty(); });
        if (q_.empty()) return std::nullopt;
        T v = std::move(q_.front());
        q_.pop();
        not_full_.notify_one();
        return v;
    }

    void close() {
        { std::lock_guard g(mu_); closed_ = true; }
        not_empty_.notify_all();
        not_full_.notify_all();
    }
};

int main() {
    constexpr int NP = 2, NC = 3, ITEMS = 8;
    BoundedQueue&lt;int&gt; q(4);
    std::atomic&lt;int&gt; producers_done{0};

    std::vector&lt;std::thread&gt; producers, consumers;
    for (int p = 0; p &lt; NP; ++p)
        producers.emplace_back([&amp;, p] {
            for (int i = 0; i &lt; ITEMS; ++i) {
                q.push(p * 100 + i);
                std::this_thread::sleep_for(std::chrono::milliseconds(10));
            }
            if (producers_done.fetch_add(1) + 1 == NP) q.close();
        });

    for (int c = 0; c &lt; NC; ++c)
        consumers.emplace_back([&amp;, c] {
            while (auto v = q.pop())
                std::cout &lt;&lt; &quot;C&quot; &lt;&lt; c &lt;&lt; &quot; got &quot; &lt;&lt; *v &lt;&lt; &quot;\\n&quot;;
        });

    for (auto&amp; t : producers) t.join();
    for (auto&amp; t : consumers) t.join();
}
</code></pre>
<p>Run with three consumers and two producers — watch consumers interleave while
the queue never holds more than four items.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Producer-consumer decouples <strong>generation</strong> from <strong>processing</strong> via a shared
  queue; <strong>bounded</strong> capacity applies <strong>back-pressure</strong> when consumers lag.</p>
</li>
<li>
<p>The standard implementation uses <strong>one mutex + two condition variables</strong>
  (<code>not_full</code>, <code>not_empty</code>) with predicate waits on both sides.</p>
</li>
<li>
<p><strong>Multiple producers and consumers</strong> are safe when all queue access is

</li>
<li>
<p><strong>Shutdown</strong> via a <code>close()</code> flag + <code>notify_all</code>, or poison-pill sentinels;
  always wake every waiter.</p>
</li>
</ul>

<p>Many threads need to read a shared data structure; a few need to write it.
A plain mutex lets only <strong>one</strong> thread in at a time — readers block each other
even though reads do not conflict. The <strong>readers-writers</strong> problem asks: can
many readers proceed <strong>simultaneously</strong> while writers still get <strong>exclusive</strong>
access?</p>
<pre><code>   plain mutex:     R ── R ── R ── W ── R     (one at a time, always)
   reader-writer:   R   R   R   W   R   R     (reads overlap; write alone)
                    R R R       R R R
</code></pre>
<p>Part 1.4 covers <code>pthread_rwlock</code>; Part 2.2 covers <code>std::shared_mutex</code>. This
chapter explains the policy variants, when the extra mechanism pays off, and
when a simpler primitive wins.</p>
<hr />
<h2 id="431-the-problem-and-its-variants">4.3.1 The problem and its variants</h2>
<p>Given shared data D:</p>
<pre><code>   reader:  lock(shared) → read D → unlock
   writer:  lock(exclusive) → modify D → unlock
</code></pre>
<p>Three policy families matter in practice:</p>
<pre><code>   READER-PREFERENCE          WRITER-PREFERENCE         FAIR / FIFO
   ─────────────────          ─────────────────         ───────────
   readers pile in            writers jump ahead        alternating queue
   writers may starve         readers may starve        no starvation*
   good for read-heavy        good for write-heavy      higher overhead
   config caches              journal / metrics         databases (sometimes)

   * true FIFO fairness is expensive; most rwlocks approximate
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> <code>pthread_rwlock</code> and <code>std::shared_mutex</code> implement
<strong>unspecified</strong> preference — typically reader-biased on Linux glibc, but do
not rely on starvation behavior without reading your platform&rsquo;s docs. Part
5.3 covers starvation mechanics.</p>
</blockquote>
<hr />
<h2 id="432-implementation-with-stdshared_mutex">4.3.2 Implementation with std::shared_mutex</h2>
<p>C++17&rsquo;s <code>std::shared_mutex</code> maps directly:</p>
<pre><code>   std::shared_lock&lt;std::shared_mutex&gt;  g(sm);   // shared / reader
   std::unique_lock&lt;std::shared_mutex&gt;  g(sm);   // exclusive / writer
</code></pre>
<p>State machine (conceptual):</p>
<pre><code>                    ┌─────────────────┐
         readers ──▶│  shared mode    │◀── many shared_lock holders
                    │  (readers ≥ 1)  │
                    └────────┬────────┘
                             │ writer waits for readers to drain
                             ▼
                    ┌─────────────────┐
         writer  ──▶│ exclusive mode  │◀── one unique_lock holder
                    │  (writers = 1)  │
                    └─────────────────┘
</code></pre>
<blockquote>
<p><strong>The API ▸</strong> <code>#include &lt;shared_mutex&gt;</code>
<code>std::shared_mutex sm;</code>
<code>std::shared_lock lk(sm);</code> — multiple concurrent holders OK.
<code>std::unique_lock lk(sm);</code> — blocks until no shared holders; blocks new
shared locks.</p>
</blockquote>
<p>Readers-writer locks <strong>do not</strong> upgrade from shared to exclusive in-place
(portable code acquires exclusive from the start if a read may become a write).</p>
<hr />
<h2 id="433-when-shared_mutex-beats-a-plain-mutex">4.3.3 When shared_mutex beats a plain mutex</h2>
<p><strong>Use <code>std::shared_mutex</code> when ALL of these hold:</strong></p>
<pre><code>   ✓ read/write ratio is heavily skewed toward reads (10:1 or more)
   ✓ the critical section is non-trivial (not a single atomic load)
   ✓ the protected data is a struct, container, or computed snapshot
   ✓ you have enough concurrent readers to overlap (≥2 threads reading)
</code></pre>
<p>Example: an in-memory configuration map loaded rarely, queried thousands of
times per second by worker threads.</p>
<p><strong>Trade-offs ▸</strong> <code>shared_mutex</code> carries higher constant overhead than
<code>std::mutex</code> — extra bookkeeping for reader counts, more syscalls on some
paths. On a <strong>2-core</strong> machine with <strong>one</strong> reader and <strong>one</strong> occasional
writer, a plain mutex often wins in benchmarks.</p>
<hr />
<h2 id="434-when-it-does-not-beat-a-plain-mutex-or-atomics">4.3.4 When it does NOT beat a plain mutex (or atomics)</h2>
<pre><code>   ✗ single-word counter           → std::atomic&lt;int&gt; (Part 3.1)
   ✗ read-mostly but tiny value    → atomic load/store, no lock
   ✗ write-heavy workload          → shared_mutex adds overhead, no win
   ✗ low core count, low contention → mutex is simpler and faster
   ✗ need writer priority          → platform rwlock may not provide it
</code></pre>
<p>Decision tree:</p>
<pre><code>   fits in one atomic word, trivial read?
       YES → atomic
       NO  → read-heavy + non-trivial critical section?
                 YES → shared_mutex
                 NO  → mutex
</code></pre>
<blockquote>
<p><strong>Pitfall ▸</strong> Protecting a <code>int</code> with <code>shared_mutex</code> because &ldquo;we read more
than we write&rdquo; is slower than <code>std::atomic&lt;int&gt;</code> — the lock serializes
cache lines unnecessarily (Part 5.4 false sharing is a separate concern).</p>
</blockquote>
<hr />
<h2 id="435-example-read-heavy-cache">4.3.5 Example: read-heavy cache</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread 03_readers_writers.cpp -o 03_readers_writers
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;shared_mutex&gt;
#include &lt;string&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

struct Config {
    std::shared_mutex mu;
    std::string       host = &quot;localhost&quot;;
    int               port = 8080;

    std::string endpoint() const {
        std::shared_lock g(mu);                    // many readers OK
        return host + &quot;:&quot; + std::to_string(port);
    }

    void rebind(std::string h, int p) {
        std::unique_lock g(mu);                    // exclusive
        host = std::move(h);
        port = p;
    }
};

int main() {
    Config cfg;
    std::vector&lt;std::thread&gt; readers;
    for (int i = 0; i &lt; 8; ++i)
        readers.emplace_back([&amp;] {
            for (int k = 0; k &lt; 1000; ++k)
                (void)cfg.endpoint();
        });

    std::thread writer([&amp;] {
        for (int k = 0; k &lt; 10; ++k)
            cfg.rebind(&quot;host&quot; + std::to_string(k), 9000 + k);
    });

    for (auto&amp; t : readers) t.join();
    writer.join();
    std::cout &lt;&lt; &quot;final &quot; &lt;&lt; cfg.endpoint() &lt;&lt; &quot;\\n&quot;;
}
</code></pre>
<p>Eight readers hammer <code>endpoint()</code> in parallel; the writer occasionally
exclusively updates — readers see a consistent <code>{host, port}</code> pair, never a
torn string mid-assignment.</p>
<hr />
<h2 id="436-alternatives-worth-knowing">4.3.6 Alternatives worth knowing</h2>
<pre><code>   atomic&lt;shared_ptr&lt;const T&gt;&gt; snapshot:
      writer builds new T, atomic_store the pointer
      readers atomic_load and use immutable copy — zero read-side locking
      (RCU-like; reclamation is the hard part)

   copy-on-write under mutex:

</li>

</li>

<p>Five philosophers sit at a round table. Between each pair is one fork. To eat,
a philosopher needs <strong>both</strong> adjacent forks. The puzzle, posed by Dijkstra, is
a compact model of <strong>resource allocation with circular dependency</strong> — the same
shape that produces <strong>deadlock</strong> in real systems (lock ordering on two tables,
two mutexes, two files).</p>
<p><img alt="Five philosophers around a table, each needing two adjacent forks" src="figures/dining-philosophers.svg" /></p>
<pre><code>          (P0)
        F4    F0
      (P4)     (P1)
        F3    F1
          (P3)----F2----(P2)

   philosopher i needs fork[i] AND fork[(i+1) % 5]
</code></pre>
<p>Part 5.2 generalizes the four deadlock conditions; here we watch them form in
five lines of naive code and break the cycle with three standard fixes.</p>
<hr />
<h2 id="441-the-naive-approach-and-why-it-deadlocks">4.4.1 The naive approach and why it deadlocks</h2>
<p>Every philosopher grabs <strong>left</strong>, then <strong>right</strong>:</p>
<pre><code class="language-cpp">// BROKEN — do not use
void philosopher(int i) {
    std::lock_guard g1(forks[i]);
    std::lock_guard g2(forks[(i + 1) % N]);   // circular wait
    eat();
}
</code></pre>
<p>Timeline when all five reach for their left fork simultaneously:</p>
<pre><code>   P0 holds F0, wants F1
   P1 holds F1, wants F2
   P2 holds F2, wants F3
   P3 holds F3, wants F4
   P4 holds F4, wants F0   ← cycle: nobody can get a second fork
</code></pre>
<p>All four Coffman conditions are satisfied (Part 5.2):</p>
<pre><code>   mutual exclusion   ✓  one thread per fork
   hold and wait      ✓  holding left, waiting for right
   no preemption      ✓  locks aren't forcibly taken
   circular wait      ✓  P0→F1→P1→F2→…→P4→F0→P0
</code></pre>
<blockquote>
<p><strong>Rule ▸</strong> Any time threads acquire <strong>multiple locks</strong> in an order that can
form a cycle, deadlock is possible. The fix is to break at least one
condition — usually circular wait.</p>
</blockquote>
<hr />
<h2 id="442-solution-1-resource-ordering-number-the-forks">4.4.2 Solution 1: resource ordering (number the forks)</h2>
<p>Assign each fork a global index <code>0..N-1</code>. Each philosopher locks the <strong>lower-
numbered fork first</strong>, then the higher:</p>
<pre><code>   philosopher i:
       left  = i
       right = (i + 1) % N
       first  = min(left, right)
       second = max(left, right)
       lock(first); lock(second); eat(); unlock both
</code></pre>
<p>For philosopher 4, <code>left=F4, right=F0</code> → lock <strong>F0 first, then F4</strong>. No thread
can hold a high fork while waiting for a lower one — the wait-for graph is a
DAG, not a cycle.</p>
<pre><code>   before (cycle):     P0─▶F1─▶P1─▶F2─▶ … ─▶P4─▶F0─▶P0

   after (ordering):   all edges point low fork → high fork  (acyclic)
</code></pre>
<p><strong>Trade-offs ▸</strong> Simple, zero extra threads, works for any N. Slightly
asymmetric — one philosopher (who inverts natural left/right) may wait longer
(Part 5.3 starvation is possible but not deadlock).</p>
<hr />
<h2 id="443-solution-2-arbitrator--limiter-at-most-n1-eat">4.4.3 Solution 2: arbitrator / limiter (at most N−1 eat)</h2>
<p>A counting <strong>semaphore</strong> (Part 1.5, Part 2.6) permits at most <strong>N−1</strong>
philosophers to &ldquo;sit&rdquo; (attempt to pick up forks). With only four at the table,
at least one philosopher holds <strong>both</strong> forks or is not competing — someone
can always finish and release.</p>
<pre><code>   sem = N - 1   (initial count)

   philosopher:
       sem.acquire()          // may block here
       lock left; lock right
       eat()
       unlock both
       sem.release()
</code></pre>
<p><strong>Trade-offs ▸</strong> Guarantees progress without per-fork ordering rules. Adds a
central throttle — fine for five philosophers, less elegant when resources
aren&rsquo;t symmetric.</p>
<hr />
<h2 id="444-solution-3-try-lock-and-backoff">4.4.4 Solution 3: try-lock and backoff</h2>
<p>Grab one fork with <code>try_lock</code>; if the second fails, <strong>release the first</strong> and
retry (often after <code>yield</code> or random backoff):</p>

       unlock(left)
       yield / random sleep
</code></pre>

the first indefinitely. Can livelock under bad luck (Part 5.3); random backoff
mitigates.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Fixed-order retry without backoff can spin forever under
contention — that&rsquo;s livelock, not progress.</p>
</blockquote>
<hr />
<h2 id="445-modern-c-stdscoped_lock">4.4.5 Modern C++: std::scoped_lock</h2>
<p>C++17 <code>std::scoped_lock(a, b, ...)</code> calls <code>std::lock</code> internally — it tries
all mutexes in a deadlock-free order without you numbering resources:</p>
<pre><code class="language-cpp">std::scoped_lock g(forks[i], forks[(i + 1) % N]);   // OK
</code></pre>
<p>This is the pragmatic choice when you have a <strong>small fixed set</strong> of locks per
operation. Resource ordering remains the teaching model because it scales to
<strong>arbitrary lock sets</strong> (databases, file hierarchies) where the standard
library cannot pick an order for you.</p>
<hr />
<h2 id="446-example-ordering-fix">4.4.6 Example: ordering fix</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread 04_dining_philosophers.cpp -o 04_dining_philosophers

#include &lt;chrono&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

constexpr int N = 5;

int main() {

    std::mutex io;

        for (int meal = 0; meal &lt; 3; ++meal) {
            std::this_thread::sleep_for(std::chrono::milliseconds(30));

            int left  = id;
            int right = (id + 1) % N;
            int first  = std::min(left, right);
            int second = std::max(left, right);

            std::lock_guard g1(forks[first]);
            std::lock_guard g2(forks[second]);

            {

<h2 id="summary">Summary</h2>
<ul>

</li>

</li>

  N−1</strong>, <strong>try-lock + backoff</strong>, or <strong><code>std::scoped_lock</code></strong> for fixed pairs.</p>
</li>
<li>
<p>In production, prefer consistent lock ordering or <code>scoped_lock</code> whenever a
  thread holds more than one mutex.</p>
</li>
</ul>

<p>Some workloads decompose into <strong>stages</strong>: parse → transform → serialize →
write. Each stage is independent work on <strong>one item at a time</strong>, but different
items can be in different stages simultaneously. A <strong>pipeline</strong> connects stages
with <strong>bounded queues</strong> (Part 4.2); each stage runs in its own thread, pulling
from an input queue and pushing to an output queue.</p>
<p><img alt="Pipeline stages connected by bounded queues" src="figures/pipeline.svg" /></p>
<pre><code>   [source] ──q1──▶ [stage 1] ──q2──▶ [stage 2] ──q3──▶ [sink]
      │                 │                 │                 │
   produce           transform           transform          consume
</code></pre>
<p>Throughput is limited by the <strong>slowest stage</strong> (the bottleneck), not the sum
of stage speeds. Part 0.2&rsquo;s parallelism lesson applies item-by-item: you get
speedup only where stages overlap in wall-clock time.</p>
<hr />
<h2 id="451-staged-parallelism-vs-data-parallelism">4.5.1 Staged parallelism vs data parallelism</h2>
<pre><code>   DATA PARALLEL (Part 6.2):   same operation on every element in parallel
                               #pragma omp parallel for

   PIPELINE:                   different operations on different elements
                               at the same time, connected by queues
</code></pre>
<p>Pipeline wins when:</p>
<pre><code>   ✓ stages have different costs (I/O vs CPU vs format conversion)
   ✓ items are independent (order may or may not matter)
   ✓ you can bound in-flight memory with queue capacity
</code></pre>
<p>It loses when setup overhead dominates (tiny batches) or when one stage is
so much slower that adding pipeline depth cannot help — you must <strong>balance</strong>
the slow stage (Part 0.2, Amdahl).</p>
<hr />
<h2 id="452-throughput--slowest-stage">4.5.2 Throughput = slowest stage</h2>
<pre><code>   stage A: 100 items/sec
   stage B:  40 items/sec   ← bottleneck
   stage C: 200 items/sec

   steady-state throughput ≈ 40 items/sec (limited by B)
</code></pre>
<p>Adding threads to A or C does nothing once B is saturated. Fix the bottleneck
(faster algorithm, more B workers, split B into sub-stages) or accept the cap.</p>
<pre><code>   wall-clock for N items (steady state, k stages, bottleneck rate R):

   time ≈ N / R  +  pipeline fill/drain overhead
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> Queues decouple burstiness: if A is fast and B is slow,
q1 fills until <code>push</code> blocks — back-pressure stalls A without unbounded
buffering. The pipeline self-regulates to B&rsquo;s rate.</p>
</blockquote>
<hr />
<h2 id="453-balancing-stages">4.5.3 Balancing stages</h2>
<p>Strategies when stages are uneven:</p>
<pre><code>   1. replicate slow stage:  two threads both pop q1, push q2 (careful: ordering)
   2. widen slow stage:      internal parallelism per item
   3. merge fast stages:     fewer queue hops → less mutex overhead
   4. tune queue capacity:     larger cap smooths bursts; smaller cap saves memory
</code></pre>
<p><strong>Trade-offs ▸</strong> Multiple workers on one stage preserve throughput but may
<strong>reorder</strong> items unless you tag sequence numbers and reorder at the sink.</p>
<hr />
<h2 id="454-ordering">4.5.4 Ordering</h2>
<pre><code>   ordering required:   single consumer per stage, or sequence tags + reorder buffer
   ordering irrelevant:  multiple consumers on a stage (MPMC queue, Part 4.2)
</code></pre>
<p>If item 7 must exit after item 6, either keep one thread per ordered stage or
attach <code>uint64_t seq</code> and buffer at the sink until contiguous sequences arrive.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Unbounded parallelism in stage 2 with a ordered sink can
cause unbounded reorder-buffer memory if early items finish late.</p>
</blockquote>
<hr />
<h2 id="455-back-pressure-end-to-end">4.5.5 Back-pressure end-to-end</h2>
<p>Each inter-stage link is a Part 4.2 bounded queue:</p>
<pre><code>   source.push ──▶ q1(cap) ──▶ stage1 ──▶ q2(cap) ──▶ stage2 ──▶ …

   any queue full → upstream stage blocks on push
   any queue empty → downstream stage blocks on pop
</code></pre>
<p>Shutdown propagates forward: source <strong>closes</strong> q1 after last item; stage 1
drains q1, <strong>closes</strong> q2, exits; sink drains the final queue and exits.</p>
<hr />
<h2 id="456-example-three-stage-pipeline">4.5.6 Example: three-stage pipeline</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread 05_pipeline.cpp -o 05_pipeline
#include &lt;chrono&gt;
#include &lt;condition_variable&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;optional&gt;
#include &lt;queue&gt;
#include &lt;string&gt;
#include &lt;thread&gt;

template &lt;class T&gt;
class BQ {
    std::queue&lt;T&gt; q_;
    size_t cap_;
    bool closed_ = false;
    std::mutex mu_;
    std::condition_variable not_full_, not_empty_;

public:
    explicit BQ(size_t cap) : cap_(cap) {}

    void push(T v) {
        std::unique_lock g(mu_);
        not_full_.wait(g, [&amp;] { return q_.size() &lt; cap_ || closed_; });
        if (closed_) return;
        q_.push(std::move(v));
        not_empty_.notify_one();
    }

    std::optional&lt;T&gt; pop() {
        std::unique_lock g(mu_);
        not_empty_.wait(g, [&amp;] { return !q_.empty() || closed_; });
        if (q_.empty()) return std::nullopt;
        T v = std::move(q_.front());
        q_.pop();
        not_full_.notify_one();
        return v;
    }

    void close() {
        { std::lock_guard g(mu_); closed_ = true; }
        not_empty_.notify_all();
        not_full_.notify_all();
    }
};

int main() {
    BQ&lt;int&gt; q1(4), q2(4);
    BQ&lt;std::string&gt; q3(4);

    std::thread source([&amp;] {
        for (int i = 1; i &lt;= 10; ++i) {
            q1.push(i);
            std::this_thread::sleep_for(std::chrono::milliseconds(20));
        }
        q1.close();
    });

    std::thread square([&amp;] {
        while (auto v = q1.pop()) {
            std::this_thread::sleep_for(std::chrono::milliseconds(30));
            q2.push((*v) * (*v));
        }
        q2.close();
    });

    std::thread stringify([&amp;] {
        while (auto v = q2.pop())
            q3.push(&quot;val=&quot; + std::to_string(*v));
        q3.close();
    });

    std::thread sink([&amp;] {
        while (auto s = q3.pop())
            std::cout &lt;&lt; &quot;  &quot; &lt;&lt; *s &lt;&lt; &quot;\\n&quot;;
    });

    source.join();
    square.join();
    stringify.join();
    sink.join();
}
</code></pre>
<p>Stage 2 (<code>square</code>) is deliberately slower — watch q1 back-pressure stall the
source when four items pile up.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>A <strong>pipeline</strong> runs each processing stage in its own thread, linked by
  <strong>bounded queues</strong> that provide <strong>back-pressure</strong>.</p>
</li>
<li>
<p><strong>Throughput</strong> equals the <strong>slowest stage</strong> in steady state; optimize the
  bottleneck first.</p>
</li>
<li>
<p><strong>Balance</strong> stages by replication, merging, or internal parallelism; mind
  <strong>ordering</strong> if the sink requires sequential output.</p>
</li>
<li>
<p>Shutdown: <strong>close</strong> queues upstream-to-downstream after drain.</p>
</li>
</ul>

<p>A central task queue (Part 4.1) works — until one worker&rsquo;s queue is empty while
another&rsquo;s is deep. Idle threads spin or sleep; hot threads pile work locally.
<strong>Work-stealing</strong> gives each worker its own <strong>double-ended queue (deque)</strong>:
the owner <strong>pushes and pops</strong> from one end (LIFO, cache-hot); <strong>thieves</strong> take
from the <strong>opposite</strong> end (FIFO, older tasks). Load balances with minimal
contention on the common queue mutex.</p>
<p><img alt="Per-worker deques; thieves steal from the opposite end" src="figures/work-stealing.svg" /></p>
<pre><code>   Worker 0 deque:  [t0 | t1 | t2 | t3]  ← owner pops/pushes here (back, LIFO)
                     ↑
                     thieves steal from front (FIFO)

   Worker 2 idle → steals t0 from Worker 0's front → now executes t0
</code></pre>
<p>Used by Intel TBB, Cilk, Go&rsquo;s scheduler, Rust&rsquo;s rayon, and JVM
ForkJoinPool — the standard scheduler for <strong>recursive divide-and-conquer</strong>
and <strong>fork-join</strong> workloads.</p>
<hr />
<h2 id="461-why-not-one-shared-queue">4.6.1 Why not one shared queue?</h2>
<pre><code>   shared queue pool (Part 4.1):
      every submit/pop → same mutex → hot under many workers
      uneven task trees → some workers starve while queue is non-empty elsewhere

   work-stealing:
      owner rarely contends (local deque)
      steal is rare (only when local deque empty)
      recursive tasks push children locally → parent cache stays warm
</code></pre>
<p><strong>Trade-offs ▸</strong> Work-stealing shines on <strong>dynamic, nested</strong> parallelism (quicksort
partitions, tree walks, ray tracing tiles). It adds complexity — per-worker
deques, steal protocols, and (in production) <strong>lock-free Chase-Lev deques</strong>. For
flat, uniform tasks, a simple pool is often enough.</p>
<hr />
<h2 id="462-owner-end-lifo-cache-hot">4.6.2 Owner end: LIFO (cache-hot)</h2>
<p>When a task forks into subtasks, the parent pushes them onto <strong>its</strong> deque and
continues popping the <strong>most recent</strong> child (back of deque):</p>
<pre><code>   task A runs on worker W
   A spawns B, C, D → W.push_back(B,C,D)
   W pops D (LIFO) → executes deepest subtask first

   → depth-first traversal of the task tree
   → subtasks reuse W's cache lines and stack locality
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> LIFO on the owner end mimics sequential recursive
execution — the worker stays on the &ldquo;hot&rdquo; subtree it just created. Thieves
pulling from the <strong>opposite</strong> end take <strong>older, coarser</strong> tasks that are
less cache-sensitive anyway.</p>
</blockquote>
<hr />
<h2 id="463-thief-end-fifo-reduce-contention">4.6.3 Thief end: FIFO (reduce contention)</h2>
<pre><code>   owner:   pop_back()   — only this worker touches the back (usually)
   thief:   steal_front() — different end → less lock overlap with owner

   if both ends were LIFO for everyone:
      thieves fight owner on same end → high contention
</code></pre>
<p>Steal attempts happen <strong>only when</strong> the local deque is empty — the common case
is zero cross-worker traffic.</p>
<blockquote>
<p><strong>Rule ▸</strong> Steal from <strong>random</strong> victims (or round-robin) to avoid all idle
workers hammering the same deque.</p>
</blockquote>
<hr />
<h2 id="464-the-deque-operations-sketch">4.6.4 The deque operations (sketch)</h2>
<p>Production deques use <strong>lock-free</strong> Chase-Lev arrays with atomic top/bottom
indices. A mutex-protected teaching version:</p>
<pre><code>   struct Deque {
       deque&lt;Task&gt; dq;
       mutex       m;
   };

   // Owner (worker id = who):
   Task pop_local(who):
       lock dq[who].m
       if dq empty: return {}
       t = move(dq.back()); pop_back(); return t

   // Thief:
   Task steal_from(victim):
       lock dq[victim].m
       if dq empty: return {}
       t = move(dq.front()); pop_front(); return t   // opposite end

   worker_loop(id):
       loop:
           t = pop_local(id)
           if !t:
               for each victim != id (random order):
                   t = steal_from(victim)
                   if t: break
           if t: run t
           else if no work globally: yield or wait
</code></pre>
<p>Real Chase-Lev allows the owner to push/pop without locking when no thief is
active; thieves CAS the top index. Part 3.2 covers the atomic machinery.</p>
<hr />
<h2 id="465-fork-join-shape">4.6.5 Fork-join shape</h2>
<pre><code>   parallel_for(lo, hi):
       if small enough:
           compute serially
       else:
           mid = (lo + hi) / 2
           spawn parallel_for(lo, mid)    → push to local deque
           spawn parallel_for(mid, hi)    → push to local deque
           wait for children (pop local until done)
</code></pre>
<p>The runtime schedules spawned tasks on the same worker&rsquo;s deque; siblings steal
when idle. This is why work-stealing pairs naturally with <strong>recursive</strong>
algorithms (Part 6.4 OpenMP tasks use a related model).</p>
<hr />
<h2 id="466-simplified-work-stealing-pool-sketch">4.6.6 Simplified work-stealing pool (sketch)</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread 06_work_stealing.cpp -o 06_work_stealing
#include &lt;atomic&gt;
#include &lt;chrono&gt;
#include &lt;deque&gt;
#include &lt;functional&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;random&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

class WorkStealingPool {

    struct Worker {
        std::deque&lt;Task&gt; dq;
        std::mutex       mu;
    };

    std::vector&lt;Worker&gt;          workers_;
    std::vector&lt;std::thread&gt;     threads_;
    std::atomic&lt;bool&gt;            stop_{false};
    std::atomic&lt;int&gt;             pending_{0};

        if (workers_[id].dq.empty()) return {};
        Task t = std::move(workers_[id].dq.back());
        workers_[id].dq.pop_back();
        return t;
    }

    Task steal(int thief, int victim) {
        if (thief == victim) return {};
        std::lock_guard g(workers_[victim].mu);
        if (workers_[victim].dq.empty()) return {};
        Task t = std::move(workers_[victim].dq.front());
        workers_[victim].dq.pop_front();

<p><strong>Lazy initialization</strong>: create an expensive singleton on first use, not at
startup. <strong>Double-checked locking (DCL)</strong> tries to optimize the common path —
read a pointer without locking; lock only if the pointer is null — by checking
twice. The pattern was <strong>famously broken</strong> for decades before C++11 atomics and
the memory model made a correct form possible. Understanding <em>why</em> it broke is
a compact lesson in <strong>reordering</strong> (Part 3.3–3.5).</p>
<pre><code>   fast path (every call after init):
      if (ptr != null) return ptr;     ← no lock

      lock
      if (ptr == null) ptr = new T();  ← construct + store pointer
      unlock
      return ptr
</code></pre>

<h2 id="471-the-singleton-init-problem">4.7.1 The singleton init problem</h2>
<pre><code class="language-cpp">Singleton* get() {
    static Singleton* p = nullptr;   // process-wide, lazy
    if (!p) {
        std::lock_guard g(mu);
        if (!p)
            p = new Singleton();     // expensive
    }
    return p;

</code></pre>
<p>Without the outer <code>if (!p)</code>, every call takes the mutex — correct but slow
after initialization. DCL adds the outer check to skip the lock on the hot path.</p>
<p>The bug: the outer check reads <code>p</code> <strong>without synchronization</strong>. Another thread
may observe a <strong>non-null but not fully constructed</strong> object.</p>
<hr />
<h2 id="472-why-classic-dcl-was-broken-pre-c11">4.7.2 Why classic DCL was broken (pre-C++11)</h2>

<pre><code>   Thread A (under lock, constructing):

      2. construct Singleton in that memory
      3. store pointer p = address

      2. construct                ← B reads half-built object

</code></pre>

<pre><code class="language-cpp">// g++ -std=c++17 -pthread 07_double_checked_locking.cpp -o 07_dcl

Singleton&amp; get_meyers() {

<p>A <strong>race condition</strong> is any outcome that depends on the <strong>unsynchronized timing</strong>
of concurrent threads. The C/C++ standard names the worst case a <strong>data race</strong>:
two threads access the same memory location, at least one is a write, and neither
access is atomic or ordered by synchronization → <strong>undefined behavior</strong> (not &ldquo;a
wrong counter,&rdquo; but <em>no guarantees at all</em>). Part 0.4 introduced the lost-update
mechanic; this chapter dissects the anatomy, the common shapes, detection, and
every standard fix.</p>
<hr />
<h2 id="511-the-definition-mechanically">5.1.1 The definition, mechanically</h2>
<pre><code>   thread A                          thread B
   ────────                          ────────
   load  counter → 5
                                     load  counter → 5
   add   reg, 1  → 6
                                     add   reg, 1  → 6
   store counter ← 6
                                     store counter ← 6

   final counter = 6   (expected 7 — one update lost)
</code></pre>
<p><code>counter++</code> is <strong>not</strong> one operation. It is at least three machine instructions
(load, modify, store). The scheduler may switch threads <strong>between any two of
them</strong> (Part 0.1). When two threads interleave like above, both read the same
value, both write back an increment of that value, and one update vanishes.</p>
<blockquote>
<p><strong>Rule ▸</strong> Two threads must never access the same memory location concurrently
when at least one access is a <strong>write</strong>, unless that access is <strong>atomic</strong> or
protected by <strong>synchronization</strong> (mutex, condition variable edge, or a proper
<code>memory_order</code> — Part 3). Break this and the program has <strong>undefined behavior</strong>.</p>
</blockquote>
<p>The standard&rsquo;s term <strong>data race</strong> is narrower than &ldquo;race condition&rdquo; in everyday
speech. A race condition is any bug whose correctness depends on timing; a data
race is the specific UB trigger above. Many race conditions (TOCTOU below) involve
a data race on the check or the act.</p>
<hr />
<h2 id="512-read-modify-write-races">5.1.2 Read-modify-write races</h2>
<p>Any compound update — increment, append-to-list, bitwise OR, <code>balance -= amount</code>
— is a <strong>read-modify-write (RMW)</strong> sequence unless you make it indivisible:</p>
<pre><code>   logical:   shared = f(shared)     // one statement in source

   machine:   t = load(shared)
              t = f(t)
              store(shared, t)        // three steps → three preemption points
</code></pre>
<p>Fixes force atomicity at the right level:</p>
<table>
<thead>
<tr>
<th>Fix</th>
<th>Mechanism</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td>Mutex</td>
<td>Only one thread in the critical section</td>
<td>General shared state</td>
</tr>
<tr>
<td>AtomicInteger atomics</td>
<td>Hardware RMW (<code>fetch_add</code>, <code>compare_exchange</code>)</td>
<td>Counters, flags, lock-free structures</td>
</tr>
<tr>
<td>Immutability</td>
<td>No writes after publish</td>
<td>Config, message payloads</td>
</tr>
<tr>
<td>Confinement</td>
<td>Only one thread ever touches the data</td>
<td>Per-thread accumulators (Part 5.4)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The API ▸</strong>
\`\`\`cpp</p>
<h1 id="include">include <atomic></h1>
<p>std::atomic<long> counter{0};
counter.fetch_add(1, std::memory_order_relaxed);  // single indivisible RMW
// or: ++counter;  (atomic overload — seq_cst by default)
<code></code>c</p>
<h1 id="include_1">include <stdatomic.h></h1>
<p>atomic_fetch_add(&amp;counter, 1);   // C11 equivalent
\`\`\`</p>
</blockquote>
<hr />
<h2 id="513-check-then-act-toctou">5.1.3 Check-then-act (TOCTOU)</h2>
<p>A subtler race: a thread <strong>checks</strong> a condition, then <strong>acts</strong> on it, but another
thread changes the condition in between:</p>
<pre><code>   thread A (consumer)               thread B (producer)

   wait / return &quot;empty&quot;             // A acted on stale knowledge
</code></pre>

<li><strong>File/resource checks</strong>: <code>if (access(path)) open(path)</code> — the file may change

establish a happens-before edge.</p>

#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;

entirely when the data model allows it.</p>
<hr />
<h2 id="515-detection-with-threadsanitizer">5.1.5 Detection with ThreadSanitizer</h2>
<p>Races are <strong>non-deterministic</strong> — the bug may hide for billions of iterations.
<strong>ThreadSanitizer (TSan)</strong> instruments every memory access at compile time and
reports unsynchronized conflicting accesses at runtime:</p>
<pre><code class="language-bash"># C++

<pre><code>   shared mutable state touched by ≥2 threads?

<p><strong>Deadlock</strong> is a state where two or more threads are <strong>blocked forever</strong>, each
waiting for a resource held by another in the group. No thread makes progress;
CPU time may drop to zero while everyone sleeps on a lock. Unlike a race (wrong
answer), deadlock is <strong>total stall</strong> — and it often appears only under production
load when lock orderings diverge for the first time.</p>
<hr />
<h2 id="521-the-four-coffman-conditions">5.2.1 The four Coffman conditions</h2>
<p>Deadlock requires <strong>all four</strong> conditions simultaneously (Coffman, 1971). Break
<strong>any one</strong> and deadlock cannot occur:</p>
<pre><code>   ┌─────────────────────────┬────────────────────────────────────────────┐
   │ 1. Mutual exclusion     │ Resource usable by only one thread at a time │
   │ 2. Hold and wait        │ Thread holds ≥1 resource while waiting for more│
   │ 3. No preemption        │ Resources released only voluntarily by holder  │
   │ 4. Circular wait        │ T0 waits for T1 waits for ... waits for T0     │
   └─────────────────────────┴────────────────────────────────────────────┘
</code></pre>
<p>Mutexes provide (1) by definition. Normal lock APIs provide (3) — the OS will not
forcibly take a mutex from a thread. Deadlock prevention strategies target (2)
and (4) most often.</p>
<p><img alt="Circular wait: each thread holds one lock and waits for another" src="figures/deadlock.svg" /></p>
<hr />
<h2 id="522-the-classic-two-lock-circular-wait">5.2.2 The classic two-lock circular wait</h2>
<p>The textbook example: two threads, two mutexes, <strong>opposite acquisition order</strong>:</p>
<pre><code>   thread A                          thread B
   ────────                          ────────
   lock(m1)  ✓
                                     lock(m2)  ✓
   lock(m2)  … waits for B
                                     lock(m1)  … waits for A

   ═══════════════ DEADLOCK ═══════════════
   A holds m1, wants m2
   B holds m2, wants m1  → circular wait (condition 4)
</code></pre>
<pre><code class="language-cpp">// BROKEN — opposite lock order → deadlock (may hang forever)
std::mutex m1, m2;

void thread_a() {
    std::lock_guard g1(m1);
    std::this_thread::sleep_for(std::chrono::milliseconds(50)); // widen window
    std::lock_guard g2(m2);   // blocks if B holds m2
}

void thread_b() {
    std::lock_guard g2(m2);
    std::this_thread::sleep_for(std::chrono::milliseconds(50));
    std::lock_guard g1(m1);   // blocks if A holds m1
}
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> Blocked mutex waiters sit on a futex queue in the kernel.
Neither thread runs the critical section; neither releases its held lock.
<code>top</code> shows threads in <code>D</code> (uninterruptible sleep) or low CPU — classic symptom.</p>
</blockquote>
<p>This is the same structural bug as the <strong>dining philosophers</strong> (Part 4.4) when
every philosopher picks up the left fork first and the table is full.</p>
<hr />
<h2 id="523-prevention-global-lock-ordering">5.2.3 Prevention: global lock ordering</h2>
<p>Assign every lock in the system a <strong>unique rank</strong>. Always acquire in <strong>increasing
rank</strong> (or decreasing — but be consistent):</p>
<pre><code class="language-cpp">// FIXED — global order: always lock lower address first
void take_both(std::mutex&amp; a, std::mutex&amp; b) {
    if (&amp;a &lt; &amp;b) {
        std::lock_guard g1(a);
        std::lock_guard g2(b);
    } else {
        std::lock_guard g1(b);
        std::lock_guard g2(a);
    }
    // ... critical section ...
}
// locks released at scope end
</code></pre>
<p>Address order is a cheap total order when locks are distinct objects. For
production code, use an explicit <strong>lock hierarchy</strong> (level numbers assigned at
design time):</p>
<pre><code>   hierarchy level 0:  coarse &quot;database&quot; lock
   hierarchy level 1:  per-table locks
   hierarchy level 2:  per-row locks

   Rule: never acquire level N while holding level M if N &lt;= M
</code></pre>
<blockquote>
<p><strong>Rule ▸</strong> Document the hierarchy. Code review checks that every multi-lock
path respects it. One violation reintroduces circular wait.</p>
</blockquote>
<hr />
<h2 id="524-prevention-stdscoped_lock--stdlock">5.2.4 Prevention: std::scoped_lock / std::lock</h2>
<p>C++17&rsquo;s <code>std::scoped_lock</code> (and C++11&rsquo;s <code>std::lock</code>) acquire <strong>multiple mutexes
atomically</strong> using internal try-and-backoff — they cannot deadlock <em>each other</em>:</p>
<blockquote>
<p><strong>The API ▸</strong>
\`\`\`cpp</p>
<h1 id="include">include <mutex></h1>
<p>std::scoped_lock lock(m1, m2, m3);   // C++17 — all or none, deadlock-free
// equivalent:
std::lock(m1, m2);
std::lock_guard g1(m1, std::adopt_lock);
std::lock_guard g2(m2, std::adopt_lock);
\`\`\`</p>
</blockquote>
<pre><code class="language-cpp">// FIXED — scoped_lock breaks circular wait via try-and-backoff
void worker() {
    std::scoped_lock g(m1, m2);   // ✓ safe regardless of call-site order
    // critical section using both locks
}
</code></pre>
<blockquote>
<p><strong>Under the hood ▸</strong> <code>std::lock</code> tries <code>try_lock</code> on all mutexes in a
deadlock-avoidance algorithm (try in varying order, release and retry on
failure). Worst case is <strong>livelock</strong> under extreme contention (Part 5.3) —
rare with OS mutexes, more relevant to spinlocks.</p>
</blockquote>
<hr />
<h2 id="525-prevention-try-lock--backoff">5.2.5 Prevention: try-lock + backoff</h2>
<p>When you cannot impose a global order (e.g. lock handoff protocols), use
<strong>try_lock</strong> and <strong>release everything</strong> on failure, then retry with backoff:</p>
<pre><code class="language-cpp">// FIXED — try both; release and backoff if either fails
bool try_take_both(std::mutex&amp; a, std::mutex&amp; b) {
    for (;;) {
        std::unique_lock la(a, std::try_to_lock);
        if (!la) { std::this_thread::yield(); continue; }
        std::unique_lock lb(b, std::try_to_lock);
        if (!lb) {
            la.unlock();
            std::this_thread::sleep_for(std::chrono::microseconds(100));
            continue;
        }
        // both held — la and lb release at return/destruction
        return true;
    }
}
</code></pre>
<p><strong>Trade-offs ▸</strong> Backoff turns potential deadlock into <strong>bounded retry</strong> and
breaks lock-step livelock (Part 5.3). Cost: latency jitter under contention.</p>
<hr />
<h2 id="526-detection">5.2.6 Detection</h2>
<p>Prevention is ideal; <strong>detection</strong> helps when third-party code holds locks you
cannot reorder:</p>
<table>
<thead>
<tr>
<th>Approach</th>
<th>How</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Watchdog / alarm</strong></td>
<td><code>alarm(2)</code> or a timer thread — if work doesn&rsquo;t finish, dump stacks</td>
</tr>
<tr>
<td><strong>Lock order graphs</strong></td>
<td>Static analyzers build &ldquo;must acquire A before B&rdquo; graphs</td>
</tr>
<tr>
<td><strong>TSan deadlock detector</strong></td>
<td><code>-fsanitize=thread</code> reports lock-order inversion at runtime</td>
</tr>
<tr>
<td><strong>JVM-style</strong></td>
<td>N/A in raw C++; some debug allocators track lock sets</td>
</tr>
</tbody>
</table>
<pre><code class="language-bash">g++ -std=c++17 -pthread -fsanitize=thread -g deadlock.cpp -o deadlock
./deadlock   # TSan: &quot;deadlock detected&quot; with both thread stacks
</code></pre>
<p>For pthread programs, <strong><code>pthread_mutexattr_settype(..., PTHREAD_MUTEX_ERRORCHECK)</code></strong>
returns <code>EDEADLK</code> when a thread tries to re-lock its own error-check mutex —
catches one class of self-deadlock, not circular wait between threads.</p>
<hr />
<h2 id="527-broken--fixed-complete-example">5.2.7 Broken → fixed: complete example</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread deadlock_demo.cpp -o deadlock_demo
#include &lt;chrono&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;

std::mutex m1, m2;

/* BROKEN — uncomment to hang:
void broken() {
    std::thread a([]{
        std::lock_guard g1(m1);
        std::this_thread::sleep_for(std::chrono::milliseconds(50));
        std::lock_guard g2(m2);
    });
    std::thread b([]{
        std::lock_guard g2(m2);
        std::this_thread::sleep_for(std::chrono::milliseconds(50));
        std::lock_guard g1(m1);
    });
    a.join(); b.join();
}
*/

void fixed_scoped() {
    auto work = []{ std::scoped_lock g(m1, m2); };
    std::thread a(work), b(work);
    a.join(); b.join();
    std::cout &lt;&lt; &quot;scoped_lock: ok\\n&quot;;
}

void fixed_order() {
    auto work = [](std::mutex&amp; x, std::mutex&amp; y){
        std::mutex&amp; first  = (&amp;x &lt; &amp;y) ? x : y;
        std::mutex&amp; second = (&amp;x &lt; &amp;y) ? y : x;
        std::lock_guard g1(first);
        std::lock_guard g2(second);
    };
    std::thread a([&amp;]{ work(m1, m2); });
    std::thread b([&amp;]{ work(m2, m1); });  // same order internally
    a.join(); b.join();
    std::cout &lt;&lt; &quot;global order: ok\\n&quot;;
}

int main() {
    fixed_scoped();
    fixed_order();
}
</code></pre>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>Deadlock needs <strong>mutual exclusion, hold-and-wait, no preemption, circular
  wait</strong> — break any one to prevent.</p>
</li>
<li>
<p>The two-lock <strong>opposite-order</strong> pattern is the canonical circular-wait example.</p>
</li>
<li><strong>Prevention</strong>: global lock ordering / hierarchy, <code>std::scoped_lock</code>, try-lock</li>
<li>backoff.</li>
<li><strong>Detection</strong>: TSan, watchdogs, lock-order static analysis.</li>
<li>Related stalls: <strong>livelock</strong> (threads run but don&rsquo;t progress — Part 5.3) and

</ul>

<p><strong>Deadlock</strong> (Part 5.2) freezes threads in a circular wait — nobody runs. <strong>Livelock</strong>
is worse in a different way: threads <strong>keep running</strong> but make <strong>no application
progress</strong>, usually because they politely yield to each other in a repeating
pattern. <strong>Starvation</strong> is when one thread <strong>never</strong> acquires a resource it needs,
while others proceed. Both are scheduling and locking pathologies; both require
mechanical understanding to fix.</p>
<hr />
<h2 id="531-livelock-the-corridor-metaphor">5.3.1 Livelock: the corridor metaphor</h2>
<p>Two people meet in a narrow corridor. Each steps aside to let the other pass —
in the <strong>same direction</strong>. They shuffle back and forth forever; neither passes:</p>
<pre><code>   time ──▶

   person A:  ← step   → step   ← step   → step   ...
   person B:  → step   ← step   → step   ← step   ...

   both active, zero progress
</code></pre>
<p>In code, the same pattern appears when two threads <strong>acquire one lock, fail on
the second, release both, and immediately retry</strong> — in perfect lock-step:</p>
<pre><code>   thread A:  lock m1  try m2 ✗  unlock m1  retry ...
   thread B:  lock m2  try m1 ✗  unlock m2  retry ...

   neither holds both; neither completes the transaction
</code></pre>
<p>This is not deadlock — no thread is blocked waiting on a futex. CPUs burn cycles;
the system looks &ldquo;busy&rdquo; but throughput is zero.</p>
<hr />
<h2 id="532-naive-try-lock--retry-without-backoff">5.3.2 Naive try-lock + retry without backoff</h2>
<p>The try-lock cure for deadlock (Part 5.2) <strong>becomes livelock</strong> if both threads
retry instantly:</p>
<pre><code class="language-cpp">// LIVLOCK-PRONE — no backoff between retries
bool transfer(std::mutex&amp; from, std::mutex&amp; to) {
    for (;;) {
        from.lock();
        if (to.try_lock()) {
            // ... move funds ...
            to.unlock();
            from.unlock();
            return true;
        }
        from.unlock();
        // immediate retry → synchronized with the other thread's retry
    }
}
</code></pre>
<blockquote>
<p><strong>Pitfall ▸</strong> <code>std::lock</code>&rsquo;s internal try-and-backoff can livelock under extreme
spinlock contention (busy-wait mutexes). OS mutexes usually sleep on failure,
which injects enough jitter to break lock-step — but <strong>do not rely on the
scheduler to save you</strong>.</p>
</blockquote>
<p><strong>Fix: randomized exponential backoff</strong> — after failure, sleep a random duration
before retry; double the cap on repeated failures (Ethernet CSMA/CD uses the same
idea):</p>
<pre><code class="language-cpp">// FIXED — randomized backoff breaks lock-step

    int backoff_us = 50;

        from.lock();
        if (to.try_lock()) {
            // ... critical section ...
            to.unlock();
            from.unlock();
            return true;

<p><strong>Trade-offs ▸</strong> Backoff adds latency under contention but guarantees eventual
progress with probability 1 (assuming fair scheduler). Too-aggressive backoff
hurts throughput; too-little recreates livelock.</p>
<hr />
<h2 id="533-starvation-one-thread-never-wins">5.3.3 Starvation: one thread never wins</h2>
<p><strong>Starvation</strong> means a thread is <strong>ready</strong> to run (or ready to acquire a lock) but
<strong>never gets the resource</strong> while others repeatedly do:</p>
<pre><code>   lock queue (unfair):  T1 T1 T1 T1 T1 T1 ...   T2 never reaches the front
                         ↑ high-priority or lucky thread keeps re-acquiring
</code></pre>
<p>Common causes:</p>
<table>
<thead>
<tr>
<th>Cause</th>
<th>Mechanism</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Unfair locks</strong></td>
<td><code>pthread_mutex</code> default may favor last owner (implementation-defined)</td>
</tr>
<tr>
<td><strong>Priority scheduling</strong></td>
<td>High-priority thread always preempts low-priority waiter</td>
</tr>
<tr>
<td><strong>Writer preference RW-lock</strong></td>
<td>Continuous readers block a waiting writer — or vice versa (Part 4.3)</td>

<tr>
<td><strong>Busy spinning</strong></td>

</tbody>

<p>Starvation is <strong>not</strong> UB — the program may be &ldquo;correct&rdquo; but <strong>unfair</strong> and

<h2 id="534-priority-inversion">5.3.4 Priority inversion</h2>
<p>A classic starvation variant on <strong>fixed-priority</strong> RTOS / real-time Linux:</p>
<pre><code>   low-priority L holds lock M

   medium-priority M preempts L        ← M runs instead of H!

   H: ── wants M ── BLOCKED ───────────────── ...

<p><strong>Fair locks</strong> (FIFO wait queue) guarantee <strong>bounded</strong> wait: a thread that
requests the lock eventually acquires it if every holder releases:</p>
<pre><code>   unfair (default-ish):     winner may jump the queue

</code></pre>

</li>
</ul>
<p>For <strong>CPU scheduling starvation</strong>, use explicit QoS: cgroups, <code>nice</code>, real-time
priorities — outside the language but part of production tuning.</p>
<hr />

<pre><code class="language-cpp">// g++ -std=c++17 -pthread livelock.cpp -o livelock

#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;random&gt;
#include &lt;thread&gt;

std::mutex m1, m2;

void try_both_no_backoff(int id, int&amp; attempts) {
    std::mutex&amp; first  = (id == 0) ? m1 : m2;

<h2 id="summary">Summary</h2>
<ul>

<p><strong>False sharing</strong> is a cache-coherence pathology: threads mutate <strong>logically
independent</strong> variables that happen to live on the <strong>same cache line</strong>, causing
the line to <strong>ping-pong</strong> between cores. No data race exists — each thread writes
its own field — yet parallel performance can be <strong>worse than serial</strong>. Part 5.1&rsquo;s
confinement fix assumes truly private cache lines; this chapter shows when
&ldquo;private&rdquo; variables are not private at the hardware level.</p>
<hr />
<h2 id="541-cache-lines-and-coherence">5.4.1 Cache lines and coherence</h2>
<p>CPUs do not track individual bytes for coherence. They track <strong>cache lines</strong>
(typically <strong>64 bytes</strong> on x86-64 and AArch64):</p>
<pre><code>   core 0 cache          core 1 cache
   ┌────────────────┐    ┌────────────────┐
   │ line @ 0x1000  │    │ line @ 0x1000  │   same physical line
   │  bytes 0..63   │    │  bytes 0..63   │
   └────────────────┘    └────────────────┘
            │                      │
            └────── bus / snoop ────┘
                   (MESI protocol)
</code></pre>
<p><strong>MESI</strong> (Modified / Exclusive / Shared / Invalid) states govern each line:</p>
<pre><code>   core 0 writes byte 0  →  line becomes Modified on core 0
                          →  Invalid on all other cores (RFO: read-for-ownership)
   core 1 writes byte 40 →  steals line to core 1
                          →  core 0's copy invalidated again
</code></pre>
<p>Every write to <strong>any byte</strong> in the line is a coherence transaction for the
<strong>whole line</strong>.</p>
<p><img alt="Independent variables on one cache line ping-pong between cores" src="figures/false-sharing.svg" /></p>
<blockquote>
<p><strong>Under the hood ▸</strong> A <strong>read-modify-write</strong> on a line another core owns costs
~100–300 cycles (cross-socket higher). Millions of increments on false-shared
counters turn a embarrassingly parallel loop into a coherence traffic storm.</p>
</blockquote>
<hr />
<h2 id="542-the-symptom-parallel-slower-than-serial">5.4.2 The symptom: parallel slower than serial</h2>
<p>Layout that looks thread-safe:</p>
<pre><code class="language-cpp">struct counters {
    std::atomic&lt;long&gt; c0;   // thread 0 only
    std::atomic&lt;long&gt; c1;   // thread 1 only
    std::atomic&lt;long&gt; c2;   // thread 2 only
    std::atomic&lt;long&gt; c3;   // thread 3 only
};   // all four atomics likely fit in ONE 64-byte line
</code></pre>
<p>Each thread increments <strong>its own</strong> <code>c[i]</code> — no logical sharing. But:</p>
<pre><code>   memory layout (one cache line):
   ┌──────┬──────┬──────┬──────┬ ... padding ... ┐
   │  c0  │  c1  │  c2  │  c3  │                 │
   └──────┴──────┴──────┴──────┴─────────────────┘
     ↑ T0 writes here invalidates the ENTIRE line on T1,T2,T3
</code></pre>
<p>Benchmark signature:</p>
<pre><code>   1 thread:  1.0 s
   4 threads: 3.5 s   ← scaling inverted — classic false sharing
</code></pre>
<p>This is <strong>not</strong> a race (atomics synchronize the RMW). It is a <strong>performance bug</strong>

<table>
<thead>
<tr>
<th>Tool</th>
<th>What it shows</th>

</thead>
<tbody>
<tr>
<td><strong><code>perf c2c</code></strong> (Linux)</td>
<td>Cache-line contention — HITM (hit modified) counts per line</td>
</tr>
<tr>
<td><strong><code>perf stat -e</code></strong></td>
<td><code>cache-misses</code>, <code>L1-dcache-load-misses</code>, <code>mem_load_uops_retired.hit_lfb</code></td>
</tr>
<tr>
<td><strong>Intel VTune</strong></td>
<td>&ldquo;False sharing&rdquo; analysis, HITM hotspots</td>
</tr>
<tr>
<td><strong>Scaling curve</strong></td>
<td>Throughput flat or negative as threads increase</td>
</tr>
</tbody>
</table>
<pre><code class="language-bash"># record HITM events (may need: echo 1 | sudo tee /proc/sys/kernel/perf_event_paranoid)
perf c2c record -a -- ./bench
perf c2c report
# look for lines with high HITM count shared by multiple threads
</code></pre>
<p>TSan will <strong>not</strong> flag false sharing — there is no data race.</p>

<h2 id="544-fixes-alignment-and-padding">5.4.4 Fixes: alignment and padding</h2>
<p>Put each hot per-thread variable on its <strong>own cache line</strong>:</p>
<blockquote>
<p><strong>The API ▸</strong>
\`\`\`cpp</p>
<h1 id="include--c17">include <new>   // C++17</h1>
<p>alignas(64) std::atomic<long> counter;   // manual line size
// portable when available:
alignas(std::hardware_destructive_interference_size) std::atomic<long> counter;
<code>\`\`</code>std::hardware_destructive_interference_size<code>(C++17,</code><new><code>) is the minimum
offset to avoid false sharing — typically 64.</code>hardware_constructive_interference_size\`
is the max recommended group size for true sharing.</p>
</blockquote>
<pre><code class="language-cpp">#ifdef __cpp_lib_hardware_interference_size
constexpr size_t CL = std::hardware_destructive_interference_size;
#else
constexpr size_t CL = 64;
#endif

struct alignas(CL) PaddedCounter {
    std::atomic&lt;long&gt; value{0};
    char pad[CL - sizeof(std::atomic&lt;long&gt;)];  // pad to full line
};
PaddedCounter slots[N];   // each slot on its own line(s)
</code></pre>
<p>Alternative: <strong><code>thread_local</code></strong> accumulators + one merge at the end (Part 6.3
reduction pattern) — zero cross-core writes during the hot loop.</p>
<p><strong>Trade-offs ▸</strong> Padding increases memory footprint (64 B per counter vs 8 B).
For millions of counters, use <strong>striped aggregation</strong> (N buffers, hash thread id
to buffer) instead of N full lines.</p>
<hr />
<h2 id="545-beforeafter-benchmark">5.4.5 Before/after benchmark</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread -O2 false_sharing.cpp -o false_sharing
#include &lt;atomic&gt;
#include &lt;chrono&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

constexpr int N = 4;
constexpr int ITERS = 50'000'000;

#ifdef __cpp_lib_hardware_interference_size
constexpr size_t CL = std::hardware_destructive_interference_size;
#else
constexpr size_t CL = 64;
#endif

struct Bad {
    std::atomic&lt;long&gt; c[N];   // packed — false sharing
};

struct alignas(CL) Padded {
    std::atomic&lt;long&gt; counter{0};
    char pad[CL - sizeof(std::atomic&lt;long&gt;)];
};

template&lt;class F&gt;
double bench(const char* name, F f) {
    auto t0 = std::chrono::steady_clock::now();
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; N; ++i) ts.emplace_back(f, i);
    for (auto&amp; t : ts) t.join();
    double sec = std::chrono::duration&lt;double&gt;(
        std::chrono::steady_clock::now() - t0).count();
    std::cout &lt;&lt; name &lt;&lt; &quot;: &quot; &lt;&lt; sec &lt;&lt; &quot; s\\n&quot;;
    return sec;
}

int main() {
    Bad bad{};
    double t_bad = bench(&quot;false-shared (bad)&quot;, [&amp;](int id){
        for (int k = 0; k &lt; ITERS; ++k)
            bad.c[id].fetch_add(1, std::memory_order_relaxed);
    });

    double t_good = bench(&quot;padded (good)  &quot;, [&amp;](int id){
        for (int k = 0; k &lt; ITERS; ++k)
            good[id].counter.fetch_add(1, std::memory_order_relaxed);

    std::cout &lt;&lt; &quot;speedup: &quot; &lt;&lt; (t_bad / t_good) &lt;&lt; &quot;x\\n&quot;;
}
</code></pre>
<p>Typical output on a quad-core machine: <strong>5–20×</strong> speedup after padding. The
&ldquo;bad&rdquo; version is often slower with 4 threads than with 1.</p>
<blockquote>
<p><strong>Rule ▸</strong> Any <strong>write-hot</strong> per-thread field in a parallel loop must be
line-aligned or accumulated locally. Read-mostly sharing of one line is fine
(constructive interference).</p>
</blockquote>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>CPUs coherence-track <strong>64-byte cache lines</strong>; one write invalidates the whole
  line on other cores (MESI).</p>
</li>
<li>
<p><strong>False sharing</strong> = independent variables on the same line → coherence
  ping-pong → parallel can lose to serial.</p>
</li>
<li>
<p>Detect with <strong><code>perf c2c</code></strong>, VTune, or negative scaling curves — not TSan.</p>
</li>
<li>Fix with <strong><code>alignas(64)</code></strong> / <code>hardware_destructive_interference_size</code>, padding,

<p>Lock-free algorithms built on <strong>compare-and-swap (CAS)</strong> (Part 3.2) assume: &ldquo;if
the value is still what I read, nothing changed.&rdquo; The <strong>ABA problem</strong> proves that
assumption false: the value can <strong>match</strong> while the <strong>structure</strong> changed — and a
CAS &ldquo;success&rdquo; can corrupt a linked data structure. It is the subtlest failure mode
of naive lock-free code.</p>
<hr />
<h2 id="551-the-scenario-lock-free-stack">5.5.1 The scenario: lock-free stack</h2>
<p>Consider a lock-free stack with head pointer <code>top</code>:</p>
<pre><code>   initial:   top → A → B → C → nullptr
</code></pre>
<p>Thread <strong>T1</strong> reads <code>head = A</code>, saves <code>next = A-&gt;next</code> (which is B), and is
preempted before CAS.</p>
<p>Thread <strong>T2</strong> runs:</p>
<pre><code>   pop A          top → B → C
   pop B          top → C
   (A and B freed or moved to free list)
   push new node  reuses address of old A
                  top → A' → C     (A' at same address as old A)
</code></pre>
<p>Thread <strong>T1</strong> resumes and executes:</p>
<pre><code>   CAS(head, A, B)   // &quot;expected&quot; A matches current head — SUCCESS
</code></pre>
<p>But <strong>B was already popped and may be freed</strong>. Head now points to <strong>stale memory</strong>.
The list is corrupt — use-after-free, double-free, or silent data loss.</p>
<p><img alt="T1's CAS succeeds because head looks like A again, but B is stale" src="figures/aba-problem.svg" /></p>
<pre><code>   time ──▶

   T1:  read head=A, next=B
   T2:              pop A, pop B, free A, push X (addr == old A)
   T1:  CAS(head, A, B) ✓  →  head → B (FREED — disaster)
</code></pre>
<blockquote>
<p><strong>Pitfall ▸</strong> &ldquo;CAS succeeded&rdquo; means <strong>the bit pattern matched</strong>, not &ldquo;the world
is unchanged since my load.&rdquo; Any algorithm that CASes a <strong>pointer alone</strong> on a
structure with <strong>reuse</strong> is ABA-vulnerable.</p>
</blockquote>
<hr />
<h2 id="552-why-it-happens-memory-reuse">5.5.2 Why it happens: memory reuse</h2>
<p>ABA requires <strong>address reuse</strong>:</p>
<ol>
<li>Node <strong>A</strong> is freed to an allocator pool.</li>
<li>A new allocation returns the <strong>same address</strong> for a different object.</li>
<li>The pointer value <strong>A</strong> appears again at <code>head</code>.</li>
</ol>
<p>Without reuse (unique addresses forever), ABA is theoretically avoided — impractical
for general allocators. Real systems recycle heap blocks aggressively.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> Even <strong>GC&rsquo;d languages</strong> can ABA if the GC moves/reuses
identity in ways visible to native CAS (less common in Java <code>AtomicReference</code>,
but relevant in C/C++ and in <strong>epoch reclamation</strong> bugs).</p>
</blockquote>
<hr />
<h2 id="553-fix-1-tagged--versioned-pointers">5.5.3 Fix 1: tagged / versioned pointers</h2>
<p>Pack a <strong>monotonic counter (tag)</strong> with the pointer. Increment the tag on <strong>every</strong>
head change. CAS the <strong>(pointer, tag)</strong> pair — double-width CAS (128-bit on x86-64
with <code>-mcx16</code>, 16-byte aligned on AArch64):</p>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread aba_tagged.cpp -o aba_tagged
#include &lt;atomic&gt;
#include &lt;cstdint&gt;
#include &lt;iostream&gt;

struct Node { int value; Node* next; };

struct TaggedPtr {
    Node*     ptr;
    uintptr_t tag;
    bool operator==(const TaggedPtr&amp; o) const {
        return ptr == o.ptr &amp;&amp; tag == o.tag;
    }
};

class TaggedStack {
    std::atomic&lt;TaggedPtr&gt; head_{ TaggedPtr{nullptr, 0} };
public:
    void push(int v) {
        Node* n = new Node{v, nullptr};
        TaggedPtr cur = head_.load(std::memory_order_relaxed);
        for (;;) {
            n-&gt;next = cur.ptr;
            TaggedPtr next{n, cur.tag + 1};
            if (head_.compare_exchange_weak(cur, next,
                    std::memory_order_release,
                    std::memory_order_relaxed))
                return;
        }
    }
    bool pop(int&amp; out) {
        TaggedPtr cur = head_.load(std::memory_order_acquire);
        for (;;) {
            if (!cur.ptr) return false;
            TaggedPtr next{cur.ptr-&gt;next, cur.tag + 1};
            if (head_.compare_exchange_weak(cur, next,
                    std::memory_order_acquire,
                    std::memory_order_relaxed)) {
                out = cur.ptr-&gt;value;
                delete cur.ptr;   // still unsafe without deferred free — see below
                return true;
            }
        }
    }
};
</code></pre>
<p>When T2 puts A back, the <strong>tag</strong> has incremented twice (pop, pop, push). T1&rsquo;s
stale <code>(A, tag_old)</code> fails CAS — ✓ safe from ABA on the head field.</p>
<p><strong>Trade-offs ▸</strong> Tag width is finite — <strong>tag wraparound</strong> reintroduces ABA after
2^k operations (64-bit tag: never in practice). <code>std::atomic&lt;TaggedPtr&gt;</code> may fall
back to a hidden lock if not lock-free — check <code>is_lock_free()</code>.</p>
<hr />
<h2 id="554-fix-2-hazard-pointers">5.5.4 Fix 2: hazard pointers</h2>
<p><strong>Hazard pointers</strong> (Michael, 2004): each thread publishes &ldquo;I am reading node X&rdquo;
in a global hazard list. <strong>Reclamation is deferred</strong> until no hazard pointer
references X:</p>
<pre><code>   T1: hazard[0] = B     (announces: don't free B)
   T2: wants to free B   → scans hazards → B still protected → defer
   T1: CAS fails or completes, clears hazard[0]
   T2: retries reclamation → B safe to free
</code></pre>
<p>Used in production lock-free maps (Folly, ConcurrencyKit). Correct but fiddly —
reference counting or epoch schemes trade complexity for throughput.</p>
<hr />
<h2 id="555-fix-3-rcu--epoch-based-reclamation">5.5.5 Fix 3: RCU / epoch-based reclamation</h2>
<p><strong>Read-Copy-Update (RCU)</strong> (Linux kernel) and <strong>epoch-based reclamation (EBR)</strong>:</p>
<pre><code>   readers enter epoch E
   writer removes node, queues it for epoch E+1
   when all readers leave epoch E, batch-free queued nodes
</code></pre>
<p>Readers incur <strong>zero atomic RMW</strong> on the hot path — excellent read throughput.
Writers pay deferred free batching. C++ users: <code>liburcu</code>, Folly&rsquo;s <code>rcu</code>, or
custom epoch counters (Part 3.2 lock-free stack example pairs with EBR).</p>
<blockquote>
<p><strong>Rule ▸</strong> In C++, <strong>never <code>delete</code> a node immediately after a lock-free pop</strong>
unless a hazard pointer, RCU, or epoch scheme proves no other thread still
reads it. ABA-safe CAS on the pointer is necessary but <strong>not sufficient</strong> for
safe memory reclamation.</p>
</blockquote>
<hr />
<h2 id="556-relation-to-the-memory-model">5.5.6 Relation to the memory model</h2>
<p>ABA is orthogonal to <strong>memory_order</strong> (Part 3.4): even <code>memory_order_seq_cst</code>
CAS does not detect structural change — it only compares bits. Tagging and
reclamation are <strong>lifetime</strong> problems, not ordering problems. Acquire/release on
pop still required so <code>cur.ptr-&gt;next</code> is visible before dereference.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p><strong>ABA</strong>: CAS sees expected value <strong>A</strong> again, but the structure changed (A was
  removed, B freed, A reused) → successful CAS corrupts the list.</p>
</li>
<li>
<p>&ldquo;Value matched&rdquo; ≠ &ldquo;nothing changed&rdquo; — pointer-only CAS on reused memory is
  unsafe.</p>
</li>
<li>
<p><strong>Fixes</strong>: <strong>tagged pointers</strong> (double-width CAS), <strong>hazard pointers</strong>,
  <strong>RCU/epoch reclamation</strong> for safe freeing.</p>
</li>
<li>
<p>Tagging stops stale CAS; reclamation stops use-after-free — you need both for a
  production lock-free stack (Part 3.2).</p>
</li>
</ul>
