  { name: `49. Examples / Patterns / Active Object`, path: `examples/03_patterns/05_active_object.cpp`, dir: `examples/03_patterns`, words: 359, mins: 2, body: `<h1 id="05_active_objectcpp">05_active_object.cpp</h1>
<pre><code class="language-cpp">// 05_active_object.cpp -- Encapsulate state behind a private worker thread.
//
//  Idea: instead of exposing methods that grab a mutex, the object owns
//  ONE thread that is the SOLE accessor of its state. Public methods
//  enqueue messages (lambdas) onto an internal queue. The thread executes
//  them one at a time. No mutex needed for the state itself.
//
//      caller             active object
//      ------             -------------
//      obj.add(5) ------&gt; [worker] thread
//      obj.add(10) -----&gt;   queue: [add(5), add(10), get]
//      auto f = obj.get()-&gt;[worker pops &amp; runs each]
//
//  Benefits:
//      - State serialized by the queue ordering.
//      - Easy to reason: looks like a single-threaded actor.
//
//  Drawbacks:
//      - One thread per object can be expensive (use a shared scheduler).
//      - Latency = queue depth.

#include &lt;thread&gt;
#include &lt;mutex&gt;
#include &lt;condition_variable&gt;
#include &lt;queue&gt;
#include &lt;future&gt;
#include &lt;iostream&gt;
#include &lt;functional&gt;

class Account {
    long balance_ = 0;            // accessed ONLY by worker_
    std::queue&lt;std::function&lt;void()&gt;&gt; q_;
    std::mutex                m_;
    std::condition_variable   cv_;
    bool                      done_ = false;
    std::thread               worker_;

    void run() {
        for (;;) {
            std::function&lt;void()&gt; job;
            {
                std::unique_lock g(m_);
                cv_.wait(g, [&amp;]{ return done_ || !q_.empty(); });
                if (done_ &amp;&amp; q_.empty()) return;
                job = std::move(q_.front()); q_.pop();
            }
            job();
        }
    }
    void post(std::function&lt;void()&gt; f) {
        { std::lock_guard g(m_); q_.push(std::move(f)); }
        cv_.notify_one();
    }
public:
    Account() : worker_([this]{ run(); }) {}
    ~Account() {
        { std::lock_guard g(m_); done_ = true; }
        cv_.notify_all();
        worker_.join();
    }

    // Public API: returns futures. The actual work happens on the worker thread.
    std::future&lt;void&gt; deposit(long amount) {
        auto p = std::make_shared&lt;std::promise&lt;void&gt;&gt;();
        auto f = p-&gt;get_future();
        post([this, amount, p]{ balance_ += amount; p-&gt;set_value(); });
        return f;
    }
    std::future&lt;bool&gt; withdraw(long amount) {
        auto p = std::make_shared&lt;std::promise&lt;bool&gt;&gt;();
        auto f = p-&gt;get_future();
        post([this, amount, p]{
            if (balance_ &gt;= amount) { balance_ -= amount; p-&gt;set_value(true); }
            else                    { p-&gt;set_value(false); }
        });
        return f;
    }
    std::future&lt;long&gt; get_balance() {
        auto p = std::make_shared&lt;std::promise&lt;long&gt;&gt;();
        auto f = p-&gt;get_future();
        post([this, p]{ p-&gt;set_value(balance_); });
        return f;
    }
};

int main()
{
    Account a;

    a.deposit(100).get();
    a.deposit(50).get();
    std::cout &lt;&lt; &quot;balance: &quot; &lt;&lt; a.get_balance().get() &lt;&lt; &quot;\\n&quot;;

    bool ok = a.withdraw(120).get();
    std::cout &lt;&lt; &quot;withdraw 120 -&gt; &quot; &lt;&lt; (ok?&quot;ok&quot;:&quot;insufficient&quot;) &lt;&lt; &quot;\\n&quot;;
    std::cout &lt;&lt; &quot;balance: &quot; &lt;&lt; a.get_balance().get() &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `50. Examples / Patterns / Pipeline`, path: `examples/03_patterns/06_pipeline.cpp`, dir: `examples/03_patterns`, words: 325, mins: 2, body: `<h1 id="06_pipelinecpp">06_pipeline.cpp</h1>
<pre><code class="language-cpp">// 06_pipeline.cpp -- Stages connected by bounded queues.
//
//      [source] -&gt; q1 -&gt; [stage1: square] -&gt; q2 -&gt; [stage2: stringify] -&gt; q3 -&gt; [sink]
//
//  Each stage is a thread. Items flow forward; back-pressure is automatic
//  because each queue is bounded.
//
//      In the source: produce items.
//      In each stage: pop, transform, push.
//      In the sink:   pop, print.
//      Shutdown:      source closes q1; each stage detects &quot;no more input,
//                     queue drained&quot; and closes its output queue, then exits.
//
//  Diagram:
//
//      stage1 q       stage2 q       sink q
//      +--------+     +--------+     +--------+
//      |        |     |        |     |        |
//      | source |----&gt;| square |----&gt;| str    |----&gt;| sink
//      |        |     |        |     |        |     |
//      +--------+     +--------+     +--------+
//
//  Pipelines are great when work has natural stages that can run in
//  parallel and items are independent.

#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;queue&gt;
#include &lt;mutex&gt;
#include &lt;condition_variable&gt;
#include &lt;optional&gt;
#include &lt;string&gt;
#include &lt;chrono&gt;

template &lt;class T&gt;
class BQ {
    std::queue&lt;T&gt; q_;
    size_t cap_;
    bool closed_ = false;
    std::mutex m_;
    std::condition_variable cv_full_, cv_empty_;
public:
    explicit BQ(size_t cap) : cap_(cap) {}
    void push(T v) {
        std::unique_lock g(m_);
        cv_full_.wait(g, [&amp;]{ return q_.size() &lt; cap_ || closed_; });
        if (closed_) return;
        q_.push(std::move(v));
        cv_empty_.notify_one();
    }
    std::optional&lt;T&gt; pop() {
        std::unique_lock g(m_);
        cv_empty_.wait(g, [&amp;]{ return !q_.empty() || closed_; });
        if (q_.empty()) return std::nullopt;
        T v = std::move(q_.front()); q_.pop();
        cv_full_.notify_one();
        return v;
    }
    void close() {
        { std::lock_guard g(m_); closed_ = true; }
        cv_empty_.notify_all(); cv_full_.notify_all();
    }
};

int main()
{
    BQ&lt;int&gt;         q1(4);
    BQ&lt;long&gt;        q2(4);
    BQ&lt;std::string&gt; q3(4);

    std::thread source([&amp;]{
        for (int i = 1; i &lt;= 12; ++i) {
            q1.push(i);
            std::this_thread::sleep_for(std::chrono::milliseconds(30));
        }
        q1.close();
    });

    std::thread stage1([&amp;]{
        while (auto v = q1.pop()) q2.push(long(*v) * (*v));
        q2.close();
    });

    std::thread stage2([&amp;]{
        while (auto v = q2.pop()) q3.push(&quot;(&quot; + std::to_string(*v) + &quot;)&quot;);
        q3.close();
    });

    std::thread sink([&amp;]{
        while (auto s = q3.pop()) std::cout &lt;&lt; &quot;  sink: &quot; &lt;&lt; *s &lt;&lt; &quot;\\n&quot;;
    });

    source.join(); stage1.join(); stage2.join(); sink.join();
}

</code></pre>` },
  { name: `51. Examples / Patterns / Work Stealing`, path: `examples/03_patterns/07_work_stealing.cpp`, dir: `examples/03_patterns`, words: 491, mins: 2, body: `<h1 id="07_work_stealingcpp">07_work_stealing.cpp</h1>
<pre><code class="language-cpp">// 07_work_stealing.cpp -- Per-worker deques + steal-from-others.
//
//  When tasks are unevenly distributed, idle workers can STEAL work from
//  other workers' queues. Used by TBB, Cilk, Go scheduler, ForkJoin in JVM.
//
//      Each worker pushes/pops from its own deque (LIFO from its end -&gt; warm cache):
//
//          Worker 0 deque: [t0, t1, t2, t3]
//          Worker 1 deque: [t4, t5]
//          Worker 2 deque: []
//
//      Worker 2 has nothing to do; steals from Worker 0's OTHER end (FIFO):
//
//          Worker 0 deque: [t1, t2, t3]
//          Worker 2: now executing t0
//
//  Why steal from the OPPOSITE end?
//      - Owner pops from one end (hot tasks with cache locality).
//      - Thieves pop from the other end (older tasks, cold anyway).
//      - Reduces contention.
//
//  This file is a simplified, MUTEX-PROTECTED deque pool (not lock-free, but
//  illustrates the idea). Production work-stealing uses Chase-Lev deques.

#include &lt;atomic&gt;
#include &lt;chrono&gt;
#include &lt;condition_variable&gt;
#include &lt;deque&gt;
#include &lt;functional&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;random&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

class WorkStealingPool {
    using Task = std::function&lt;void()&gt;;

    struct WorkerData {
        std::deque&lt;Task&gt; dq;
        std::mutex       m;
    };

    std::vector&lt;std::unique_ptr&lt;WorkerData&gt;&gt; data_;
    std::vector&lt;std::thread&gt;                 workers_;
    std::atomic&lt;bool&gt;                        stop_{false};
    std::atomic&lt;int&gt;                         pending_{0};

    Task pop_local(int who) {
        auto&amp; d = *data_[who];
        std::lock_guard g(d.m);
        if (d.dq.empty()) return {};
        Task t = std::move(d.dq.back());           // LIFO from back
        d.dq.pop_back();
        return t;
    }
    Task steal_from(int victim) {
        auto&amp; d = *data_[victim];
        std::lock_guard g(d.m);
        if (d.dq.empty()) return {};
        Task t = std::move(d.dq.front());          // FIFO from front
        d.dq.pop_front();
        return t;
    }

    void worker_loop(int id) {
        std::mt19937 rng(id);
        while (!stop_.load()) {
            Task t = pop_local(id);
            if (!t) {
                // Try to steal.
                for (size_t k = 0; k &lt; data_.size(); ++k) {
                    int victim = rng() % int(data_.size());
                    if (victim == id) continue;
                    t = steal_from(victim);
                    if (t) break;
                }
            }
            if (t) { t(); pending_.fetch_sub(1); }
            else if (pending_.load() == 0 &amp;&amp; stop_.load()) break;
            else std::this_thread::yield();
        }
    }

public:
    explicit WorkStealingPool(size_t n) {
        for (size_t i = 0; i &lt; n; ++i) data_.emplace_back(std::make_unique&lt;WorkerData&gt;());
        for (size_t i = 0; i &lt; n; ++i)
            workers_.emplace_back([this, i]{ worker_loop(int(i)); });
    }
    ~WorkStealingPool() {
        // Drain
        while (pending_.load() &gt; 0) std::this_thread::yield();
        stop_.store(true);
        for (auto&amp; w : workers_) w.join();
    }

    // Submit to round-robin worker for demo.
    void submit(Task t) {
        static std::atomic&lt;int&gt; rr{0};
        int who = rr.fetch_add(1) % int(data_.size());
        {
            std::lock_guard g(data_[who]-&gt;m);
            data_[who]-&gt;dq.push_back(std::move(t));
        }
        pending_.fetch_add(1);
    }
};

int main()
{
    WorkStealingPool pool(4);

    std::atomic&lt;long&gt; sum{0};
    for (int i = 1; i &lt;= 200; ++i)
        pool.submit([&amp;, i]{
            std::this_thread::sleep_for(std::chrono::milliseconds(i % 5));
            sum.fetch_add(i, std::memory_order_relaxed);
        });

    // Wait by destructing the pool.
    // (In real code, expose a wait() method.)
    {
        // Force pool to flush before printing
        while (true) {
            std::this_thread::sleep_for(std::chrono::milliseconds(50));
            // Crude completion check: read from internal pending via friend in real code.
            // Here we just sleep enough.
            break;
        }
    }
    // Sleep enough for all tasks to finish.
    std::this_thread::sleep_for(std::chrono::milliseconds(500));
    std::cout &lt;&lt; &quot;sum=&quot; &lt;&lt; sum.load()
              &lt;&lt; &quot; expected=&quot; &lt;&lt; (200 * 201 / 2) &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `52. Examples / Patterns / Double Checked Locking`, path: `examples/03_patterns/08_double_checked_locking.cpp`, dir: `examples/03_patterns`, words: 375, mins: 2, body: `<h1 id="08_double_checked_lockingcpp">08_double_checked_locking.cpp</h1>
<pre><code class="language-cpp">// 08_double_checked_locking.cpp -- Lazy initialization, the right way.
//
//  Classic broken DCL (pre-C++11):
//
//      static Singleton* p = nullptr;
//      Singleton* get() {
//          if (!p) {                       &lt;-- racy read
//              lock();
//              if (!p) p = new Singleton;  &lt;-- racy: store before construction visible
//              unlock();
//          }
//          return p;
//      }
//
//  The bug: another thread can read \`p\` non-null but see Singleton's
//  members not yet initialized due to instruction reordering.
//
//  CORRECT alternatives:
//
//   1. C++11 Magic Statics (preferred):
//
//          Singleton&amp; get() { static Singleton s; return s; } // thread-safe by std
//
//   2. std::call_once:
//
//          std::call_once(once, []{ p = new Singleton; });
//
//   3. std::atomic&lt;Singleton*&gt; with acquire/release if you really want DCL:
//
//          std::atomic&lt;Singleton*&gt; p{nullptr};
//          Singleton* get() {
//              auto s = p.load(memory_order_acquire);     // (1)
//              if (!s) {
//                  std::lock_guard g(m);
//                  s = p.load(memory_order_relaxed);
//                  if (!s) {
//                      s = new Singleton;
//                      p.store(s, memory_order_release);  // (2)
//                  }
//              }
//              return s;
//          }
//
//      Pairing (2) release with (1) acquire ensures readers that see p
//      non-null also see the FULLY constructed Singleton.
//
//  This file demonstrates ALL three approaches.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

struct Singleton {
    int    a = 1;
    double b = 2.5;
    Singleton() {
        // Imagine non-trivial init here.
    }
};

/* --- (1) magic statics --- */
Singleton&amp; get_meyers() {
    static Singleton s;            // standard guarantees thread-safe init
    return s;
}

/* --- (2) call_once --- */
static std::once_flag g_once;
static Singleton*     g_call_once_ptr = nullptr;
Singleton* get_call_once() {
    std::call_once(g_once, []{ g_call_once_ptr = new Singleton(); });
    return g_call_once_ptr;
}

/* --- (3) atomic DCL --- */
static std::atomic&lt;Singleton*&gt; g_atomic{nullptr};
static std::mutex              g_atomic_m;
Singleton* get_atomic_dcl() {
    Singleton* s = g_atomic.load(std::memory_order_acquire);
    if (!s) {
        std::lock_guard g(g_atomic_m);
        s = g_atomic.load(std::memory_order_relaxed);
        if (!s) {
            s = new Singleton();
            g_atomic.store(s, std::memory_order_release);
        }
    }
    return s;
}

int main()
{
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; 8; ++i)
        ts.emplace_back([]{
            volatile auto* a = &amp;get_meyers();
            volatile auto* b = get_call_once();
            volatile auto* c = get_atomic_dcl();
            (void)a; (void)b; (void)c;
        });
    for (auto&amp; t : ts) t.join();
    std::cout &lt;&lt; &quot;all three methods initialized OK\\n&quot;;
}

</code></pre>` },

  { name: `54. Examples / Pitfalls / Race Condition`, path: `examples/04_pitfalls/01_race_condition.cpp`, dir: `examples/04_pitfalls`, words: 279, mins: 1, body: `<h1 id="01_race_conditioncpp">01_race_condition.cpp</h1>
<pre><code class="language-cpp">// 01_race_condition.cpp -- The original sin: shared mutable state.
//
//  ++counter is NOT atomic. It's at least three machine ops:
//
//        load  reg, [counter]      &lt;-- read
//        add   reg, 1
//        store [counter], reg      &lt;-- write
//
//  Two threads can interleave:
//
//      thread A           thread B
//      load 5             load 5
//      add  6             add  6
//      store 6            store 6     -&gt; counter ends up 6 (lost update)
//
//  Fix: protect the increment so the load-add-store is indivisible.
//      - std::mutex                (correct, slowest under contention)
//      - std::atomic&lt;int&gt;          (correct, fast)
//      - hardware-locked RMW       (\`__atomic_fetch_add\`, std::atomic_ref)
//
//  This file shows the bug, then the two cures, side by side.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

constexpr int N = 8, ITERS = 200000;

template &lt;class F&gt;
long bench(F f)
{
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; N; ++i) ts.emplace_back(f);
    for (auto&amp; t : ts) t.join();
    return 0;
}

int main()
{
    /* (1) BUG: unsynchronized */
    {
        long c = 0;
        bench([&amp;]{ for (int i = 0; i &lt; ITERS; ++i) ++c; });
        std::cout &lt;&lt; &quot;(1) unsynchronized = &quot; &lt;&lt; c
                  &lt;&lt; &quot; (expected &quot; &lt;&lt; long(N)*ITERS &lt;&lt; &quot; -- usually wrong!)\\n&quot;;
    }

    /* (2) FIX with std::mutex */
    {
        long c = 0; std::mutex m;
        bench([&amp;]{ for (int i = 0; i &lt; ITERS; ++i) { std::lock_guard g(m); ++c; }});
        std::cout &lt;&lt; &quot;(2) std::mutex     = &quot; &lt;&lt; c &lt;&lt; &quot;\\n&quot;;
    }

    /* (3) FIX with std::atomic */
    {
        std::atomic&lt;long&gt; c{0};
        bench([&amp;]{ for (int i = 0; i &lt; ITERS; ++i) ++c; });
        std::cout &lt;&lt; &quot;(3) std::atomic    = &quot; &lt;&lt; c.load() &lt;&lt; &quot;\\n&quot;;
    }
}

</code></pre>` },
  { name: `55. Examples / Pitfalls / Deadlock`, path: `examples/04_pitfalls/02_deadlock.cpp`, dir: `examples/04_pitfalls`, words: 326, mins: 2, body: `<h1 id="02_deadlockcpp">02_deadlock.cpp</h1>
<pre><code class="language-cpp">// 02_deadlock.cpp -- Lock-ordering inversion (and three cures).
//
//  Two threads each hold one lock and want the other:
//
//      A holds m1, wants m2 -.        circular wait
//      B holds m2, wants m1 -+----- DEADLOCK
//
//  Cures (any one breaks the cycle):
//
//   (i) Lock in a fixed GLOBAL ORDER (e.g. by address):
//          if (&amp;m1 &lt; &amp;m2) lock m1 then m2; else lock m2 then m1;
//
//   (ii) Use std::lock(m1, m2) / std::scoped_lock(m1, m2) which uses
//        try-and-back-off internally and CAN'T deadlock between them.
//
//   (iii) Use try_lock with backoff on failure (release &amp; retry).
//
//  This file demonstrates the deadlock with a 2-second alarm, then the
//  three cures. Run with -fsanitize=thread to see TSan diagnostics.

#include &lt;chrono&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

std::mutex m1, m2;

[[maybe_unused]] static void deadlock_demo()
{
    std::thread a([]{
        std::lock_guard&lt;std::mutex&gt; g1(m1);
        std::this_thread::sleep_for(std::chrono::milliseconds(50));
        std::lock_guard&lt;std::mutex&gt; g2(m2);
        std::cout &lt;&lt; &quot;A got both\\n&quot;;
    });
    std::thread b([]{
        std::lock_guard&lt;std::mutex&gt; g2(m2);
        std::this_thread::sleep_for(std::chrono::milliseconds(50));
        std::lock_guard&lt;std::mutex&gt; g1(m1);
        std::cout &lt;&lt; &quot;B got both\\n&quot;;
    });
    a.join(); b.join();
}

/* (i) Global order */
static void cure_global_order()
{
    auto take_both = [](std::mutex&amp; x, std::mutex&amp; y){
        if (&amp;x &lt; &amp;y) { x.lock(); y.lock(); }
        else         { y.lock(); x.lock(); }
        x.unlock(); y.unlock();
    };
    std::thread a([&amp;]{ take_both(m1, m2); });
    std::thread b([&amp;]{ take_both(m2, m1); });
    a.join(); b.join();
    std::cout &lt;&lt; &quot;(i)   fixed-order: ok\\n&quot;;
}

/* (ii) std::scoped_lock */
static void cure_scoped_lock()
{
    auto fn = []{ std::scoped_lock g(m1, m2); };
    std::thread a(fn), b(fn);
    a.join(); b.join();
    std::cout &lt;&lt; &quot;(ii)  scoped_lock: ok\\n&quot;;
}

/* (iii) try_lock with backoff */
static void cure_try_lock()
{
    auto take_with_backoff = []{
        for (;;) {
            std::unique_lock l1(m1, std::try_to_lock);
            if (!l1) { std::this_thread::yield(); continue; }
            std::unique_lock l2(m2, std::try_to_lock);
            if (!l2) {
                l1.unlock();
                std::this_thread::yield();
                continue;
            }
            // got both
            return;
        }
    };
    std::thread a(take_with_backoff), b(take_with_backoff);
    a.join(); b.join();
    std::cout &lt;&lt; &quot;(iii) try-lock: ok\\n&quot;;
}

int main()
{
    cure_global_order();
    cure_scoped_lock();
    cure_try_lock();
    // To see the actual deadlock, uncomment the next two lines.
    // alarm(2);
    // deadlock_demo();
}

</code></pre>` },
  { name: `56. Examples / Pitfalls / Livelock`, path: `examples/04_pitfalls/03_livelock.cpp`, dir: `examples/04_pitfalls`, words: 377, mins: 2, body: `<h1 id="03_livelockcpp">03_livelock.cpp</h1>
<pre><code class="language-cpp">// 03_livelock.cpp -- The &quot;polite&quot; deadlock.
//
//  Two threads each acquire one lock and try the other; if they fail, they
//  RELEASE and retry. Without backoff, they retry in lock-step forever:
//
//      A: lock m1; try m2 -&gt; busy; release m1; retry
//      B: lock m2; try m1 -&gt; busy; release m2; retry
//      ... ad infinitum
//
//      Picture:
//
//          A: m1   m1   m1   m1   m1   ...
//          B:   m2   m2   m2   m2   m2 ...
//          (neither ever holds both)
//
//  Cure: RANDOMIZED EXPONENTIAL BACKOFF. With a random delay between
//  retries, the lock-step pattern is broken and one thread eventually wins.
//
//  This file has both the buggy version (will eventually succeed because
//  scheduling is jittery on Linux, but with low probability per attempt)
//  and the fixed version. We bound runs with attempt counts.

#include &lt;chrono&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;random&gt;
#include &lt;thread&gt;

std::mutex m1, m2;

void buggy(int id, int&amp; iterations)
{
    std::mutex&amp; first  = (id == 0) ? m1 : m2;
    std::mutex&amp; second = (id == 0) ? m2 : m1;

    for (int n = 0; n &lt; 200; ++n) {
        first.lock();
        std::this_thread::sleep_for(std::chrono::milliseconds(1));
        if (second.try_lock()) {
            std::cout &lt;&lt; id &lt;&lt; &quot; got both at attempt &quot; &lt;&lt; n &lt;&lt; &quot;\\n&quot;;
            second.unlock();
            first.unlock();
            iterations = n;
            return;
        }
        first.unlock();
        // No backoff -&gt; livelock-prone
    }
    iterations = -1;
}

void fixed(int id, int&amp; iterations)
{
    std::mutex&amp; first  = (id == 0) ? m1 : m2;
    std::mutex&amp; second = (id == 0) ? m2 : m1;
    std::mt19937 rng(id ^ 0xc01dbeef);

    for (int n = 0; n &lt; 200; ++n) {
        first.lock();
        std::this_thread::sleep_for(std::chrono::milliseconds(1));
        if (second.try_lock()) {
            std::cout &lt;&lt; id &lt;&lt; &quot; (fixed) got both at attempt &quot; &lt;&lt; n &lt;&lt; &quot;\\n&quot;;
            second.unlock();
            first.unlock();
            iterations = n;
            return;
        }
        first.unlock();
        // Randomized backoff breaks lock-step
        std::this_thread::sleep_for(std::chrono::microseconds(50 + rng() % 500));
    }
    iterations = -1;
}

int main()
{
    int it_a = 0, it_b = 0;
    {
        std::thread a(buggy, 0, std::ref(it_a));
        std::thread b(buggy, 1, std::ref(it_b));
        a.join(); b.join();
        std::cout &lt;&lt; &quot;buggy   attempts: A=&quot; &lt;&lt; it_a &lt;&lt; &quot; B=&quot; &lt;&lt; it_b &lt;&lt; &quot;\\n&quot;;
    }
    {
        std::thread a(fixed, 0, std::ref(it_a));
        std::thread b(fixed, 1, std::ref(it_b));
        a.join(); b.join();
        std::cout &lt;&lt; &quot;fixed   attempts: A=&quot; &lt;&lt; it_a &lt;&lt; &quot; B=&quot; &lt;&lt; it_b &lt;&lt; &quot;\\n&quot;;
    }
}

</code></pre>` },
  { name: `57. Examples / Pitfalls / Starvation`, path: `examples/04_pitfalls/04_starvation.cpp`, dir: `examples/04_pitfalls`, words: 316, mins: 2, body: `<h1 id="04_starvationcpp">04_starvation.cpp</h1>
<pre><code class="language-cpp">// 04_starvation.cpp -- Threads that never get a turn.
//
//  Forms of starvation:
//      * One thread holds a lock for very long stretches; others never
//        win the lock acquisition race.
//      * High-priority threads keep arriving and never let lower-priority
//        threads run (priority inversion variant).
//      * Reader-heavy load on a reader-preferring rwlock starves writers.
//
//  This file shows reader-starvation potential with shared_mutex when
//  readers are constant: the writer waits a long time. The cure on Linux
//  is that std::shared_mutex is typically writer-preferring, but that's
//  not guaranteed. The PORTABLE cure is to gate readers with a fairness
//  flag: when a writer wants in, no NEW readers may enter, but existing
//  ones drain.
//
//  Picture:
//
//      time ---&gt;
//      readers (constant): RRRRRRRRRRRRRRRRRRRRRRR...
//      writer (waiting):                           ^ when?
//
//      With fairness:
//      readers:           RRRRR  (drain)        RRRRR
//      writer waiting     [signaled &quot;want in&quot;] WWW
//      new readers        ...... (blocked while writer waits) .....

#include &lt;atomic&gt;
#include &lt;chrono&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;shared_mutex&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

class FairRWLock {
    std::shared_mutex sm_;
    std::atomic&lt;int&gt;  writer_pending_{0};
public:
    void lock_shared() {
        // Polite reader: if a writer is waiting, yield and wait.
        while (writer_pending_.load(std::memory_order_acquire) &gt; 0)
            std::this_thread::yield();
        sm_.lock_shared();
    }
    void unlock_shared() { sm_.unlock_shared(); }

    void lock() {
        writer_pending_.fetch_add(1, std::memory_order_release);
        sm_.lock();
    }
    void unlock() {
        writer_pending_.fetch_sub(1, std::memory_order_release);
        sm_.unlock();
    }
};

FairRWLock     rw;
std::atomic&lt;int&gt; reader_iters{0}, writer_iters{0};
std::atomic&lt;bool&gt; stop{false};

void reader()
{
    while (!stop.load(std::memory_order_relaxed)) {
        rw.lock_shared();
        std::this_thread::sleep_for(std::chrono::microseconds(200));
        rw.unlock_shared();
        reader_iters.fetch_add(1, std::memory_order_relaxed);
    }
}

void writer()
{
    for (int i = 0; i &lt; 5; ++i) {
        std::this_thread::sleep_for(std::chrono::milliseconds(100));
        rw.lock();
        std::cout &lt;&lt; &quot;writer in (write #&quot; &lt;&lt; i &lt;&lt; &quot;)\\n&quot;;
        std::this_thread::sleep_for(std::chrono::milliseconds(50));
        rw.unlock();
        writer_iters.fetch_add(1, std::memory_order_relaxed);
    }
    stop.store(true);
}

int main()
{
    std::vector&lt;std::thread&gt; rs;
    for (int i = 0; i &lt; 8; ++i) rs.emplace_back(reader);
    std::thread w(writer);
    w.join();
    for (auto&amp; t : rs) t.join();
    std::cout &lt;&lt; &quot;reader_iters=&quot; &lt;&lt; reader_iters.load()
              &lt;&lt; &quot; writer_iters=&quot; &lt;&lt; writer_iters.load() &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `58. Examples / Pitfalls / False Sharing`, path: `examples/04_pitfalls/05_false_sharing.cpp`, dir: `examples/04_pitfalls`, words: 317, mins: 2, body: `<h1 id="05_false_sharingcpp">05_false_sharing.cpp</h1>
<pre><code class="language-cpp">// 05_false_sharing.cpp -- The silent scalability killer.
//
//  CPU caches operate at CACHE LINE granularity (typically 64 bytes).
//  When two threads write to DIFFERENT variables that happen to live on
//  the SAME cache line, every write invalidates the other CPU's copy of
//  that line, causing massive cache-coherency traffic.
//
//      Memory:
//        +-----------------------+ &lt;- one 64-byte cache line
//        | a (T0's counter)      |
//        | b (T1's counter)      |
//        | c (T2's counter)      |
//        | d (T3's counter)      |
//        +-----------------------+
//
//        Every write to \`a\` evicts \`b,c,d\` from the other cores' caches!
//        Despite NO logical sharing, performance collapses.
//
//  Cure: pad/align so each &quot;private&quot; variable lives on its OWN cache line.
//
//      alignas(64) struct Slot { long counter; char pad[64-sizeof(long)]; };
//      Slot s[N];     // each s[i] on its own line -&gt; no false sharing
//
//  Run this and observe the difference (often 5-20x speedup).

#include &lt;atomic&gt;
#include &lt;chrono&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

constexpr int N = 4;
constexpr int ITERS = 50'000'000;

struct Bad {
    std::atomic&lt;long&gt; c[N];                       // packed; very prone to FS
};

#ifdef __cpp_lib_hardware_interference_size
constexpr size_t CL = std::hardware_destructive_interference_size;
#else
constexpr size_t CL = 64;
#endif

struct alignas(CL) Padded {
    std::atomic&lt;long&gt; counter;
    char pad[CL - sizeof(std::atomic&lt;long&gt;)];     // pad up to a full line
};

template &lt;class Run&gt;
double bench(const char* name, Run run) {
    auto t0 = std::chrono::steady_clock::now();
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; N; ++i) ts.emplace_back(run, i);
    for (auto&amp; t : ts) t.join();
    auto dt = std::chrono::duration&lt;double&gt;(std::chrono::steady_clock::now() - t0).count();
    std::cout &lt;&lt; name &lt;&lt; &quot;: &quot; &lt;&lt; dt &lt;&lt; &quot; s\\n&quot;;
    return dt;
}

int main()
{
    Bad bad{};
    bench(&quot;bad  (false-shared)&quot;, [&amp;](int id){
        for (int k = 0; k &lt; ITERS; ++k)
            bad.c[id].fetch_add(1, std::memory_order_relaxed);
    });

    Padded padded[N]{};
    bench(&quot;good (padded)      &quot;, [&amp;](int id){
        for (int k = 0; k &lt; ITERS; ++k)
            padded[id].counter.fetch_add(1, std::memory_order_relaxed);
    });
}

</code></pre>` },
  { name: `59. Examples / Pitfalls / Aba Problem`, path: `examples/04_pitfalls/06_aba_problem.cpp`, dir: `examples/04_pitfalls`, words: 457, mins: 2, body: `<h1 id="06_aba_problemcpp">06_aba_problem.cpp</h1>
<pre><code class="language-cpp">// 06_aba_problem.cpp -- The subtlest CAS bug.
//
//  In a CAS-based stack, suppose the head pointer goes A -&gt; B -&gt; C, and
//  thread 1 has read head=A and is about to CAS-pop. Meanwhile, thread 2
//  pops A and B (now head=C), frees A, then pushes a NEW node X whose
//  address happens to equal A's old address (because the allocator reused
//  it). Now head=A again. Thread 1's CAS(head, A, A-&gt;next=B) succeeds!
//  But B is freed and head should not point to it.
//
//      time ---&gt;
//      thread 1:  read head=A,A-&gt;next=B
//      thread 2:                       pop A, pop B,
//                                      free A,
//                                      push X (X's addr == old A)
//      thread 1:  CAS(head, A, B)   &lt;- &quot;succeeds&quot;: head now points to freed B
//
//  Coined ABA: the value went A -&gt; B -&gt; A; CAS can't tell the difference.
//
//  CURES:
//   1. Tagged pointers: pack a counter into the high bits, increment on
//      every change. CAS on (ptr, counter) tuple. The counter making each
//      ABA unique.
//   2. Hazard pointers: thieves announce &quot;I'm reading X&quot;; reclamation
//      defers freeing X until no hazard points there.
//   3. Epoch-based reclamation (RCU style).
//
//  This file demonstrates a tagged-pointer fix using a 128-bit DCAS
//  (double-width compare and swap) when available. Many platforms do.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;cstdint&gt;

struct Node { int value; Node* next; };

struct TaggedPtr {
    Node*    ptr;
    uintptr_t tag;
    bool operator==(const TaggedPtr&amp; o) const { return ptr == o.ptr &amp;&amp; tag == o.tag; }
};

// Most modern platforms support 128-bit atomics with -mcx16 (x86_64) or
// 16-byte aligned atomics on aarch64. Otherwise std::atomic falls back to
// a hidden lock; correctness is preserved, but it isn't lock-free.
class TaggedStack {
    std::atomic&lt;TaggedPtr&gt; head_{ TaggedPtr{nullptr, 0} };
public:
    void push(int v) {
        Node* n = new Node{v, nullptr};
        TaggedPtr cur = head_.load(std::memory_order_relaxed);
        for (;;) {
            n-&gt;next = cur.ptr;
            TaggedPtr next = { n, cur.tag + 1 };
            if (head_.compare_exchange_weak(cur, next,
                                            std::memory_order_release,
                                            std::memory_order_relaxed))
                return;
        }
    }
    bool pop(int&amp; out) {
        TaggedPtr cur = head_.load(std::memory_order_acquire);
        for (;;) {
            if (!cur.ptr) return false;
            TaggedPtr next = { cur.ptr-&gt;next, cur.tag + 1 };
            if (head_.compare_exchange_weak(cur, next,
                                            std::memory_order_acquire,
                                            std::memory_order_relaxed)) {
                out = cur.ptr-&gt;value;
                // Real code would defer-free cur.ptr (hazard ptr / RCU).
                // We leak for clarity.
                return true;
            }
        }
    }
};

int main()
{
    std::cout &lt;&lt; &quot;is_lock_free TaggedPtr: &quot;
              &lt;&lt; std::atomic&lt;TaggedPtr&gt;{}.is_lock_free()
              &lt;&lt; &quot;  (1 = native, 0 = std uses hidden lock)\\n&quot;;

    TaggedStack s;
    for (int i = 0; i &lt; 5; ++i) s.push(i);
    int v;
    while (s.pop(v)) std::cout &lt;&lt; v &lt;&lt; &quot; &quot;;
    std::cout &lt;&lt; &quot;\\n&quot;;

    std::cout &lt;&lt; &quot;Note: hazard pointers / RCU are needed for safe reclamation.\\n&quot;;
}

</code></pre>` },
  { name: `60. Examples / Pitfalls / Lost Wakeup`, path: `examples/04_pitfalls/07_lost_wakeup.cpp`, dir: `examples/04_pitfalls`, words: 304, mins: 2, body: `<h1 id="07_lost_wakeupcpp">07_lost_wakeup.cpp</h1>
<pre><code class="language-cpp">// 07_lost_wakeup.cpp -- Why you MUST always recheck the predicate in a loop.
//
//  THE BUG (without predicate-loop):
//
//      consumer                       producer
//      --------                       --------
//      check \`ready\` (false)
//                                     lock(m)
//                                     ready = true
//                                     notify_one()
//                                     unlock(m)
//      cv.wait(...)   &lt;-- sleeps FOREVER, the wake-up was already missed
//
//  Even if you DO use the loop without the lock around predicate-set, this
//  same race exists. Hence the rule:
//
//      Set predicate AND notify while holding the mutex; consume the
//      predicate inside the same mutex.
//
//  Fix: cv.wait(g, [&amp;]{ return ready; });
//      - cv.wait first checks the predicate while holding \`g\`. If true,
//        it returns immediately without sleeping.
//      - Else atomically (mutex-released + sleep), then on wake re-acquires
//        and rechecks.
//
//  This file shows BOTH versions. The buggy one triggers reliably with a
//  small sleep added by the consumer between read and wait.

#include &lt;chrono&gt;
#include &lt;condition_variable&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;

std::mutex              m;
std::condition_variable cv;
bool                    ready = false;

void buggy_consumer()
{
    if (!ready) {
        // Simulate scheduling that lets producer run &quot;between&quot; the check
        // and the wait.
        std::this_thread::sleep_for(std::chrono::milliseconds(50));
        std::unique_lock&lt;std::mutex&gt; g(m);
        cv.wait(g);    // No predicate -&gt; may sleep forever if wakeup happened above.
    }
    std::cout &lt;&lt; &quot;buggy consumer woken (ready=&quot; &lt;&lt; ready &lt;&lt; &quot;)\\n&quot;;
}

void good_consumer()
{
    std::unique_lock&lt;std::mutex&gt; g(m);
    cv.wait(g, []{ return ready; });    // safe regardless of timing
    std::cout &lt;&lt; &quot;good consumer woken (ready=&quot; &lt;&lt; ready &lt;&lt; &quot;)\\n&quot;;
}

int main()
{
    /* Demonstrate the GOOD version (which is robust). */
    ready = false;
    std::thread c(good_consumer);
    std::this_thread::sleep_for(std::chrono::milliseconds(20));
    {
        std::lock_guard&lt;std::mutex&gt; g(m);
        ready = true;
        cv.notify_all();
    }
    c.join();

    /* Demonstrating the bug deterministically across schedulers is hard;
     * the takeaway is: ALWAYS use the predicate-loop form. The buggy
     * function is shown above for instruction only. */
}

</code></pre>` },

  { name: `62. Examples / Memory Model / Seq Cst`, path: `examples/05_memory_model/01_seq_cst.cpp`, dir: `examples/05_memory_model`, words: 210, mins: 1, body: `<h1 id="01_seq_cstcpp">01_seq_cst.cpp</h1>
<pre><code class="language-cpp">// 01_seq_cst.cpp -- memory_order_seq_cst (the default).
//
//  All seq_cst operations appear in a single global total order that all
//  threads agree on. This is the most intuitive but also strongest (and
//  often most expensive) mode.
//
//  Property: in DEKKER's algorithm the following can NEVER occur in seq_cst
//  but CAN happen in weaker models:
//
//      thread 1:  x.store(1);                t1 reads y == 0
//      thread 2:  y.store(1);                t2 reads x == 0
//
//  Because if both stores happened &quot;before&quot; both loads in the global total
//  order, at least one of the loads must see the corresponding store.
//
//  This file runs Dekker's pattern and asserts the impossible-with-seq_cst
//  outcome doesn't occur.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;

std::atomic&lt;int&gt; x{0}, y{0};
int rx, ry;

int main()
{
    constexpr int RUNS = 1000;
    int seqcst_violations = 0;

    for (int i = 0; i &lt; RUNS; ++i) {
        x.store(0);
        y.store(0);

        std::thread t1([]{
            x.store(1, std::memory_order_seq_cst);
            ry = y.load(std::memory_order_seq_cst);
        });
        std::thread t2([]{
            y.store(1, std::memory_order_seq_cst);
            rx = x.load(std::memory_order_seq_cst);
        });
        t1.join(); t2.join();

        if (rx == 0 &amp;&amp; ry == 0) ++seqcst_violations;
    }
    std::cout &lt;&lt; &quot;Under seq_cst, both reads being 0 happened &quot;
              &lt;&lt; seqcst_violations &lt;&lt; &quot; times in &quot; &lt;&lt; RUNS
              &lt;&lt; &quot; runs (must be 0).\\n&quot;;
}

</code></pre>` },
  { name: `63. Examples / Memory Model / Acquire Release`, path: `examples/05_memory_model/02_acquire_release.cpp`, dir: `examples/05_memory_model`, words: 166, mins: 1, body: `<h1 id="02_acquire_releasecpp">02_acquire_release.cpp</h1>
<pre><code class="language-cpp">// 02_acquire_release.cpp -- The workhorse pattern.
//
//  Producer:                     Consumer:
//      ... write data ...            wait for flag (acquire)
//      flag.store(1, release)        ... read data ...
//
//  Establishes a synchronizes-with edge:
//
//      producer's release  --HAPPENS BEFORE--&gt;  consumer's acquire
//
//  Anything the producer wrote BEFORE the release is visible AFTER the
//  matching acquire on the consumer.
//
//  ASCII timeline:
//
//      producer       :  data=...   release(flag=1)  ........
//                                      \\
//                                       \\ synchronizes-with
//                                        \\
//      consumer       :  acquire(flag==1) -&gt; reads data already finalized
//
//  Cheaper than seq_cst because no global ordering is required, only this
//  specific paired ordering.

#include &lt;atomic&gt;
#include &lt;cassert&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;

int               data;
std::atomic&lt;bool&gt; ready{false};

void producer() {
    data = 1234;                                   // (1)
    ready.store(true, std::memory_order_release);  // (2): publishes (1)
}
void consumer() {
    while (!ready.load(std::memory_order_acquire)) // (3): synchronizes with (2)
        ;
    assert(data == 1234);                          // safe: (1) visible
}
int main() {
    std::thread c(consumer), p(producer);
    p.join(); c.join();
    std::cout &lt;&lt; &quot;data=&quot; &lt;&lt; data &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `64. Examples / Memory Model / Relaxed`, path: `examples/05_memory_model/03_relaxed.cpp`, dir: `examples/05_memory_model`, words: 164, mins: 1, body: `<h1 id="03_relaxedcpp">03_relaxed.cpp</h1>
<pre><code class="language-cpp">// 03_relaxed.cpp -- memory_order_relaxed: atomicity, NO ordering.
//
//  Useful when:
//      - You only need atomic counters (statistics, hit/miss, refcounts).
//      - You DON'T use the value to coordinate access to OTHER data.
//
//  Counter-example: do NOT use relaxed to publish data through a flag.
//      data = 42;
//      flag.store(true, relaxed);     // observer may see flag=true but data=junk
//
//  Picture (statistics counters):
//
//      threads ---atomic_fetch_add(relaxed)---&gt; [counter]
//                  (no fence emitted on most CPUs)
//
//  On x86, relaxed ops are extremely cheap; even on ARM they're cheaper
//  than acquire/release.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

std::atomic&lt;long&gt; hits{0}, misses{0};

int main()
{
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; 8; ++i)
        ts.emplace_back([&amp;]{
            for (int k = 0; k &lt; 1'000'000; ++k) {
                if (k % 4 == 0)
                    hits.fetch_add(1, std::memory_order_relaxed);
                else
                    misses.fetch_add(1, std::memory_order_relaxed);
            }
        });
    for (auto&amp; t : ts) t.join();

    std::cout &lt;&lt; &quot;hits=&quot; &lt;&lt; hits.load(std::memory_order_relaxed)
              &lt;&lt; &quot; misses=&quot; &lt;&lt; misses.load(std::memory_order_relaxed) &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `65. Examples / Memory Model / Release Consume`, path: `examples/05_memory_model/04_release_consume.cpp`, dir: `examples/05_memory_model`, words: 182, mins: 1, body: `<h1 id="04_release_consumecpp">04_release_consume.cpp</h1>
<pre><code class="language-cpp">// 04_release_consume.cpp -- The (de-facto deprecated) consume order.
//
//  memory_order_consume was meant to be a CHEAPER acquire that only orders
//  reads &quot;data-dependent&quot; on the loaded value. In practice no compiler
//  implements it as designed; they all promote it to acquire.
//
//      Treat consume as a synonym for acquire for now and avoid using it.
//
//  This file is included for completeness so you recognize the order if you
//  see it in legacy code.
//
//  Picture (intent that never materialized):
//
//      pointer published with release ----.
//      reader does:                       v
//          p = atomic.load(consume)       ordering only for reads through p,
//          x = p-&gt;field                   not unrelated data.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;

struct Cfg { int a; int b; };
std::atomic&lt;Cfg*&gt; g{nullptr};

int main()
{
    std::thread w([]{
        Cfg* c = new Cfg{10, 20};
        g.store(c, std::memory_order_release);
    });

    std::thread r([]{
        Cfg* c = nullptr;
        while (!(c = g.load(std::memory_order_consume))) ;
        std::cout &lt;&lt; &quot;consume reader: a=&quot; &lt;&lt; c-&gt;a &lt;&lt; &quot; b=&quot; &lt;&lt; c-&gt;b &lt;&lt; &quot;\\n&quot;;
    });
    w.join(); r.join();
    std::cout &lt;&lt; &quot;(in current compilers consume == acquire)\\n&quot;;
}

</code></pre>` },
  { name: `66. Examples / Memory Model / Fences`, path: `examples/05_memory_model/05_fences.cpp`, dir: `examples/05_memory_model`, words: 184, mins: 1, body: `<h1 id="05_fencescpp">05_fences.cpp</h1>
<pre><code class="language-cpp">// 05_fences.cpp -- std::atomic_thread_fence: standalone barriers.
//
//  Sometimes you want the ORDERING semantics of acquire/release without
//  attaching it to a specific atomic operation. A fence applies the
//  ordering to any preceding/following memory operations.
//
//      std::atomic_thread_fence(std::memory_order_release);
//      flag.store(1, std::memory_order_relaxed);
//
//      // ... matching consumer ...
//      while (flag.load(std::memory_order_relaxed) != 1) ;
//      std::atomic_thread_fence(std::memory_order_acquire);
//      // safe to read shared state here
//
//  Equivalent to release/acquire on the flag, but if you have many flags
//  pointing to the same protected region, one fence is cheaper than
//  many acq/rel ops.
//
//  When you want SEQUENTIAL CONSISTENCY across non-atomic stores, use
//  std::memory_order_seq_cst on the fence.
//
//  Modern advice: prefer to attach orderings to specific atomics. Fences
//  are useful for low-level lock implementations.

#include &lt;atomic&gt;
#include &lt;cassert&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;

int data;
std::atomic&lt;int&gt; flag{0};

void producer() {
    data = 99;
    std::atomic_thread_fence(std::memory_order_release);
    flag.store(1, std::memory_order_relaxed);
}

void consumer() {
    while (flag.load(std::memory_order_relaxed) == 0) ;
    std::atomic_thread_fence(std::memory_order_acquire);
    assert(data == 99);
    std::cout &lt;&lt; &quot;consumer saw data=&quot; &lt;&lt; data &lt;&lt; &quot;\\n&quot;;
}

int main() {
    std::thread c(consumer), p(producer);
    p.join(); c.join();
}

</code></pre>` },
  { name: `67. Examples / Memory Model / Store Load Reorder`, path: `examples/05_memory_model/06_store_load_reorder.cpp`, dir: `examples/05_memory_model`, words: 225, mins: 1, body: `<h1 id="06_store_load_reordercpp">06_store_load_reorder.cpp</h1>
<pre><code class="language-cpp">// 06_store_load_reorder.cpp -- Demonstrating store-&gt;load reordering.
//
//  Even on strong x86, ONE reordering is allowed: a thread's own store may
//  be observed BY OTHERS as if it happened AFTER a later load. (TSO.)
//
//      thread 1:        thread 2:
//      x.store(1)       y.store(1)
//      r1 = y.load()    r2 = x.load()
//
//  Outcome r1=0, r2=0 IS POSSIBLE with relaxed/even acquire+release loads,
//  because each core's store buffer drains independently.
//
//  Adding seq_cst stores (or a full fence between store and load) eliminates
//  this. We measure the rate of (0,0) outcomes for both modes.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;

std::atomic&lt;int&gt; x{0}, y{0};
int r1, r2;

template &lt;std::memory_order MO&gt;
int run_once()
{
    x.store(0, std::memory_order_relaxed);
    y.store(0, std::memory_order_relaxed);

    std::thread t1([]{ x.store(1, MO); r1 = y.load(MO); });
    std::thread t2([]{ y.store(1, MO); r2 = x.load(MO); });
    t1.join(); t2.join();
    return (r1 == 0 &amp;&amp; r2 == 0) ? 1 : 0;
}

int main()
{
    constexpr int RUNS = 5000;

    int relaxed_zeros = 0, seqcst_zeros = 0;
    for (int i = 0; i &lt; RUNS; ++i) relaxed_zeros += run_once&lt;std::memory_order_relaxed&gt;();
    for (int i = 0; i &lt; RUNS; ++i) seqcst_zeros  += run_once&lt;std::memory_order_seq_cst&gt;();

    std::cout &lt;&lt; &quot;relaxed (0,0) outcomes: &quot; &lt;&lt; relaxed_zeros &lt;&lt; &quot; / &quot; &lt;&lt; RUNS &lt;&lt; &quot;\\n&quot;;
    std::cout &lt;&lt; &quot;seq_cst (0,0) outcomes: &quot; &lt;&lt; seqcst_zeros  &lt;&lt; &quot; / &quot; &lt;&lt; RUNS
              &lt;&lt; &quot; (must be 0)\\n&quot;;
}

</code></pre>` },
  { name: `68. Examples / Memory Model`, path: `examples/05_memory_model/README.md`, dir: `examples/05_memory_model`, words: 170, mins: 1, body: `<h1 id="the-c-memory-model">The C++ Memory Model</h1>
<p>Why does any of this matter? Because compilers and CPUs are AGGRESSIVE
optimizers and reorderers. Your code:</p>
<pre><code>data = 42;
flag = true;
</code></pre>
<p>may be reordered to <code>flag = true; data = 42;</code> either by the compiler (e.g.
register allocation) or by the CPU (e.g. store buffer drain order). For
SINGLE-threaded code that&rsquo;s fine because the as-if rule guarantees the
observable behavior. For MULTI-threaded code, another thread observing
<code>flag</code> first would race against <code>data</code>.</p>
<p>Memory orders constrain those reorderings to give you well-defined
inter-thread visibility.</p>
<pre><code>                 strict &lt;-------------------&gt; permissive
                 SLOW                              FAST

   seq_cst   -&gt;   acq_rel   -&gt;   acquire / release   -&gt;   relaxed

   Total order   &quot;happens-      &quot;happens-before for     atomicity only,
   visible to    before for     a single sync pair&quot;     no ordering.
   all threads   the RMW pair&quot;
</code></pre>

  { name: `69. Examples / Openmp / Parallel`, path: `examples/06_openmp/01_parallel.c`, dir: `examples/06_openmp`, words: 151, mins: 1, body: `<h1 id="01_parallelc">01_parallel.c</h1>
<pre><code class="language-c">/*
 * 01_parallel.c -- &quot;#pragma omp parallel&quot; basics.
 *
 *  The block below the pragma is executed by a TEAM of threads. The
 *  number of threads defaults to the number of cores (or whatever
 *  OMP_NUM_THREADS / omp_set_num_threads chooses).
 *
 *  Picture (4 threads):
 *
 *      main thread
 *           |
 *           |  #pragma omp parallel  -- fork
 *           +-----+-----+-----+
 *           |     |     |     |
 *           T0    T1    T2    T3
 *           |     |     |     |
 *          (each runs the same block)
 *           |     |     |     |
 *           +-----+-----+-----+  -- implicit join (barrier)
 *           |
 *           v
 *      main resumes
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;

int main(void)
{
    printf(&quot;max threads = %d\\n&quot;, omp_get_max_threads());

    #pragma omp parallel
    {
        int id  = omp_get_thread_num();
        int tot = omp_get_num_threads();
        printf(&quot;hello from thread %d / %d\\n&quot;, id, tot);
    }
    return 0;
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `70. Examples / Openmp / For Loop`, path: `examples/06_openmp/02_for_loop.c`, dir: `examples/06_openmp`, words: 244, mins: 1, body: `<h1 id="02_for_loopc">02_for_loop.c</h1>
<pre><code class="language-c">/*
 * 02_for_loop.c -- Parallel for loop with scheduling.
 *
 *      #pragma omp parallel for schedule(KIND[, CHUNK])
 *
 *  KIND options:
 *      static   -- divide iterations into equal chunks at compile/launch time
 *                  (best when each iteration costs the same)
 *      dynamic  -- threads pull chunks from a shared queue (best when
 *                  iterations vary in cost)
 *      guided   -- like dynamic but chunks shrink (good for &quot;tail&quot; load)
 *      auto     -- let the implementation decide
 *      runtime  -- read OMP_SCHEDULE env var
 *
 *  Picture: 12 iterations across 4 threads, schedule(static):
 *
 *      T0: 0,1,2
 *      T1: 3,4,5
 *      T2: 6,7,8
 *      T3: 9,10,11
 *
 *  schedule(static, 1) (round-robin one-at-a-time):
 *
 *      T0: 0,4,8
 *      T1: 1,5,9
 *      T2: 2,6,10
 *      T3: 3,7,11
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

int main(void)
{
    int N = 12;
    int who[12] = {0};

    #pragma omp parallel for schedule(static)
    for (int i = 0; i &lt; N; ++i) {
        who[i] = omp_get_thread_num();
        usleep(50 * 1000);
    }
    printf(&quot;static schedule: &quot;);
    for (int i = 0; i &lt; N; ++i) printf(&quot;[%d-&gt;T%d] &quot;, i, who[i]);
    printf(&quot;\\n&quot;);

    #pragma omp parallel for schedule(dynamic, 2)
    for (int i = 0; i &lt; N; ++i) {
        who[i] = omp_get_thread_num();
        usleep((i % 4) * 30 * 1000);     /* uneven cost */
    }
    printf(&quot;dynamic,2:        &quot;);
    for (int i = 0; i &lt; N; ++i) printf(&quot;[%d-&gt;T%d] &quot;, i, who[i]);
    printf(&quot;\\n&quot;);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `71. Examples / Openmp / Sections`, path: `examples/06_openmp/03_sections.c`, dir: `examples/06_openmp`, words: 144, mins: 1, body: `<h1 id="03_sectionsc">03_sections.c</h1>
<pre><code class="language-c">/*
 * 03_sections.c -- &quot;#pragma omp sections&quot;: run different code blocks
 *                  on different threads.
 *
 *  Useful when you have N independent steps to do simultaneously rather
 *  than N iterations of one task.
 *
 *      sections
 *      +----------------+----------------+----------------+
 *      | section A      | section B      | section C      |
 *      | (thread X)     | (thread Y)     | (thread Z)     |
 *      +----------------+----------------+----------------+
 *           |                |                |
 *           +------ implicit barrier ---------+
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

int main(void)
{
    #pragma omp parallel sections
    {
        #pragma omp section
        { printf(&quot;A start (T%d)\\n&quot;, omp_get_thread_num()); sleep(1);
          printf(&quot;A done\\n&quot;); }

        #pragma omp section
        { printf(&quot;B start (T%d)\\n&quot;, omp_get_thread_num()); sleep(2);
          printf(&quot;B done\\n&quot;); }

        #pragma omp section
        { printf(&quot;C start (T%d)\\n&quot;, omp_get_thread_num()); sleep(1);
          printf(&quot;C done\\n&quot;); }
    }
    printf(&quot;(all sections joined)\\n&quot;);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `72. Examples / Openmp / Critical`, path: `examples/06_openmp/04_critical.c`, dir: `examples/06_openmp`, words: 214, mins: 1, body: `<h1 id="04_criticalc">04_critical.c</h1>
<pre><code class="language-c">/*
 * 04_critical.c -- Mutual exclusion in OpenMP.
 *
 *      #pragma omp critical [(name)]    -- region locked by a global mutex,
 *                                          named or anonymous.
 *      #pragma omp atomic               -- use a hardware atomic op for
 *                                          a SIMPLE update (++, +=, ...).
 *      #pragma omp single               -- only ONE thread runs the block;
 *                                          others wait at implicit barrier.
 *      #pragma omp master               -- like single but only thread 0,
 *                                          and NO implicit barrier.
 *      #pragma omp barrier              -- explicit synchronization point.
 *
 *  Performance hint: prefer atomic over critical when applicable -- it's
 *  much cheaper.
 *
 *  Picture (critical):
 *
 *      thread A: ----+--+----  (in CS)
 *      thread B: ----+ wait  ---+---+---  (in CS)
 *      thread C: ----+ wait  ---+ wait  ---+---+--  (in CS)
 *                    \\____ critical region serializes ____/
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;

int main(void)
{
    long n_critical = 0;
    long n_atomic   = 0;

    #pragma omp parallel for
    for (int i = 0; i &lt; 100000; ++i) {
        #pragma omp critical
        { ++n_critical; }
    }

    #pragma omp parallel for
    for (int i = 0; i &lt; 100000; ++i) {
        #pragma omp atomic
        ++n_atomic;
    }

    printf(&quot;critical = %ld  atomic = %ld\\n&quot;, n_critical, n_atomic);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `73. Examples / Openmp / Reduction`, path: `examples/06_openmp/05_reduction.c`, dir: `examples/06_openmp`, words: 224, mins: 1, body: `<h1 id="05_reductionc">05_reduction.c</h1>
<pre><code class="language-c">/*
 * 05_reduction.c -- reduction(op:var) clause.
 *
 *      #pragma omp parallel for reduction(+:sum)
 *      for (...) sum += a[i];
 *
 *  Each thread gets a PRIVATE copy of \`sum\` initialized to the identity
 *  element of \`op\` (0 for +, 1 for *, INT_MIN for max, etc.). At the end,
 *  the runtime combines the private copies pairwise using \`op\` to produce
 *  the final value.
 *
 *  Picture (4 threads summing 1..N):
 *
 *      iters: 1 2 3 4 ... N
 *      T0: sum0 = sum of T0's slice
 *      T1: sum1 = sum of T1's slice
 *      T2: sum2 = sum of T2's slice
 *      T3: sum3 = sum of T3's slice
 *      combine: total = ((sum0+sum1) + (sum2+sum3))
 *
 *  Supported ops include:
 *      +  *  -  &amp;  |  ^  &amp;&amp;  ||  max  min
 *  (User-defined reductions are also possible: declare reduction.)
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;

int main(void)
{
    long N = 1000000;
    long sum = 0, prod = 1; (void)prod;
    int  vmax = 0;

    #pragma omp parallel for reduction(+:sum) reduction(max:vmax)
    for (long i = 1; i &lt;= N; ++i) {
        sum  += i;
        if ((int)i &gt; vmax) vmax = (int)i;
    }
    printf(&quot;sum(1..%ld) = %ld  (expected %ld)\\n&quot;, N, sum, N*(N+1)/2);
    printf(&quot;max          = %d\\n&quot;, vmax);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `74. Examples / Openmp / Tasks`, path: `examples/06_openmp/06_tasks.c`, dir: `examples/06_openmp`, words: 186, mins: 1, body: `<h1 id="06_tasksc">06_tasks.c</h1>
<pre><code class="language-c">/*
 * 06_tasks.c -- OpenMP 3.0+ tasks: irregular parallelism.
 *
 *      #pragma omp task
 *      do_work();
 *
 *  Tasks are good for tree/recursive algorithms (parallel quicksort,
 *  fibonacci, graph traversal). The runtime queues them and any idle
 *  thread can run them.
 *
 *  Below we compute Fibonacci with tasks. (Educational; in practice
 *  spawn-everywhere fib(n) is slower than the serial version due to
 *  overhead -- still a great teaching example.)
 *
 *  Picture (fib(4)):
 *
 *      fib(4)
 *      +-- task fib(3)
 *      |    +-- task fib(2) ...
 *      |    +-- task fib(1)
 *      +-- task fib(2) ...
 *      taskwait
 *      sum results
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;

long fib(int n)
{
    if (n &lt; 2) return n;
    long a, b;
    #pragma omp task shared(a)
    a = fib(n - 1);
    #pragma omp task shared(b)
    b = fib(n - 2);
    #pragma omp taskwait
    return a + b;
}

int main(void)
{
    long r = 0;
    #pragma omp parallel
    {
        #pragma omp single
        r = fib(20);
    }
    printf(&quot;fib(20) = %ld\\n&quot;, r);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `75. Examples / Openmp`, path: `examples/06_openmp/README.md`, dir: `examples/06_openmp`, words: 211, mins: 1, body: `<h1 id="openmp--the-pragma-driven-way">OpenMP &ndash; The Pragma-Driven Way</h1>
<p>OpenMP is a <em>compiler-supported</em> parallelism model. You sprinkle <code>#pragma
omp ...</code> directives over otherwise-serial code and the compiler/runtime
take care of thread management.</p>
<pre><code>   #pragma omp parallel for
   for (int i = 0; i &lt; n; ++i)
       a[i] = b[i] * c[i];

         |
         v
   +-------------- compiler expansion ----------------+
   |  spawn N threads                                 |
   |  for thread t in 0..N-1:                         |
   |      for i in t * n/N .. (t+1) * n/N:            |
   |          a[i] = b[i] * c[i]                      |
   |  barrier                                         |
   +--------------------------------------------------+
</code></pre>
<h2 id="when-to-choose-openmp-vs-stdthread">When to choose OpenMP vs std::thread</h2>
<table>
<thead>
<tr>
<th>Situation</th>
<th>Pick</th>
</tr>
</thead>
<tbody>
<tr>
<td>Tight numerical loops on arrays</td>
<td>OpenMP</td>
</tr>
<tr>
<td>Heterogeneous tasks, services</td>
<td>std::thread / thread pool</td>
</tr>
<tr>
<td>Need fine-grained synchronization</td>
<td>std::thread + atomics</td>
</tr>
<tr>
<td>Want vectorization with multi-threading</td>
<td>OpenMP (4.0+ has SIMD pragmas)</td>
</tr>
<tr>
<td>Portable to non-OpenMP compilers</td>
<td>std::thread</td>
</tr>
</tbody>
</table>
