  { name: `29. Openmp / Parallel`, path: `06_openmp/01_parallel.c`, dir: `06_openmp`, body: `<h1 id="01_parallelc">01_parallel.c</h1>
<pre><code class="language-c">/*
 * 01_parallel.c -- &quot;#pragma omp parallel&quot; basics.
 *
 *  The block below the pragma is executed by a TEAM of threads. The
 *  number of threads defaults to the number of cores (or whatever
 *  OMP_NUM_THREADS / omp_set_num_threads chooses).
 *
 *  Picture (4 threads):
 *
 *      main thread
 *           |
 *           |  #pragma omp parallel  -- fork
 *           +-----+-----+-----+
 *           |     |     |     |
 *           T0    T1    T2    T3
 *           |     |     |     |
 *          (each runs the same block)
 *           |     |     |     |
 *           +-----+-----+-----+  -- implicit join (barrier)
 *           |
 *           v
 *      main resumes
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;

int main(void)
{
    printf(&quot;max threads = %d\\n&quot;, omp_get_max_threads());

    #pragma omp parallel
    {
        int id  = omp_get_thread_num();
        int tot = omp_get_num_threads();
        printf(&quot;hello from thread %d / %d\\n&quot;, id, tot);
    }
    return 0;
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `30. Openmp / For Loop`, path: `06_openmp/02_for_loop.c`, dir: `06_openmp`, body: `<h1 id="02_for_loopc">02_for_loop.c</h1>
<pre><code class="language-c">/*
 * 02_for_loop.c -- Parallel for loop with scheduling.
 *
 *      #pragma omp parallel for schedule(KIND[, CHUNK])
 *
 *  KIND options:
 *      static   -- divide iterations into equal chunks at compile/launch time
 *                  (best when each iteration costs the same)
 *      dynamic  -- threads pull chunks from a shared queue (best when
 *                  iterations vary in cost)
 *      guided   -- like dynamic but chunks shrink (good for &quot;tail&quot; load)
 *      auto     -- let the implementation decide
 *      runtime  -- read OMP_SCHEDULE env var
 *
 *  Picture: 12 iterations across 4 threads, schedule(static):
 *
 *      T0: 0,1,2
 *      T1: 3,4,5
 *      T2: 6,7,8
 *      T3: 9,10,11
 *
 *  schedule(static, 1) (round-robin one-at-a-time):
 *
 *      T0: 0,4,8
 *      T1: 1,5,9
 *      T2: 2,6,10
 *      T3: 3,7,11
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

int main(void)
{
    int N = 12;
    int who[12] = {0};

    #pragma omp parallel for schedule(static)
    for (int i = 0; i &lt; N; ++i) {
        who[i] = omp_get_thread_num();
        usleep(50 * 1000);
    }
    printf(&quot;static schedule: &quot;);
    for (int i = 0; i &lt; N; ++i) printf(&quot;[%d-&gt;T%d] &quot;, i, who[i]);
    printf(&quot;\\n&quot;);

    #pragma omp parallel for schedule(dynamic, 2)
    for (int i = 0; i &lt; N; ++i) {
        who[i] = omp_get_thread_num();
        usleep((i % 4) * 30 * 1000);     /* uneven cost */
    }
    printf(&quot;dynamic,2:        &quot;);
    for (int i = 0; i &lt; N; ++i) printf(&quot;[%d-&gt;T%d] &quot;, i, who[i]);
    printf(&quot;\\n&quot;);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `31. Openmp / Sections`, path: `06_openmp/03_sections.c`, dir: `06_openmp`, body: `<h1 id="03_sectionsc">03_sections.c</h1>
<pre><code class="language-c">/*
 * 03_sections.c -- &quot;#pragma omp sections&quot;: run different code blocks
 *                  on different threads.
 *
 *  Useful when you have N independent steps to do simultaneously rather
 *  than N iterations of one task.
 *
 *      sections
 *      +----------------+----------------+----------------+
 *      | section A      | section B      | section C      |
 *      | (thread X)     | (thread Y)     | (thread Z)     |
 *      +----------------+----------------+----------------+
 *           |                |                |
 *           +------ implicit barrier ---------+
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

int main(void)
{
    #pragma omp parallel sections
    {
        #pragma omp section
        { printf(&quot;A start (T%d)\\n&quot;, omp_get_thread_num()); sleep(1);
          printf(&quot;A done\\n&quot;); }

        #pragma omp section
        { printf(&quot;B start (T%d)\\n&quot;, omp_get_thread_num()); sleep(2);
          printf(&quot;B done\\n&quot;); }

        #pragma omp section
        { printf(&quot;C start (T%d)\\n&quot;, omp_get_thread_num()); sleep(1);
          printf(&quot;C done\\n&quot;); }
    }
    printf(&quot;(all sections joined)\\n&quot;);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `32. Openmp / Critical`, path: `06_openmp/04_critical.c`, dir: `06_openmp`, body: `<h1 id="04_criticalc">04_critical.c</h1>
<pre><code class="language-c">/*
 * 04_critical.c -- Mutual exclusion in OpenMP.
 *
 *      #pragma omp critical [(name)]    -- region locked by a global mutex,
 *                                          named or anonymous.
 *      #pragma omp atomic               -- use a hardware atomic op for
 *                                          a SIMPLE update (++, +=, ...).
 *      #pragma omp single               -- only ONE thread runs the block;
 *                                          others wait at implicit barrier.
 *      #pragma omp master               -- like single but only thread 0,
 *                                          and NO implicit barrier.
 *      #pragma omp barrier              -- explicit synchronization point.
 *
 *  Performance hint: prefer atomic over critical when applicable -- it's
 *  much cheaper.
 *
 *  Picture (critical):
 *
 *      thread A: ----+--+----  (in CS)
 *      thread B: ----+ wait  ---+---+---  (in CS)
 *      thread C: ----+ wait  ---+ wait  ---+---+--  (in CS)
 *                    \\____ critical region serializes ____/
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;

int main(void)
{
    long n_critical = 0;
    long n_atomic   = 0;

    #pragma omp parallel for
    for (int i = 0; i &lt; 100000; ++i) {
        #pragma omp critical
        { ++n_critical; }
    }

    #pragma omp parallel for
    for (int i = 0; i &lt; 100000; ++i) {
        #pragma omp atomic
        ++n_atomic;
    }

    printf(&quot;critical = %ld  atomic = %ld\\n&quot;, n_critical, n_atomic);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `33. Openmp / Reduction`, path: `06_openmp/05_reduction.c`, dir: `06_openmp`, body: `<h1 id="05_reductionc">05_reduction.c</h1>
<pre><code class="language-c">/*
 * 05_reduction.c -- reduction(op:var) clause.
 *
 *      #pragma omp parallel for reduction(+:sum)
 *      for (...) sum += a[i];
 *
 *  Each thread gets a PRIVATE copy of \`sum\` initialized to the identity
 *  element of \`op\` (0 for +, 1 for *, INT_MIN for max, etc.). At the end,
 *  the runtime combines the private copies pairwise using \`op\` to produce
 *  the final value.
 *
 *  Picture (4 threads summing 1..N):
 *
 *      iters: 1 2 3 4 ... N
 *      T0: sum0 = sum of T0's slice
 *      T1: sum1 = sum of T1's slice
 *      T2: sum2 = sum of T2's slice
 *      T3: sum3 = sum of T3's slice
 *      combine: total = ((sum0+sum1) + (sum2+sum3))
 *
 *  Supported ops include:
 *      +  *  -  &amp;  |  ^  &amp;&amp;  ||  max  min
 *  (User-defined reductions are also possible: declare reduction.)
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;

int main(void)
{
    long N = 1000000;
    long sum = 0, prod = 1; (void)prod;
    int  vmax = 0;

    #pragma omp parallel for reduction(+:sum) reduction(max:vmax)
    for (long i = 1; i &lt;= N; ++i) {
        sum  += i;
        if ((int)i &gt; vmax) vmax = (int)i;
    }
    printf(&quot;sum(1..%ld) = %ld  (expected %ld)\\n&quot;, N, sum, N*(N+1)/2);
    printf(&quot;max          = %d\\n&quot;, vmax);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `34. Openmp / Tasks`, path: `06_openmp/06_tasks.c`, dir: `06_openmp`, body: `<h1 id="06_tasksc">06_tasks.c</h1>
<pre><code class="language-c">/*
 * 06_tasks.c -- OpenMP 3.0+ tasks: irregular parallelism.
 *
 *      #pragma omp task
 *      do_work();
 *
 *  Tasks are good for tree/recursive algorithms (parallel quicksort,
 *  fibonacci, graph traversal). The runtime queues them and any idle
 *  thread can run them.
 *
 *  Below we compute Fibonacci with tasks. (Educational; in practice
 *  spawn-everywhere fib(n) is slower than the serial version due to
 *  overhead -- still a great teaching example.)
 *
 *  Picture (fib(4)):
 *
 *      fib(4)
 *      +-- task fib(3)
 *      |    +-- task fib(2) ...
 *      |    +-- task fib(1)
 *      +-- task fib(2) ...
 *      taskwait
 *      sum results
 */

#ifdef _OPENMP
#include &lt;omp.h&gt;
#include &lt;stdio.h&gt;

long fib(int n)
{
    if (n &lt; 2) return n;
    long a, b;
    #pragma omp task shared(a)
    a = fib(n - 1);
    #pragma omp task shared(b)
    b = fib(n - 2);
    #pragma omp taskwait
    return a + b;
}

int main(void)
{
    long r = 0;
    #pragma omp parallel
    {
        #pragma omp single
        r = fib(20);
    }
    printf(&quot;fib(20) = %ld\\n&quot;, r);
}
#else
#include &lt;stdio.h&gt;
int main(void){ puts(&quot;Compile with -fopenmp.&quot;); return 0; }
#endif

</code></pre>` },
  { name: `35. Openmp`, path: `06_openmp/README.md`, dir: `06_openmp`, body: `<h1 id="openmp--the-pragma-driven-way">OpenMP &ndash; The Pragma-Driven Way</h1>
<p>OpenMP is a <em>compiler-supported</em> parallelism model. You sprinkle <code>#pragma
omp ...</code> directives over otherwise-serial code and the compiler/runtime
take care of thread management.</p>
<pre><code>   #pragma omp parallel for
   for (int i = 0; i &lt; n; ++i)
       a[i] = b[i] * c[i];

         |
         v
   +-------------- compiler expansion ----------------+
   |  spawn N threads                                 |
   |  for thread t in 0..N-1:                         |
   |      for i in t * n/N .. (t+1) * n/N:            |
   |          a[i] = b[i] * c[i]                      |
   |  barrier                                         |
   +--------------------------------------------------+
</code></pre>
<h2 id="when-to-choose-openmp-vs-stdthread">When to choose OpenMP vs std::thread</h2>
<table>
<thead>
<tr>
<th>Situation</th>
<th>Pick</th>
</tr>
</thead>
<tbody>
<tr>
<td>Tight numerical loops on arrays</td>
<td>OpenMP</td>
</tr>
<tr>
<td>Heterogeneous tasks, services</td>
<td>std::thread / thread pool</td>
</tr>
<tr>
<td>Need fine-grained synchronization</td>
<td>std::thread + atomics</td>
</tr>
<tr>
<td>Want vectorization with multi-threading</td>
<td>OpenMP (4.0+ has SIMD pragmas)</td>
</tr>
<tr>
<td>Portable to non-OpenMP compilers</td>
<td>std::thread</td>
</tr>
</tbody>
</table>

  { name: `36. Pthreads / Basics / Hello Thread`, path: `01_pthreads/01_basics/01_hello_thread.c`, dir: `01_pthreads/01_basics`, body: `<h1 id="01_hello_threadc">01_hello_thread.c</h1>
<pre><code class="language-c">/*
 * 01_hello_thread.c -- The simplest possible pthread program.
 *
 *  Compile : gcc -pthread -o 01_hello_thread 01_hello_thread.c
 *  Run     : ./01_hello_thread
 *
 *  Concept: pthread_create() launches a new OS-level thread that runs
 *  start_routine(arg). pthread_join() blocks until that thread finishes.
 *
 *  ASCII timeline:
 *
 *   main thread        worker thread
 *   -----------        -------------
 *      |
 *      |  pthread_create() ----&gt; spawned
 *      |                              |
 *      |                              |  printf(&quot;hello&quot;)
 *      |                              |
 *      |  pthread_join()  &lt;----- exits|
 *      |
 *      v
 *    main returns
 *
 *  Key data structure:
 *
 *   pthread_t  -- an OPAQUE handle, not the thread itself.
 *                 Think of it as &quot;a ticket I hand back to the library
 *                 to refer to that thread later&quot;.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

/*
 * Every pthread function has the signature:  void *fn(void *arg);
 * The void* in/out is the universal &quot;anything&quot; type in C.
 */
static void *worker(void *arg)
{
    (void)arg;                                    /* silence unused warning */
    printf(&quot;[worker]  hello from the worker thread!\\n&quot;);
    return NULL;                                  /* return value visible via pthread_join */
}

int main(void)
{
    pthread_t tid;                                /* handle for the new thread */

    printf(&quot;[main  ]  about to spawn a worker...\\n&quot;);

    /*
     * pthread_create(out_tid, attr, start_fn, arg)
     *  - attr=NULL  -&gt; default attributes (joinable, default stack)
     *  - returns 0 on success, errno-like value on failure (NOT -1!)
     */
    int rc = pthread_create(&amp;tid, NULL, worker, NULL);
    if (rc != 0) {
        fprintf(stderr, &quot;pthread_create failed: %d\\n&quot;, rc);
        return EXIT_FAILURE;
    }

    /*
     * pthread_join: wait for the thread to finish AND release its resources.
     * Without join (or detach) you have a &quot;zombie&quot; thread leak.
     */
    pthread_join(tid, NULL);

    printf(&quot;[main  ]  worker has finished, exiting.\\n&quot;);
    return EXIT_SUCCESS;
}

</code></pre>` },
  { name: `37. Pthreads / Basics / Thread Args`, path: `01_pthreads/01_basics/02_thread_args.c`, dir: `01_pthreads/01_basics`, body: `<h1 id="02_thread_argsc">02_thread_args.c</h1>
<pre><code class="language-c">/*
 * 02_thread_args.c -- Passing arguments to threads.
 *
 *  Compile : gcc -pthread -o 02_thread_args 02_thread_args.c
 *  Run     : ./02_thread_args
 *
 *  pthread_create takes a SINGLE void* arg. If you need more than one piece
 *  of data, bundle them in a struct and pass a pointer to it.
 *
 *  CAREFUL: the memory you pass MUST outlive the worker. The classic bug:
 *
 *      for (int i = 0; i &lt; N; i++)
 *          pthread_create(&amp;t[i], 0, fn, &amp;i);   // BUG! all threads see the
 *                                              // same \`i\` -- it's mutating!
 *
 *  Memory layout when we pass an array of structs:
 *
 *     workers[]
 *     +---------------+   &lt;-- worker 0 reads from here
 *     | id=0, n=10    |
 *     +---------------+   &lt;-- worker 1 reads from here
 *     | id=1, n=20    |
 *     +---------------+   &lt;-- worker 2 reads from here
 *     | id=2, n=30    |
 *     +---------------+
 *
 *  Each thread receives a UNIQUE pointer, so there's no race.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

#define N 4

typedef struct {
    int id;
    int n;
} arg_t;

static void *worker(void *arg)
{
    arg_t *a = (arg_t *)arg;                /* cast back to real type */
    long sum = 0;
    for (int i = 1; i &lt;= a-&gt;n; ++i)
        sum += i;
    printf(&quot;[t%d] sum(1..%d) = %ld\\n&quot;, a-&gt;id, a-&gt;n, sum);
    return NULL;
}

int main(void)
{
    pthread_t tids[N];
    arg_t     args[N];                      /* MUST live until threads exit */

    for (int i = 0; i &lt; N; ++i) {
        args[i].id = i;
        args[i].n  = (i + 1) * 10;          /* 10, 20, 30, 40 */
        pthread_create(&amp;tids[i], NULL, worker, &amp;args[i]);
    }

    for (int i = 0; i &lt; N; ++i)
        pthread_join(tids[i], NULL);

    return 0;
}

</code></pre>` },
  { name: `38. Pthreads / Basics / Thread Return`, path: `01_pthreads/01_basics/03_thread_return.c`, dir: `01_pthreads/01_basics`, body: `<h1 id="03_thread_returnc">03_thread_return.c</h1>
<pre><code class="language-c">/*
 * 03_thread_return.c -- Returning a value from a thread.
 *
 *  pthread_join's second argument is a \`void **\` that receives whatever the
 *  thread returned (or whatever you passed to pthread_exit()).
 *
 *  Two common ways to return a value:
 *
 *  (A) Return a heap-allocated object the caller will free:
 *
 *     thread:                      main:
 *       result = malloc(...)         pthread_join(t, &amp;p);
 *       *result = 42;                printf(&quot;%d&quot;, *(int*)p);
 *       return result;               free(p);
 *
 *  (B) Return a pointer to caller-owned storage (filled in by the thread):
 *
 *     main:                        thread:
 *       int out;                     a-&gt;out = 42;
 *       arg.out_ptr = &amp;out;          return NULL;
 *       pthread_create(..., &amp;arg);
 *
 *  Method (B) is preferred -- no heap, no ownership ambiguity.
 *
 *  This file demonstrates BOTH.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

/* ------------ method A: heap-allocated return ------------------ */
static void *thread_a(void *arg)
{
    int n = *(int *)arg;
    int *result = malloc(sizeof(int));      /* caller will free */
    *result = n * n;
    return result;                          /* visible via pthread_join */
}

/* ------------ method B: caller-owned out-param ----------------- */
typedef struct { int n; int out; } pkg_t;
static void *thread_b(void *arg)
{
    pkg_t *p = (pkg_t *)arg;
    p-&gt;out = p-&gt;n * p-&gt;n * p-&gt;n;            /* cube */
    return NULL;
}

int main(void)
{
    /* (A) */
    pthread_t ta;
    int input = 7;
    pthread_create(&amp;ta, NULL, thread_a, &amp;input);

    void *retval;
    pthread_join(ta, &amp;retval);              /* retval points to the malloc'd int */
    printf(&quot;(A) %d^2 = %d\\n&quot;, input, *(int *)retval);
    free(retval);

    /* (B) */
    pthread_t tb;
    pkg_t pkg = { .n = 7, .out = 0 };
    pthread_create(&amp;tb, NULL, thread_b, &amp;pkg);
    pthread_join(tb, NULL);
    printf(&quot;(B) %d^3 = %d\\n&quot;, pkg.n, pkg.out);

    return 0;
}

</code></pre>` },
  { name: `39. Pthreads / Basics / Thread Join`, path: `01_pthreads/01_basics/04_thread_join.c`, dir: `01_pthreads/01_basics`, body: `<h1 id="04_thread_joinc">04_thread_join.c</h1>
<pre><code class="language-c">/*
 * 04_thread_join.c -- Joinable vs detached threads.
 *
 *  A thread can be in one of two &quot;join states&quot;:
 *
 *      JOINABLE (default)
 *      ------------------
 *      Resources stay around until somebody calls pthread_join().
 *      pthread_join() lets you observe the return value AND reclaims the
 *      thread's stack/control block.
 *
 *      DETACHED
 *      --------
 *      &quot;Fire and forget&quot;. The runtime cleans up automatically when the
 *      thread exits -- but you can NEVER join it (or query its result).
 *
 *      JOINABLE              DETACHED
 *      --------              --------
 *      ./worker./             ./worker./
 *           |                       |
 *      pthread_join() blocks    nothing blocks
 *      until worker exits;      anywhere; resources
 *      then resources freed.    auto-freed on exit.
 *
 *  Pick:
 *      - Joinable    if you need the result OR need to know it's done.
 *      - Detached    for &quot;background&quot; tasks whose result you discard
 *                    (logging flush, periodic ping, etc.).
 *
 *  Pitfall: forgetting to join a joinable thread -&gt; resource leak (the
 *  thread control block survives until process exit).
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;          /* sleep() */

static void *joinable_fn(void *arg)
{
    (void)arg;
    printf(&quot;    [joinable] doing work...\\n&quot;);
    sleep(1);
    printf(&quot;    [joinable] done\\n&quot;);
    return (void *)0xCAFE;
}

static void *detached_fn(void *arg)
{
    (void)arg;
    for (int i = 0; i &lt; 3; ++i) {
        printf(&quot;    [detached] tick %d\\n&quot;, i);
        sleep(1);
    }
    printf(&quot;    [detached] exiting (cleans itself up)\\n&quot;);
    return NULL;
}

int main(void)
{
    /* JOINABLE example ------------------------------------------- */
    pthread_t j;
    pthread_create(&amp;j, NULL, joinable_fn, NULL);

    void *rv;
    pthread_join(j, &amp;rv);
    printf(&quot;[main] joinable returned 0x%lx\\n&quot;, (unsigned long)rv);

    /* DETACHED example ------------------------------------------- */
    pthread_t d;
    pthread_create(&amp;d, NULL, detached_fn, NULL);
    pthread_detach(d);                     /* mark as detached */

    /* If we exited main here, the detached thread would be killed by
     * process termination. Sleep so we can see it run. */
    printf(&quot;[main] sleeping while detached thread runs...\\n&quot;);
    sleep(4);
    printf(&quot;[main] exiting\\n&quot;);
    return 0;
}

</code></pre>` },
  { name: `40. Pthreads / Basics / Thread Attr`, path: `01_pthreads/01_basics/05_thread_attr.c`, dir: `01_pthreads/01_basics`, body: `<h1 id="05_thread_attrc">05_thread_attr.c</h1>
<pre><code class="language-c">/*
 * 05_thread_attr.c -- Customize a thread via pthread_attr_t.
 *
 *  By default pthread_create uses defaults that are usually fine. When you
 *  need to tweak something (stack size, scheduling, detach state), set up a
 *  pthread_attr_t and pass it.
 *
 *      +---------------- pthread_attr_t ----------------+
 *      | detachstate    : JOINABLE | DETACHED           |
 *      | stack          : address &amp; size                |
 *      | guardsize      : pages of &quot;no man's land&quot; past |
 *      |                  the stack to catch overflows  |
 *      | schedpolicy    : SCHED_OTHER | SCHED_FIFO ...  |
 *      | schedparam     : priority (RT only)            |
 *      | inheritsched   : EXPLICIT | INHERIT            |
 *      | scope          : SYSTEM | PROCESS              |
 *      +------------------------------------------------+
 *
 *  This example:
 *    - Sets a custom 1 MiB stack.
 *    - Marks the thread as detached at creation time.
 *
 *  Tip: always call pthread_attr_destroy() when you're done with the attr.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;

static void *worker(void *arg)
{
    (void)arg;
    /* Allocate a small array on the stack to &quot;use&quot; some of it. */
    char buf[256 * 1024];                       /* 256 KiB */
    buf[0] = 'X';
    printf(&quot;[worker] stack-allocated 256 KiB at %p\\n&quot;, (void *)buf);
    sleep(1);
    printf(&quot;[worker] done\\n&quot;);
    return NULL;
}

int main(void)
{
    pthread_attr_t attr;
    pthread_attr_init(&amp;attr);

    /* 1 MiB stack (default is often 8 MiB on Linux glibc). */
    size_t stacksize = 1 * 1024 * 1024;
    pthread_attr_setstacksize(&amp;attr, stacksize);

    /* Create as detached so we don't have to join. */
    pthread_attr_setdetachstate(&amp;attr, PTHREAD_CREATE_DETACHED);

    pthread_t tid;
    pthread_create(&amp;tid, &amp;attr, worker, NULL);
    pthread_attr_destroy(&amp;attr);

    /* We can't join a detached thread, so wait by other means. */
    sleep(2);
    printf(&quot;[main] exiting\\n&quot;);
    return 0;
}

</code></pre>` },
  { name: `41. Pthreads / Mutex / Basic Mutex`, path: `01_pthreads/02_mutex/01_basic_mutex.c`, dir: `01_pthreads/02_mutex`, body: `<h1 id="01_basic_mutexc">01_basic_mutex.c</h1>
<pre><code class="language-c">/*
 * 01_basic_mutex.c -- The fundamental tool: pthread_mutex_t.
 *
 *  Without a mutex (SHOWING THE RACE):
 *
 *     thread A: tmp = counter;     (reads 5)
 *     thread B: tmp = counter;     (reads 5)
 *     thread A: tmp = tmp + 1;
 *     thread B: tmp = tmp + 1;
 *     thread A: counter = tmp;     (writes 6)
 *     thread B: counter = tmp;     (writes 6)
 *                                  expected 7, got 6  &lt;-- LOST UPDATE
 *
 *  With a mutex:
 *
 *      thread A                 thread B
 *      --------                 --------
 *      lock()  -- got it
 *        counter++              lock() ... blocks
 *      unlock()                 lock() -- got it
 *                                 counter++
 *                               unlock()
 *
 *  Mental model: a mutex is a TOKEN. Whoever holds the token may touch the
 *  shared data; everyone else waits in a queue.
 *
 *      +--------+      +-------------+
 *      | mutex  | &lt;--- | thread A    |
 *      |  held  |      | (in CS)     |
 *      +--------+      +-------------+
 *           ^
 *           |  blocked threads waiting:
 *           +-- thread B
 *           +-- thread C
 *
 *  Initialization options:
 *      pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;     // static, default
 *      pthread_mutex_init(&amp;m, NULL);                      // dynamic, default
 *      pthread_mutex_init(&amp;m, &amp;attr);                     // dynamic, custom
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;

#define NTHREADS  8
#define ITERS     100000

static long             counter = 0;
static pthread_mutex_t  lock    = PTHREAD_MUTEX_INITIALIZER;

static void *worker(void *arg)
{
    (void)arg;
    for (int i = 0; i &lt; ITERS; ++i) {
        pthread_mutex_lock(&amp;lock);
        ++counter;                         /* CRITICAL SECTION */
        pthread_mutex_unlock(&amp;lock);
    }
    return NULL;
}

int main(void)
{
    pthread_t t[NTHREADS];

    for (int i = 0; i &lt; NTHREADS; ++i)
        pthread_create(&amp;t[i], NULL, worker, NULL);
    for (int i = 0; i &lt; NTHREADS; ++i)
        pthread_join(t[i], NULL);

    long expected = (long)NTHREADS * ITERS;
    printf(&quot;counter = %ld (expected %ld) %s\\n&quot;,
           counter, expected,
           counter == expected ? &quot;OK&quot; : &quot;WRONG!&quot;);

    /* Always destroy mutexes you initialized with pthread_mutex_init.
     * It's harmless to destroy a statically initialized mutex too. */
    pthread_mutex_destroy(&amp;lock);
    return 0;
}

</code></pre>` },
  { name: `42. Pthreads / Mutex / Recursive Mutex`, path: `01_pthreads/02_mutex/02_recursive_mutex.c`, dir: `01_pthreads/02_mutex`, body: `<h1 id="02_recursive_mutexc">02_recursive_mutex.c</h1>
<pre><code class="language-c">/*
 * 02_recursive_mutex.c -- A mutex that the SAME thread can lock multiple
 *                         times without deadlocking itself.
 *
 *  Why does this exist? Consider a function f() that calls g(), and BOTH
 *  want to lock the same mutex. With a regular mutex, the second lock by
 *  the same thread deadlocks the program:
 *
 *     f() {
 *         lock(m);      // holds m
 *         g();          // -.
 *         unlock(m);    //  |
 *     }                 //  v
 *     g() {             // (now inside g, same thread)
 *         lock(m);      // &lt;-- regular mutex: DEADLOCK on self
 *         ...
 *         unlock(m);
 *     }
 *
 *  Recursive mutex semantics:
 *
 *     +---------+   lock        +---------+   lock        +---------+
 *     | count=0 | --thread A--&gt; | count=1 | --thread A--&gt; | count=2 |
 *     +---------+               +---------+               +---------+
 *           ^   unlock &lt;----------- |          unlock         |
 *           |       (count==0:      v        (count==1)       |
 *           +-------- released)                               |
 *
 *  The mutex remembers BOTH which thread holds it AND a depth counter.
 *  Only when the count reaches 0 does another thread get a chance.
 *
 *  Cost: slightly slower; recursive mutexes are usually a &quot;code smell&quot;
 *  meaning your locking design is unclear. Use sparingly.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;

static pthread_mutex_t rlock;

static void inner(void)
{
    pthread_mutex_lock(&amp;rlock);            /* second lock by same thread */
    printf(&quot;    inner() locked (depth 2)\\n&quot;);
    pthread_mutex_unlock(&amp;rlock);
    printf(&quot;    inner() unlocked (depth 1)\\n&quot;);
}

static void *worker(void *arg)
{
    (void)arg;
    pthread_mutex_lock(&amp;rlock);            /* first lock */
    printf(&quot;worker() locked (depth 1)\\n&quot;);
    inner();                               /* would deadlock with normal mutex */
    pthread_mutex_unlock(&amp;rlock);          /* depth 0, fully released */
    printf(&quot;worker() fully unlocked\\n&quot;);
    return NULL;
}

int main(void)
{
    pthread_mutexattr_t attr;
    pthread_mutexattr_init(&amp;attr);
    pthread_mutexattr_settype(&amp;attr, PTHREAD_MUTEX_RECURSIVE);
    pthread_mutex_init(&amp;rlock, &amp;attr);
    pthread_mutexattr_destroy(&amp;attr);

    pthread_t t;
    pthread_create(&amp;t, NULL, worker, NULL);
    pthread_join(t, NULL);

    pthread_mutex_destroy(&amp;rlock);
    return 0;
}

</code></pre>` },
  { name: `43. Pthreads / Mutex / Trylock`, path: `01_pthreads/02_mutex/03_trylock.c`, dir: `01_pthreads/02_mutex`, body: `<h1 id="03_trylockc">03_trylock.c</h1>
<pre><code class="language-c">/*
 * 03_trylock.c -- Non-blocking attempt to lock.
 *
 *  pthread_mutex_trylock() returns:
 *      0       -- lock acquired
 *      EBUSY   -- somebody else holds it; we did NOT wait
 *
 *  Useful when:
 *      - You can do alternative work if the lock is busy
 *      - You want to detect deadlock potential
 *      - You're doing optimistic concurrency
 *
 *  Picture:
 *
 *      pthread_mutex_lock(m)        pthread_mutex_trylock(m)
 *      ------------------------     -----------------------------
 *      |                            |
 *      v  [lock free?]              v  [lock free?]
 *     yes -&gt; acquire, return 0     yes -&gt; acquire, return 0
 *     no  -&gt; SLEEP until free      no  -&gt; return EBUSY immediately
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;
#include &lt;errno.h&gt;

static pthread_mutex_t lock = PTHREAD_MUTEX_INITIALIZER;

static void *holder(void *arg)
{
    (void)arg;
    pthread_mutex_lock(&amp;lock);
    printf(&quot;[holder]   acquired the lock; holding for 2 seconds\\n&quot;);
    sleep(2);
    pthread_mutex_unlock(&amp;lock);
    printf(&quot;[holder]   released the lock\\n&quot;);
    return NULL;
}

static void *poker(void *arg)
{
    (void)arg;
    /* Give holder time to grab the lock first. */
    usleep(100 * 1000);

    for (int i = 0; i &lt; 5; ++i) {
        int rc = pthread_mutex_trylock(&amp;lock);
        if (rc == 0) {
            printf(&quot;[poker ]   got it on attempt %d!\\n&quot;, i);
            pthread_mutex_unlock(&amp;lock);
            break;
        } else if (rc == EBUSY) {
            printf(&quot;[poker ]   busy (attempt %d), do other work...\\n&quot;, i);
            sleep(1);                       /* simulate doing other work */
        } else {
            printf(&quot;[poker ]   trylock unexpected error %d\\n&quot;, rc);
            break;
        }
    }
    return NULL;
}

int main(void)
{
    pthread_t h, p;
    pthread_create(&amp;h, NULL, holder, NULL);
    pthread_create(&amp;p, NULL, poker, NULL);
    pthread_join(h, NULL);
    pthread_join(p, NULL);
    pthread_mutex_destroy(&amp;lock);
    return 0;
}

</code></pre>` },
  { name: `44. Pthreads / Mutex / Timed Lock`, path: `01_pthreads/02_mutex/04_timed_lock.c`, dir: `01_pthreads/02_mutex`, body: `<h1 id="04_timed_lockc">04_timed_lock.c</h1>
<pre><code class="language-c">/*
 * 04_timed_lock.c -- Lock with a deadline.
 *
 *  pthread_mutex_timedlock(&amp;m, &amp;abs_time):
 *      - blocks until either it gets the lock OR \`abs_time\` passes
 *      - returns 0 on success, ETIMEDOUT on timeout
 *
 *  Note that \`abs_time\` is an ABSOLUTE point in time (CLOCK_REALTIME by
 *  default), NOT a duration. So you typically:
 *
 *      struct timespec ts;
 *      clock_gettime(CLOCK_REALTIME, &amp;ts);
 *      ts.tv_sec += 1;                     // wait up to 1 second
 *      pthread_mutex_timedlock(&amp;m, &amp;ts);
 *
 *  ASCII timeline (lock currently held by holder for 3 sec, we wait 1 sec):
 *
 *      time ---&gt;
 *      holder:   |==========================|
 *      us:       (try)----wait----timeout
 *
 *  NOTE: Not available on macOS without extensions. This file uses an
 *  #ifdef so it still compiles there (the call gracefully degrades).
 */

#define _XOPEN_SOURCE 700
#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;
#include &lt;time.h&gt;
#include &lt;errno.h&gt;

static pthread_mutex_t lock = PTHREAD_MUTEX_INITIALIZER;

static void *holder(void *arg)
{
    (void)arg;
    pthread_mutex_lock(&amp;lock);
    printf(&quot;[holder] locked, sleeping 3 seconds\\n&quot;);
    sleep(3);
    pthread_mutex_unlock(&amp;lock);
    return NULL;
}

static void *waiter(void *arg)
{
    (void)arg;
    /* let holder lock first */
    usleep(100 * 1000);

#ifdef __APPLE__
    /* pthread_mutex_timedlock is not in macOS libc by default; emulate. */
    struct timespec deadline;
    clock_gettime(CLOCK_REALTIME, &amp;deadline);
    deadline.tv_sec += 1;

    while (1) {
        int rc = pthread_mutex_trylock(&amp;lock);
        if (rc == 0) {
            printf(&quot;[waiter] got the lock!\\n&quot;);
            pthread_mutex_unlock(&amp;lock);
            return NULL;
        }
        struct timespec now;
        clock_gettime(CLOCK_REALTIME, &amp;now);
        if (now.tv_sec  &gt;  deadline.tv_sec ||
           (now.tv_sec == deadline.tv_sec &amp;&amp; now.tv_nsec &gt;= deadline.tv_nsec)) {
            printf(&quot;[waiter] timeout (poll-emulated)\\n&quot;);
            return NULL;
        }
        struct timespec wait = { 0, 10 * 1000 * 1000 }; /* 10ms */
        nanosleep(&amp;wait, NULL);
    }
#else
    struct timespec ts;
    clock_gettime(CLOCK_REALTIME, &amp;ts);
    ts.tv_sec += 1;                                   /* 1-second deadline */

    int rc = pthread_mutex_timedlock(&amp;lock, &amp;ts);
    if (rc == 0) {
        printf(&quot;[waiter] got the lock\\n&quot;);
        pthread_mutex_unlock(&amp;lock);
    } else if (rc == ETIMEDOUT) {
        printf(&quot;[waiter] timed out after 1 second (lock still held)\\n&quot;);
    } else {
        printf(&quot;[waiter] error %d\\n&quot;, rc);
    }
#endif
    return NULL;
}

int main(void)
{
    pthread_t h, w;
    pthread_create(&amp;h, NULL, holder, NULL);
    pthread_create(&amp;w, NULL, waiter, NULL);
    pthread_join(h, NULL);
    pthread_join(w, NULL);
    pthread_mutex_destroy(&amp;lock);
    return 0;
}

</code></pre>` },
  { name: `45. Pthreads / Mutex / Deadlock Demo`, path: `01_pthreads/02_mutex/05_deadlock_demo.c`, dir: `01_pthreads/02_mutex`, body: `<h1 id="05_deadlock_democ">05_deadlock_demo.c</h1>
<pre><code class="language-c">/*
 * 05_deadlock_demo.c -- Two-mutex deadlock and how to avoid it.
 *
 *  THE DEADLOCK (lock-ordering inversion):
 *
 *      thread A:                thread B:
 *      lock(m1)                 lock(m2)
 *      lock(m2)  &lt;-- waits B   lock(m1)  &lt;-- waits A
 *      ...                      ...
 *      unlock(m2)               unlock(m1)
 *      unlock(m1)               unlock(m2)
 *
 *      circular wait:
 *
 *          A holds m1, wants m2     +---+    wants    +---+
 *                                   | A |  --------&gt;  | m2|
 *                                   +---+             +---+
 *                                     ^                 |
 *                                holds|                 |held by
 *                                     |                 v
 *                                   +---+    wants    +---+
 *                                   | m1|  &lt;--------  | B |
 *                                   +---+             +---+
 *
 *      Coffman's four conditions for deadlock (need ALL four):
 *        1. Mutual exclusion       (lock can be held by only one thread)
 *        2. Hold-and-wait          (hold one resource while waiting for another)
 *        3. No preemption          (can't take a lock from a thread)
 *        4. Circular wait          (cycle in the wait-for graph)
 *
 *      Easiest fix: BREAK CIRCULAR WAIT by always locking in a fixed
 *      global order. Below we lock by the lower address first.
 *
 *  This file:
 *    - First runs the buggy version with a small race window so it
 *      reliably deadlocks. We bound it with a 2-second alarm that aborts.
 *      (Comment out main()'s call to deadlock_run() once you've seen it.)
 *    - Then runs the fixed version that always succeeds.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;
#include &lt;signal.h&gt;
#include &lt;stdlib.h&gt;

static pthread_mutex_t m1 = PTHREAD_MUTEX_INITIALIZER;
static pthread_mutex_t m2 = PTHREAD_MUTEX_INITIALIZER;

/* ---------- BUGGY VERSION (deadlocks) -------------------------- */

static void *bad_a(void *arg)
{
    (void)arg;
    pthread_mutex_lock(&amp;m1);
    printf(&quot;[bad A] got m1, sleeping...\\n&quot;);
    usleep(100 * 1000);                    /* widen race window */
    printf(&quot;[bad A] trying for m2...\\n&quot;);
    pthread_mutex_lock(&amp;m2);
    printf(&quot;[bad A] got both!\\n&quot;);
    pthread_mutex_unlock(&amp;m2);
    pthread_mutex_unlock(&amp;m1);
    return NULL;
}

static void *bad_b(void *arg)
{
    (void)arg;
    pthread_mutex_lock(&amp;m2);
    printf(&quot;[bad B] got m2, sleeping...\\n&quot;);
    usleep(100 * 1000);
    printf(&quot;[bad B] trying for m1...\\n&quot;);
    pthread_mutex_lock(&amp;m1);
    printf(&quot;[bad B] got both!\\n&quot;);
    pthread_mutex_unlock(&amp;m1);
    pthread_mutex_unlock(&amp;m2);
    return NULL;
}

static void deadlock_run(void)
{
    printf(&quot;--- Demonstrating deadlock (will abort after 2 seconds) ---\\n&quot;);
    alarm(2);                              /* SIGALRM kills the process */
    pthread_t a, b;
    pthread_create(&amp;a, NULL, bad_a, NULL);
    pthread_create(&amp;b, NULL, bad_b, NULL);
    pthread_join(a, NULL);                 /* never returns */
    pthread_join(b, NULL);
    alarm(0);
}

/* ---------- FIXED VERSION (lock ordering by address) ----------- */

static void lock_ordered(pthread_mutex_t *x, pthread_mutex_t *y)
{
    if (x &lt; y) { pthread_mutex_lock(x); pthread_mutex_lock(y); }
    else       { pthread_mutex_lock(y); pthread_mutex_lock(x); }
}

static void unlock_two(pthread_mutex_t *x, pthread_mutex_t *y)
{
    /* Order of unlock doesn't affect correctness for blocking unlocks. */
    pthread_mutex_unlock(x);
    pthread_mutex_unlock(y);
}

static void *good_a(void *arg)
{
    (void)arg;
    lock_ordered(&amp;m1, &amp;m2);
    printf(&quot;[good A] got both safely\\n&quot;);
    unlock_two(&amp;m1, &amp;m2);
    return NULL;
}

static void *good_b(void *arg)
{
    (void)arg;
    lock_ordered(&amp;m2, &amp;m1);                /* same global order */
    printf(&quot;[good B] got both safely\\n&quot;);
    unlock_two(&amp;m1, &amp;m2);
    return NULL;
}

int main(int argc, char **argv)
{
    if (argc &gt; 1 &amp;&amp; argv[1][0] == 'd') {
        deadlock_run();                    /* demo deadlock then SIGALRM-exit */
    }
    pthread_t a, b;
    pthread_create(&amp;a, NULL, good_a, NULL);
    pthread_create(&amp;b, NULL, good_b, NULL);
    pthread_join(a, NULL);
    pthread_join(b, NULL);
    printf(&quot;--- Fixed version completed without deadlock ---\\n&quot;);
    return 0;
}

</code></pre>` },
  { name: `46. Pthreads / Condition Variables / Basic Cv`, path: `01_pthreads/03_condition_variables/01_basic_cv.c`, dir: `01_pthreads/03_condition_variables`, body: `<h1 id="01_basic_cvc">01_basic_cv.c</h1>
<pre><code class="language-c">/*
 * 01_basic_cv.c -- Condition variables: &quot;wait until something is true&quot;.
 *
 *  A mutex protects shared data. A condition variable lets a thread go
 *  to sleep and be woken when shared data CHANGES into a state of interest.
 *
 *  THREE INVIOLABLE RULES of condvars:
 *
 *    1. Always pair a CV with a mutex AND a predicate (boolean expression
 *       on shared data).
 *    2. Always wait in a LOOP rechecking the predicate (spurious wakeups,
 *       and other threads might race in between signal and wake).
 *    3. The mutex MUST be held when calling pthread_cond_wait. wait()
 *       atomically releases the mutex AND sleeps; on wake-up, it
 *       reacquires the mutex.
 *
 *  Canonical pattern:
 *
 *      // ----- consumer -----
 *      pthread_mutex_lock(&amp;m);
 *      while (!predicate)              &lt;-- LOOP, never an \`if\`
 *          pthread_cond_wait(&amp;cv, &amp;m); &lt;-- atomically: unlock+sleep, on wake re-lock
 *      // predicate is true; do something
 *      pthread_mutex_unlock(&amp;m);
 *
 *      // ----- producer -----
 *      pthread_mutex_lock(&amp;m);
 *      // change state so predicate becomes true
 *      pthread_cond_signal(&amp;cv);       // wake ONE waiter
 *      // (or pthread_cond_broadcast(&amp;cv) to wake ALL)
 *      pthread_mutex_unlock(&amp;m);
 *
 *  ASCII timeline:
 *
 *     consumer                    producer
 *     --------                    --------
 *     lock(m)
 *     while !ready:
 *         cond_wait ----+
 *         (sleeps)      |
 *                       |          lock(m)
 *                       |          ready = 1
 *                       |          cond_signal
 *                       |          unlock(m)
 *         &lt;--- wakes ---+
 *         (re-locks m)
 *     do_work()
 *     unlock(m)
 *
 *  Why MUST we hold the mutex while signaling?
 *      Because otherwise this race exists:
 *
 *        consumer                       producer
 *        --------                       --------
 *        check predicate (false)
 *                                       set predicate true
 *                                       cond_signal     &lt;-- nobody hears!
 *        cond_wait                       (sleeps forever)
 *
 *      With the mutex held during the predicate-update + signal, the
 *      consumer either hasn't yet locked it (so it'll see the new value
 *      after locking) or is already inside cond_wait (so it'll be woken).
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

static pthread_mutex_t m       = PTHREAD_MUTEX_INITIALIZER;
static pthread_cond_t  cv      = PTHREAD_COND_INITIALIZER;
static int             ready   = 0;
static int             payload = 0;

static void *consumer(void *arg)
{
    (void)arg;
    pthread_mutex_lock(&amp;m);
    while (!ready) {
        printf(&quot;[consumer] not ready, sleeping on cv...\\n&quot;);
        pthread_cond_wait(&amp;cv, &amp;m);
        printf(&quot;[consumer] woke up, rechecking predicate\\n&quot;);
    }
    printf(&quot;[consumer] got payload = %d\\n&quot;, payload);
    pthread_mutex_unlock(&amp;m);
    return NULL;
}

static void *producer(void *arg)
{
    (void)arg;
    sleep(1);                              /* let consumer sleep first */

    pthread_mutex_lock(&amp;m);
    payload = 42;
    ready   = 1;
    pthread_cond_signal(&amp;cv);              /* could be broadcast for many */
    pthread_mutex_unlock(&amp;m);
    printf(&quot;[producer] signaled\\n&quot;);
    return NULL;
}

int main(void)
{
    pthread_t c, p;
    pthread_create(&amp;c, NULL, consumer, NULL);
    pthread_create(&amp;p, NULL, producer, NULL);
    pthread_join(c, NULL);
    pthread_join(p, NULL);
    return 0;
}

</code></pre>` },
  { name: `47. Pthreads / Condition Variables / Producer Consumer`, path: `01_pthreads/03_condition_variables/02_producer_consumer.c`, dir: `01_pthreads/03_condition_variables`, body: `<h1 id="02_producer_consumerc">02_producer_consumer.c</h1>
<pre><code class="language-c">/*
 * 02_producer_consumer.c -- Bounded buffer with cond vars (the canonical
 *                           multi-producer / multi-consumer queue).
 *
 *  Buffer (capacity = N):
 *
 *      head                                tail
 *       |                                   |
 *       v                                   v
 *      +---+---+---+---+---+---+---+---+---+
 *      | a | b | c | d | _ | _ | _ | _ | _ |  &lt;-- circular array
 *      +---+---+---+---+---+---+---+---+---+
 *       &lt;--- count items ---&gt;
 *
 *  Two predicates, two CVs:
 *      not_full   : count &lt; N    (producers wait when full)
 *      not_empty  : count &gt; 0    (consumers wait when empty)
 *
 *  Why TWO CVs (not just one)?
 *      With a single CV and broadcast, you get &quot;thundering herd&quot; --
 *      every wake-up some threads check, find their predicate false,
 *      and go back to sleep. Wasted work. Two CVs let signal() target
 *      exactly the kind of thread that should now be able to make
 *      progress.
 *
 *  The flow:
 *
 *      Producer                                 Consumer
 *      --------                                 --------
 *      lock(m)                                  lock(m)
 *      while count == N:                        while count == 0:
 *          wait(not_full, m)                        wait(not_empty, m)
 *      put(item)                                item = take()
 *      count++                                  count--
 *      signal(not_empty)                        signal(not_full)
 *      unlock(m)                                unlock(m)
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;

#define CAP 4
#define N_PRODUCERS 2
#define N_CONSUMERS 3
#define ITEMS_PER_PRODUCER 8

typedef struct {
    int             buf[CAP];
    int             head;          /* next write index */
    int             tail;          /* next read index */
    int             count;
    pthread_mutex_t m;
    pthread_cond_t  not_full;
    pthread_cond_t  not_empty;
} queue_t;

static void q_init(queue_t *q)
{
    q-&gt;head = q-&gt;tail = q-&gt;count = 0;
    pthread_mutex_init(&amp;q-&gt;m, NULL);
    pthread_cond_init(&amp;q-&gt;not_full, NULL);
    pthread_cond_init(&amp;q-&gt;not_empty, NULL);
}

static void q_destroy(queue_t *q)
{
    pthread_mutex_destroy(&amp;q-&gt;m);
    pthread_cond_destroy(&amp;q-&gt;not_full);
    pthread_cond_destroy(&amp;q-&gt;not_empty);
}

static void q_put(queue_t *q, int v)
{
    pthread_mutex_lock(&amp;q-&gt;m);
    while (q-&gt;count == CAP)
        pthread_cond_wait(&amp;q-&gt;not_full, &amp;q-&gt;m);

    q-&gt;buf[q-&gt;head] = v;
    q-&gt;head = (q-&gt;head + 1) % CAP;
    q-&gt;count++;

    pthread_cond_signal(&amp;q-&gt;not_empty);
    pthread_mutex_unlock(&amp;q-&gt;m);
}

static int q_get(queue_t *q)
{
    pthread_mutex_lock(&amp;q-&gt;m);
    while (q-&gt;count == 0)
        pthread_cond_wait(&amp;q-&gt;not_empty, &amp;q-&gt;m);

    int v = q-&gt;buf[q-&gt;tail];
    q-&gt;tail = (q-&gt;tail + 1) % CAP;
    q-&gt;count--;

    pthread_cond_signal(&amp;q-&gt;not_full);
    pthread_mutex_unlock(&amp;q-&gt;m);
    return v;
}

/* ---- workers ------------------------------------------------- */

static queue_t Q;

static void *producer(void *arg)
{
    int id = (int)(long)arg;
    for (int i = 0; i &lt; ITEMS_PER_PRODUCER; ++i) {
        int item = id * 1000 + i;
        q_put(&amp;Q, item);
        printf(&quot;[P%d] put %d\\n&quot;, id, item);
        usleep(50 * 1000);
    }
    return NULL;
}

static void *consumer(void *arg)
{
    int id = (int)(long)arg;
    /* terminate when we've consumed our share */
    int total = (N_PRODUCERS * ITEMS_PER_PRODUCER) / N_CONSUMERS + 1;
    for (int i = 0; i &lt; total; ++i) {
        int item = q_get(&amp;Q);
        printf(&quot;    [C%d] got %d\\n&quot;, id, item);
        usleep(120 * 1000);
    }
    return NULL;
}

int main(void)
{
    q_init(&amp;Q);

    pthread_t p[N_PRODUCERS], c[N_CONSUMERS];
    for (long i = 0; i &lt; N_PRODUCERS; ++i)
        pthread_create(&amp;p[i], NULL, producer, (void *)i);
    for (long i = 0; i &lt; N_CONSUMERS; ++i)
        pthread_create(&amp;c[i], NULL, consumer, (void *)i);

    /* Producers will finish naturally; consumers will keep going if no
       items arrive, so we sleep then cancel them. In real code, send a
       sentinel value through the queue. */
    for (int i = 0; i &lt; N_PRODUCERS; ++i) pthread_join(p[i], NULL);
    sleep(2);
    for (int i = 0; i &lt; N_CONSUMERS; ++i) pthread_cancel(c[i]);
    for (int i = 0; i &lt; N_CONSUMERS; ++i) pthread_join(c[i], NULL);

    q_destroy(&amp;Q);
    return 0;
}

</code></pre>` },
  { name: `48. Pthreads / Condition Variables / Broadcast`, path: `01_pthreads/03_condition_variables/03_broadcast.c`, dir: `01_pthreads/03_condition_variables`, body: `<h1 id="03_broadcastc">03_broadcast.c</h1>
<pre><code class="language-c">/*
 * 03_broadcast.c -- signal() vs broadcast().
 *
 *      pthread_cond_signal     wakes ONE waiter (any one, no order)
 *      pthread_cond_broadcast  wakes ALL waiters
 *
 *  Use BROADCAST when:
 *      - The state change makes more than one waiter potentially eligible.
 *      - Multiple distinct predicates use the SAME CV (anti-pattern, but
 *        still happens) -- broadcast lets each thread re-check its own.
 *      - You want a &quot;barrier-like&quot; &quot;go!&quot; event for many waiters.
 *
 *  Use SIGNAL when:
 *      - Only one waiter can possibly proceed (e.g. one item produced,
 *        only one consumer can take it).
 *
 *  Picture: 3 worker threads waiting on \`start\`:
 *
 *     workers           cond_var &quot;start&quot;
 *     -------           ----------------
 *     T1 wait ----&gt;     [ T1, T2, T3 ]
 *     T2 wait ----&gt;
 *     T3 wait ----&gt;
 *
 *     main:
 *       broadcast() ---&gt; wakes T1, T2, T3 all at once
 *
 *     vs:
 *       signal()    ---&gt; wakes ONE of {T1,T2,T3}, others still asleep
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

#define N 4

static pthread_mutex_t m  = PTHREAD_MUTEX_INITIALIZER;
static pthread_cond_t  cv = PTHREAD_COND_INITIALIZER;
static int             go = 0;

static void *worker(void *arg)
{
    long id = (long)arg;
    pthread_mutex_lock(&amp;m);
    while (!go)
        pthread_cond_wait(&amp;cv, &amp;m);
    pthread_mutex_unlock(&amp;m);

    printf(&quot;[w%ld] running!\\n&quot;, id);
    return NULL;
}

int main(void)
{
    pthread_t t[N];
    for (long i = 0; i &lt; N; ++i)
        pthread_create(&amp;t[i], NULL, worker, (void *)i);

    sleep(1);
    printf(&quot;[main] firing the starting gun\\n&quot;);

    pthread_mutex_lock(&amp;m);
    go = 1;
    pthread_cond_broadcast(&amp;cv);           /* wake them ALL at once */
    pthread_mutex_unlock(&amp;m);

    for (int i = 0; i &lt; N; ++i)
        pthread_join(t[i], NULL);
    return 0;
}

</code></pre>` },
  { name: `49. Pthreads / Condition Variables / Timed Wait`, path: `01_pthreads/03_condition_variables/04_timed_wait.c`, dir: `01_pthreads/03_condition_variables`, body: `<h1 id="04_timed_waitc">04_timed_wait.c</h1>
<pre><code class="language-c">/*
 * 04_timed_wait.c -- pthread_cond_timedwait(): wait, but no longer than X.
 *
 *  Same as pthread_cond_wait, but if the deadline passes before a signal
 *  arrives, returns ETIMEDOUT.
 *
 *  A correct timed-wait loop must compute an ABSOLUTE deadline ONCE, then
 *  re-check it each iteration; otherwise spurious wakeups extend your wait.
 *
 *      compute deadline = now + dt
 *      lock
 *      while (!predicate):
 *          rc = timedwait(cv, m, deadline)
 *          if rc == ETIMEDOUT and !predicate:
 *              break  // give up
 *      unlock
 *
 *  ASCII:
 *
 *     time ---&gt;
 *     |---now-------------------dt-------------------|deadline
 *           ^ thread sleeping on cv
 *                                               ^ if no signal by here,
 *                                                 timedwait returns
 *                                                 ETIMEDOUT
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;time.h&gt;
#include &lt;errno.h&gt;

static pthread_mutex_t m       = PTHREAD_MUTEX_INITIALIZER;
static pthread_cond_t  cv      = PTHREAD_COND_INITIALIZER;
static int             ready   = 0;       /* will never become true */

int main(void)
{
    struct timespec deadline;
    clock_gettime(CLOCK_REALTIME, &amp;deadline);
    deadline.tv_sec += 1;                  /* 1 second budget */

    pthread_mutex_lock(&amp;m);
    int rc = 0;
    while (!ready) {
        rc = pthread_cond_timedwait(&amp;cv, &amp;m, &amp;deadline);
        if (rc == ETIMEDOUT) {
            printf(&quot;[main] gave up waiting (1s deadline reached)\\n&quot;);
            break;
        }
    }
    pthread_mutex_unlock(&amp;m);
    return 0;
}

</code></pre>` },
  { name: `50. Pthreads / Rwlock / Rwlock Basic`, path: `01_pthreads/04_rwlock/01_rwlock_basic.c`, dir: `01_pthreads/04_rwlock`, body: `<h1 id="01_rwlock_basicc">01_rwlock_basic.c</h1>
<pre><code class="language-c">/*
 * 01_rwlock_basic.c -- Read/write lock (pthread_rwlock_t).
 *
 *  Idea: many threads can READ in parallel, but writes need exclusive access.
 *
 *      +----------------------------------------------+
 *      | rwlock state matrix                          |
 *      +-------+--------+--------+--------------------+
 *      |       | reader | writer | resulting state    |
 *      +-------+--------+--------+--------------------+
 *      | free  |  ok    |  ok    | (1 reader / 1 wr)  |
 *      | rd-h  |  ok    | block  | multi readers      |
 *      | wr-h  | block  | block  | exclusive          |
 *      +-------+--------+--------+--------------------+
 *
 *  When to use:
 *    - Reads dominate writes (e.g. config that updates rarely).
 *    - Read critical sections are non-trivial (otherwise locking overhead
 *      eats the savings -- a plain mutex may be faster).
 *
 *  Pitfall: writer starvation. If many readers keep arriving, a pending
 *  writer may wait forever. Most implementations use writer preference,
 *  but verify your platform if it matters.
 *
 *  ASCII for &quot;many readers, one writer&quot;:
 *
 *     time ---&gt;
 *     R1 ===========
 *     R2  ============
 *     R3   ===========
 *     W                       =====
 *     R4                                ==========
 *
 *     During the W's stretch no reader is allowed; once W releases,
 *     reads run in parallel again.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

static pthread_rwlock_t rw    = PTHREAD_RWLOCK_INITIALIZER;
static int              shared = 0;

static void *reader(void *arg)
{
    long id = (long)arg;
    for (int i = 0; i &lt; 3; ++i) {
        pthread_rwlock_rdlock(&amp;rw);
        printf(&quot;[R%ld] read shared=%d\\n&quot;, id, shared);
        usleep(100 * 1000);                /* hold the read lock briefly */
        pthread_rwlock_unlock(&amp;rw);
        usleep(50 * 1000);
    }
    return NULL;
}

static void *writer(void *arg)
{
    long id = (long)arg;
    for (int i = 0; i &lt; 2; ++i) {
        pthread_rwlock_wrlock(&amp;rw);
        ++shared;
        printf(&quot;[W%ld] wrote shared=%d (exclusive)\\n&quot;, id, shared);
        usleep(150 * 1000);
        pthread_rwlock_unlock(&amp;rw);
        usleep(150 * 1000);
    }
    return NULL;
}

int main(void)
{
    pthread_t r[4], w[1];
    for (long i = 0; i &lt; 4; ++i) pthread_create(&amp;r[i], NULL, reader, (void *)i);
    for (long i = 0; i &lt; 1; ++i) pthread_create(&amp;w[i], NULL, writer, (void *)i);
    for (int i = 0; i &lt; 4; ++i) pthread_join(r[i], NULL);
    for (int i = 0; i &lt; 1; ++i) pthread_join(w[i], NULL);
    pthread_rwlock_destroy(&amp;rw);
    return 0;
}

</code></pre>` },
  { name: `51. Pthreads / Barriers / Barrier Basic`, path: `01_pthreads/05_barriers/01_barrier_basic.c`, dir: `01_pthreads/05_barriers`, body: `<h1 id="01_barrier_basicc">01_barrier_basic.c</h1>
<pre><code class="language-c">/*
 * 01_barrier_basic.c -- pthread_barrier_t: rendezvous of N threads.
 *
 *  All threads call pthread_barrier_wait(). The first N-1 callers block.
 *  When the Nth thread arrives, the barrier &quot;releases&quot; and EVERYONE
 *  proceeds at the same time. Useful for phased computations:
 *
 *     phase 1     barrier      phase 2     barrier      phase 3
 *     --------    -------      --------    -------      --------
 *     T1 work --&gt; wait()  --&gt;  T1 work --&gt; wait()  --&gt;  T1 work
 *     T2 work --&gt; wait()  --&gt;  T2 work --&gt; wait()  --&gt;  T2 work
 *     T3 work --&gt; wait()  --&gt;  T3 work --&gt; wait()  --&gt;  T3 work
 *               (all aligned)            (all aligned)
 *
 *  Exactly ONE thread (the &quot;serial thread&quot;) gets the special return value
 *  PTHREAD_BARRIER_SERIAL_THREAD; the others get 0. That lets one designated
 *  thread do post-phase serial work (printing summary, swapping buffers).
 *
 *  Note: macOS lacks pthread_barrier; this example is Linux-tested.
 */

#define _XOPEN_SOURCE 700
#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;

#define N_THREADS 4

#ifdef __APPLE__
int main(void) { puts(&quot;pthread_barrier not available on macOS&quot;); return 0; }
#else
static pthread_barrier_t bar;

static void *worker(void *arg)
{
    long id = (long)arg;
    for (int phase = 1; phase &lt;= 3; ++phase) {
        usleep((id + 1) * 100 * 1000);     /* unequal work to show waiting */
        printf(&quot;[T%ld] reached barrier phase %d\\n&quot;, id, phase);

        int rc = pthread_barrier_wait(&amp;bar);
        if (rc == PTHREAD_BARRIER_SERIAL_THREAD)
            printf(&quot;=== phase %d complete (announced by T%ld) ===\\n&quot;, phase, id);
    }
    return NULL;
}

int main(void)
{
    pthread_barrier_init(&amp;bar, NULL, N_THREADS);

    pthread_t t[N_THREADS];
    for (long i = 0; i &lt; N_THREADS; ++i)
        pthread_create(&amp;t[i], NULL, worker, (void *)i);
    for (int i = 0; i &lt; N_THREADS; ++i)
        pthread_join(t[i], NULL);

    pthread_barrier_destroy(&amp;bar);
    return 0;
}
#endif

</code></pre>` },
  { name: `52. Pthreads / Semaphores / Semaphore Basic`, path: `01_pthreads/06_semaphores/01_semaphore_basic.c`, dir: `01_pthreads/06_semaphores`, body: `<h1 id="01_semaphore_basicc">01_semaphore_basic.c</h1>
<pre><code class="language-c">/*
 * 01_semaphore_basic.c -- POSIX unnamed semaphore (sem_t).
 *
 *  A semaphore is a non-negative counter with two atomic operations:
 *
 *      sem_wait(s)    aka P()    if s&gt;0: s--, else block
 *      sem_post(s)    aka V()    s++; possibly wakes one waiter
 *
 *  With initial value 1 it's a binary semaphore (mutex-ish, but any thread
 *  can post -- no ownership). With value N it gates N concurrent users.
 *
 *  Picture: 3 connections allowed at once into a &quot;DB pool&quot;:
 *
 *     pool sem starts at 3:
 *
 *     T1 sem_wait -&gt; 2
 *     T2 sem_wait -&gt; 1
 *     T3 sem_wait -&gt; 0
 *     T4 sem_wait -&gt; blocks (-1 conceptually)
 *     T1 sem_post -&gt; 0     (wakes T4 -&gt; still 0 from its perspective)
 *     T4 ...
 *
 *  When to choose semaphore vs mutex/cv:
 *      - Counting resources (slots, tokens, buffers) -&gt; semaphore
 *      - Mutual exclusion of a section                -&gt; mutex
 *      - &quot;Wait until predicate&quot;                       -&gt; mutex + cond_var
 *
 *  NOTE: macOS deprecated unnamed semaphores. We use named sem on macOS.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;
#include &lt;semaphore.h&gt;
#include &lt;fcntl.h&gt;           /* for O_CREAT */
#include &lt;stdlib.h&gt;

#define POOL  3
#define USERS 6

#ifdef __APPLE__
static sem_t *gate;
#define SEM_OBJ gate
#define SEM_NAME &quot;/threading_guide_demo_sem&quot;
#else
static sem_t  gate_storage;
static sem_t *gate = &amp;gate_storage;
#define SEM_OBJ gate
#endif

static void *user(void *arg)
{
    long id = (long)arg;
    printf(&quot;[U%ld] waiting for a slot...\\n&quot;, id);
    sem_wait(SEM_OBJ);
    printf(&quot;    [U%ld] working in the pool\\n&quot;, id);
    sleep(1);
    printf(&quot;    [U%ld] leaving the pool\\n&quot;, id);
    sem_post(SEM_OBJ);
    return NULL;
}

int main(void)
{
#ifdef __APPLE__
    sem_unlink(SEM_NAME);
    SEM_OBJ = sem_open(SEM_NAME, O_CREAT, 0600, POOL);
    if (SEM_OBJ == SEM_FAILED) { perror(&quot;sem_open&quot;); return 1; }
#else
    sem_init(SEM_OBJ, 0 /*pshared=0:thread-shared*/, POOL);
#endif

    pthread_t t[USERS];
    for (long i = 0; i &lt; USERS; ++i)
        pthread_create(&amp;t[i], NULL, user, (void *)i);
    for (int i = 0; i &lt; USERS; ++i)
        pthread_join(t[i], NULL);

#ifdef __APPLE__
    sem_close(SEM_OBJ);
    sem_unlink(SEM_NAME);
#else
    sem_destroy(SEM_OBJ);
#endif
    return 0;
}

</code></pre>` },
  { name: `53. Pthreads / Spinlock / Spinlock`, path: `01_pthreads/07_spinlock/01_spinlock.c`, dir: `01_pthreads/07_spinlock`, body: `<h1 id="01_spinlockc">01_spinlock.c</h1>
<pre><code class="language-c">/*
 * 01_spinlock.c -- pthread_spinlock_t: busy-wait lock.
 *
 *  A spinlock loops in a tight CPU-burning loop trying to acquire the lock,
 *  rather than putting the thread to sleep. That eliminates the
 *  context-switch overhead of mutexes (~microseconds) IF the critical
 *  section is very short (a few ns to maybe 1 us).
 *
 *  Trade-off:
 *
 *     mutex (sleeps)         spinlock (burns CPU)
 *     -----------------      -----------------------
 *     +  no CPU while wait   +  no syscall
 *     +  fair-ish            +  minimum latency once free
 *     -  ~1us context-switch -  wasteful if section is long
 *     -  syscall path        -  worse on uniprocessor
 *
 *  Rule of thumb: prefer std::mutex / pthread_mutex unless profiling shows
 *  contended ultra-short sections (think: enqueue an int into a single
 *  field). Modern Linux glibc mutexes are already adaptive (spin briefly
 *  then sleep), often making explicit spinlocks unnecessary.
 *
 *  Picture:
 *
 *      mutex                  spinlock
 *      -----                  --------
 *      lock?  --no--&gt; sleep   lock? --no--&gt; goto retry  (HOT loop)
 *                              (sets cache line on fire across cores)
 *
 *  macOS does not provide pthread_spinlock; we fall back to a mutex there.
 */

#define _XOPEN_SOURCE 700
#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;

#define ITERS  100000
#define NTH    4

#ifdef __APPLE__
typedef pthread_mutex_t my_lock_t;
#define LOCK_INIT(l)    pthread_mutex_init((l), NULL)
#define LOCK_DESTROY(l) pthread_mutex_destroy(l)
#define LOCK(l)         pthread_mutex_lock(l)
#define UNLOCK(l)       pthread_mutex_unlock(l)
#else
typedef pthread_spinlock_t my_lock_t;
#define LOCK_INIT(l)    pthread_spin_init((l), PTHREAD_PROCESS_PRIVATE)
#define LOCK_DESTROY(l) pthread_spin_destroy(l)
#define LOCK(l)         pthread_spin_lock(l)
#define UNLOCK(l)       pthread_spin_unlock(l)
#endif

static my_lock_t lock;
static long       n = 0;

static void *worker(void *arg)
{
    (void)arg;
    for (int i = 0; i &lt; ITERS; ++i) {
        LOCK(&amp;lock);
        ++n;
        UNLOCK(&amp;lock);
    }
    return NULL;
}

int main(void)
{
    LOCK_INIT(&amp;lock);
    pthread_t t[NTH];
    for (int i = 0; i &lt; NTH; ++i) pthread_create(&amp;t[i], NULL, worker, NULL);
    for (int i = 0; i &lt; NTH; ++i) pthread_join(t[i], NULL);
    LOCK_DESTROY(&amp;lock);
    printf(&quot;n = %ld (expected %d)\\n&quot;, n, NTH * ITERS);
    return 0;
}

</code></pre>` },
  { name: `54. Pthreads / Thread Specific / Tls Pthread`, path: `01_pthreads/08_thread_specific/01_tls_pthread.c`, dir: `01_pthreads/08_thread_specific`, body: `<h1 id="01_tls_pthreadc">01_tls_pthread.c</h1>
<pre><code class="language-c">/*
 * 01_tls_pthread.c -- Thread-local storage with pthread_key_t.
 *
 *  Sometimes each thread needs its OWN copy of a variable -- e.g.
 *  a per-thread errno, scratch buffer, or RNG state. Two ways:
 *
 *    1. Compiler-provided  __thread  (GCC) / thread_local (C11)  -- easy.
 *    2. POSIX runtime API  pthread_key_t  -- more flexible
 *       (you can attach a destructor that runs at thread exit).
 *
 *  Picture:
 *
 *     +-------- shared key (pthread_key_t k) --------+
 *     |  k -&gt; per-thread slot                        |
 *     +----------------------------------------------+
 *           |                |                |
 *     thread A:        thread B:        thread C:
 *      slot[k] = X      slot[k] = Y      slot[k] = Z
 *
 *  Lifetime:
 *      pthread_key_create(&amp;k, dtor)   -- ONCE per process
 *      pthread_setspecific(k, ptr)    -- per thread
 *      pthread_getspecific(k)         -- per thread
 *      (when thread exits, dtor(ptr) is called -- great for cleanup)
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;

static pthread_key_t   key;
static pthread_once_t  key_once = PTHREAD_ONCE_INIT;

/* Destructor: runs in the exiting thread once, after start_routine returns
 * but before the thread is fully torn down. */
static void buf_dtor(void *p)
{
    printf(&quot;    [dtor] freeing per-thread buffer %p\\n&quot;, p);
    free(p);
}

static void make_key(void) { pthread_key_create(&amp;key, buf_dtor); }

static char *scratch(void)
{
    pthread_once(&amp;key_once, make_key);
    char *p = pthread_getspecific(key);
    if (!p) {
        p = malloc(64);
        pthread_setspecific(key, p);
        snprintf(p, 64, &quot;thread %lu's buffer&quot;, (unsigned long)pthread_self());
    }
    return p;
}

static void *worker(void *arg)
{
    long id = (long)arg;
    printf(&quot;[T%ld] my scratch -&gt; \\&quot;%s\\&quot;\\n&quot;, id, scratch());
    /* call again -- same buffer, no re-allocation */
    char *p = scratch();
    strcat(p, &quot; (touched)&quot;);
    printf(&quot;[T%ld] now    -&gt; \\&quot;%s\\&quot;\\n&quot;, id, p);
    return NULL;
}

int main(void)
{
    pthread_t t[3];
    for (long i = 0; i &lt; 3; ++i) pthread_create(&amp;t[i], NULL, worker, (void *)i);
    for (int i = 0; i &lt; 3; ++i) pthread_join(t[i], NULL);
    pthread_key_delete(key);
    return 0;
}

</code></pre>` },
  { name: `55. Pthreads / Cancellation / Cancellation`, path: `01_pthreads/09_cancellation/01_cancellation.c`, dir: `01_pthreads/09_cancellation`, body: `<h1 id="01_cancellationc">01_cancellation.c</h1>
<pre><code class="language-c">/*
 * 01_cancellation.c -- Cooperative thread cancellation.
 *
 *  pthread_cancel(t) sets a flag asking thread t to stop. Whether/when t
 *  actually stops depends on its CANCEL STATE and CANCEL TYPE:
 *
 *      CANCEL STATE
 *        ENABLE  (default) : cancellation requests honored
 *        DISABLE           : pending cancels stay pending until enabled
 *
 *      CANCEL TYPE (only matters when state=ENABLE)
 *        DEFERRED (default): cancel acts at the next &quot;cancellation point&quot;
 *                            (read, write, sleep, cond_wait, etc.)
 *        ASYNCHRONOUS      : cancel any time -- DANGEROUS, almost never use
 *
 *  Cleanup handlers:
 *      pthread_cleanup_push(fn, arg)   register
 *      pthread_cleanup_pop(0_or_1)     unregister; arg=1 means &quot;also run&quot;
 *
 *      They are unwound (LIFO) when the thread is canceled or calls
 *      pthread_exit. Use them to release locks, free buffers, close
 *      files in cancel-safe code.
 *
 *  Picture:
 *
 *      main                worker
 *      ----                -------
 *                          ...
 *                          (cancel state ENABLED, DEFERRED)
 *                          ...
 *      pthread_cancel ----&gt; (flag set, but worker still running)
 *                          ...
 *                          calls sleep()  &lt;-- cancellation point!
 *                          (cleanup handlers run, thread exits)
 *      pthread_join() &lt;----
 *
 *  Modern best practice: avoid cancellation. Use a shared atomic flag
 *  (&quot;please stop&quot;) and check it at safe places. It's portable, debuggable,
 *  and avoids the surprises of unwinding mid-syscall.
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;

static void cleanup(void *arg)
{
    printf(&quot;    [cleanup] releasing resource %p\\n&quot;, arg);
    free(arg);
}

static void *worker(void *arg)
{
    (void)arg;
    int *resource = malloc(sizeof(int));
    *resource = 0xDEADBEEF;

    pthread_cleanup_push(cleanup, resource);

    /* Loop with periodic cancellation points. */
    while (1) {
        printf(&quot;[worker] tick\\n&quot;);
        sleep(1);                          /* sleep IS a cancellation point */
    }

    pthread_cleanup_pop(1);                /* never reached on cancel */
    return NULL;
}

int main(void)
{
    pthread_t t;
    pthread_create(&amp;t, NULL, worker, NULL);

    sleep(3);
    printf(&quot;[main] requesting cancellation\\n&quot;);
    pthread_cancel(t);

    void *rv;
    pthread_join(t, &amp;rv);
    if (rv == PTHREAD_CANCELED)
        printf(&quot;[main] worker was canceled (cleanup ran)\\n&quot;);
    else
        printf(&quot;[main] worker exited normally\\n&quot;);
    return 0;
}

</code></pre>` },
  { name: `56. Pthreads / Cancellation / Atomic Flag Stop`, path: `01_pthreads/09_cancellation/02_atomic_flag_stop.c`, dir: `01_pthreads/09_cancellation`, body: `<h1 id="02_atomic_flag_stopc">02_atomic_flag_stop.c</h1>
<pre><code class="language-c">/*
 * 02_atomic_flag_stop.c -- Modern alternative to pthread_cancel:
 *                          a cooperative atomic stop flag.
 *
 *  Problem with pthread_cancel:
 *      - Unwinds in surprising places.
 *      - Requires cleanup handlers everywhere there's a lock.
 *      - Disabled by some libraries.
 *      - Hard to test deterministically.
 *
 *  Idiom (works in C and C++):
 *
 *      worker:                 supervisor:
 *      while (!stop)           stop = 1;
 *          do_chunk();
 *
 *  As long as \`stop\` is atomic and the worker checks it at known
 *  safe points, the worker shuts down cleanly with no surprise unwinding.
 *
 *  ASCII:
 *
 *      stop=0
 *       |   chunk1   chunk2   chunk3
 *       |   ======   ======   ======
 *       |                ^
 *       |                | supervisor sets stop=1
 *       |                v
 *       |   chunk1   chunk2  (peek-stop) -&gt; exit gracefully
 */

#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;unistd.h&gt;
#include &lt;stdatomic.h&gt;

static atomic_int stop = 0;

static void *worker(void *arg)
{
    (void)arg;
    int chunks = 0;
    while (!atomic_load_explicit(&amp;stop, memory_order_acquire)) {
        ++chunks;
        printf(&quot;[worker] chunk %d\\n&quot;, chunks);
        usleep(300 * 1000);
    }
    printf(&quot;[worker] saw stop, did %d chunks, exiting cleanly\\n&quot;, chunks);
    return NULL;
}

int main(void)
{
    pthread_t t;
    pthread_create(&amp;t, NULL, worker, NULL);
    sleep(2);
    printf(&quot;[main] asking worker to stop\\n&quot;);
    atomic_store_explicit(&amp;stop, 1, memory_order_release);
    pthread_join(t, NULL);
    return 0;
}

</code></pre>` },
