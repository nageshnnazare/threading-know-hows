<pre><code class="language-cpp">// 02_thread_args.cpp -- Passing arguments. Watch the COPY/REFERENCE trap.
//
//  std::thread copies/moves its arguments by VALUE into its own storage --
//  even if the function signature takes a reference!  Use std::ref / std::cref
//  to pass an actual reference.
//
//      void inc(int&amp; n)         { ++n; }
//      int x = 0;
//      std::thread t(inc, x);              // ERROR: x copied; ref to dead copy
//      std::thread t(inc, std::ref(x));    // OK
//
//  Picture (without std::ref):
//
//        main                         thread
//        ----                         ------
//        x = 0                        copy_of_x = 0
//                                     ++copy_of_x  (modifies COPY)
//                                     copy goes out of scope
//        x still == 0  &lt;-- BUG
//
//  With std::ref:
//
//        main                         thread
//        ----                         ------
//        x = 0  --- &amp;x ----&gt;          ref points to x
//                                     ++(*ref)
//        x == 1  &lt;-- OK

#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;functional&gt;     // std::ref
#include &lt;string&gt;

void by_value(int n)            { std::cout &lt;&lt; &quot;by_value n=&quot;    &lt;&lt; n &lt;&lt; &quot;\\n&quot;; }
void by_ref(int&amp; n)             { ++n; }
void many(const std::string&amp; s, int a, double b)
{
    std::cout &lt;&lt; &quot;many: s=\\&quot;&quot; &lt;&lt; s &lt;&lt; &quot;\\&quot; a=&quot; &lt;&lt; a &lt;&lt; &quot; b=&quot; &lt;&lt; b &lt;&lt; &quot;\\n&quot;;
}

int main()
{
    int x = 41;

    std::thread t1(by_value, x);            // copies x
    t1.join();

    std::thread t2(by_ref, std::ref(x));    // ref to x
    t2.join();
    std::cout &lt;&lt; &quot;after t2 x=&quot; &lt;&lt; x &lt;&lt; &quot;\\n&quot;;

    std::thread t3(many, &quot;hello&quot;, 7, 3.14); // multiple args, perfect-forwarded
    t3.join();

    // Lambda with capture (often clearer than std::ref):
    int y = 0;
    std::thread t4([&amp;y]{ y = 99; });
    t4.join();
    std::cout &lt;&lt; &quot;after t4 y=&quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;;
    return 0;
}

</code></pre>` },
  { name: `99. Examples / Cpp11 Threads / Basics / Join Detach`, path: `examples/02_cpp11_threads/01_basics/03_join_detach.cpp`, dir: `examples/02_cpp11_threads/01_basics`, words: 229, mins: 1, body: `<h1 id="03_join_detachcpp">03_join_detach.cpp</h1>
<pre><code class="language-cpp">// 03_join_detach.cpp -- Join vs detach in C++.
//
//  Three states a std::thread can be in:
//
//      JOINABLE     (just-created or running, not yet joined or detached)
//          ^                |             |
//          | join() returns |   detach()  | join()
//          |                v             v
//      NOT-JOINABLE      DETACHED      JOINED
//
//  RAII helpers:
//
//      Pre-C++20:   write your own scope_guard or use std::unique_ptr trick
//      C++20+   :   std::jthread joins automatically in its destructor.
//
//  This file shows:
//   1. A naive joinable thread (manual join).
//   2. A scope guard that joins on scope exit (exception safe).
//   3. A detached thread.

#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;
#include &lt;stdexcept&gt;

class joiner {              // simple scope guard
    std::thread t_;
public:
    explicit joiner(std::thread t) : t_(std::move(t)) {}
    ~joiner() { if (t_.joinable()) t_.join(); }
    joiner(const joiner&amp;) = delete;
    joiner&amp; operator=(const joiner&amp;) = delete;
};

void task(const char* name, int ms)
{
    std::this_thread::sleep_for(std::chrono::milliseconds(ms));
    std::cout &lt;&lt; &quot;    [&quot; &lt;&lt; name &lt;&lt; &quot;] done\\n&quot;;
}

int main()
{
    // 1. Plain join.
    {
        std::thread t(task, &quot;plain&quot;, 200);
        t.join();
    }

    // 2. Exception-safe via RAII (joins even if main throws).
    try {
        joiner g(std::thread(task, &quot;raii&quot;, 200));
        // ... if we threw here, g's destructor would still join.
        // throw std::runtime_error(&quot;oops&quot;);
    } catch (...) {}

    // 3. Detached -- fire and forget.
    std::thread d(task, &quot;detached&quot;, 100);
    d.detach();
    std::this_thread::sleep_for(std::chrono::milliseconds(300));
    std::cout &lt;&lt; &quot;[main] exiting\\n&quot;;
    return 0;
}

</code></pre>` },
  { name: `100. Examples / Cpp11 Threads / Basics / Thread Id`, path: `examples/02_cpp11_threads/01_basics/04_thread_id.cpp`, dir: `examples/02_cpp11_threads/01_basics`, words: 212, mins: 1, body: `<h1 id="04_thread_idcpp">04_thread_id.cpp</h1>
<pre><code class="language-cpp">// 04_thread_id.cpp -- std::this_thread, std::thread::id, hardware_concurrency
//
//  Useful introspection primitives:
//
//      std::this_thread::get_id()                -- ID of current thread
//      std::this_thread::sleep_for(duration)     -- portable sleep
//      std::this_thread::sleep_until(time_point) -- portable absolute sleep
//      std::this_thread::yield()                 -- &quot;I'm spinning, be nice&quot;
//      std::thread::hardware_concurrency()       -- cores hint (0 if unknown)
//
//      std::thread t(...);
//      t.get_id()           -- the spawned thread's id
//      t.native_handle()    -- pthread_t/HANDLE (for OS-specific tweaks)
//
//  IDs are comparable and hashable -- use them as map keys to track threads.

#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;
#include &lt;vector&gt;
#include &lt;unordered_map&gt;
#include &lt;mutex&gt;

int main()
{
    std::cout &lt;&lt; &quot;hardware_concurrency = &quot;
              &lt;&lt; std::thread::hardware_concurrency() &lt;&lt; &quot;\\n&quot;;
    std::cout &lt;&lt; &quot;main id = &quot; &lt;&lt; std::this_thread::get_id() &lt;&lt; &quot;\\n&quot;;

    std::mutex m;
    std::unordered_map&lt;std::thread::id, int&gt; seen_count;

    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; 4; ++i) {
        ts.emplace_back([&amp;, i]{
            for (int k = 0; k &lt; 3; ++k) {
                std::this_thread::sleep_for(std::chrono::milliseconds(50));
                std::lock_guard&lt;std::mutex&gt; g(m);
                seen_count[std::this_thread::get_id()]++;
                std::cout &lt;&lt; &quot;  worker &quot; &lt;&lt; i
                          &lt;&lt; &quot; (id &quot; &lt;&lt; std::this_thread::get_id() &lt;&lt; &quot;)&quot;
                          &lt;&lt; &quot; iter &quot; &lt;&lt; k &lt;&lt; &quot;\\n&quot;;
            }
        });
    }
    for (auto&amp; t : ts) t.join();

    std::cout &lt;&lt; &quot;Saw &quot; &lt;&lt; seen_count.size() &lt;&lt; &quot; distinct ids:\\n&quot;;
    for (auto&amp; [id, n] : seen_count)
        std::cout &lt;&lt; &quot;    &quot; &lt;&lt; id &lt;&lt; &quot; : &quot; &lt;&lt; n &lt;&lt; &quot;\\n&quot;;
    return 0;
}

</code></pre>` },
  { name: `101. Examples / Cpp11 Threads / Mutex / Basic Mutex`, path: `examples/02_cpp11_threads/02_mutex/01_basic_mutex.cpp`, dir: `examples/02_cpp11_threads/02_mutex`, words: 215, mins: 1, body: `<h1 id="01_basic_mutexcpp">01_basic_mutex.cpp</h1>
<pre><code class="language-cpp">// 01_basic_mutex.cpp -- std::mutex with manual lock/unlock (DON'T do this).
//
//  std::mutex offers .lock(), .try_lock(), .unlock() -- but using them
//  directly is error-prone (forget to unlock on exception -&gt; deadlock).
//
//  This file SHOWS the manual API for completeness, then directs you
//  to lock_guard/unique_lock for production code.
//
//  +--------- std::mutex life cycle -----------+
//  |   default-constructed (unlocked)          |
//  |       |                                   |
//  |       v                                   |
//  |   .lock() -- blocks until acquired        |
//  |       |                                   |
//  |       v                                   |
//  |   in critical section                     |
//  |       |                                   |
//  |       v                                   |
//  |   .unlock()                               |
//  +-------------------------------------------+

#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

static std::mutex g_lock;
static long       counter = 0;

static void worker_manual(int n)
{
    for (int i = 0; i &lt; n; ++i) {
        g_lock.lock();
        ++counter;            // CRITICAL: if we throw between lock() and unlock(),
        g_lock.unlock();      // the mutex stays locked forever.
    }
}

int main()
{
    constexpr int N = 8, ITERS = 100000;
    std::vector&lt;std::thread&gt; ts;
    ts.reserve(N);
    for (int i = 0; i &lt; N; ++i) ts.emplace_back(worker_manual, ITERS);
    for (auto&amp; t : ts) t.join();
    std::cout &lt;&lt; &quot;counter=&quot; &lt;&lt; counter &lt;&lt; &quot; (expected &quot; &lt;&lt; N*ITERS &lt;&lt; &quot;)\\n&quot;;
    std::cout &lt;&lt; &quot;(prefer lock_guard / scoped_lock; see next examples)\\n&quot;;
    return 0;
}

</code></pre>` },
  { name: `102. Examples / Cpp11 Threads / Mutex / Lock Guard`, path: `examples/02_cpp11_threads/02_mutex/02_lock_guard.cpp`, dir: `examples/02_cpp11_threads/02_mutex`, words: 237, mins: 1, body: `<h1 id="02_lock_guardcpp">02_lock_guard.cpp</h1>
<pre><code class="language-cpp">// 02_lock_guard.cpp -- The smallest, fastest RAII lock helper.
//
//  std::lock_guard&lt;Mutex&gt; locks the mutex in its constructor and unlocks
//  it in its destructor. That's it -- no .unlock(), no early release.
//  Perfect for single-mutex critical sections.
//
//      {
//          std::lock_guard&lt;std::mutex&gt; g(m);   // m.lock() now
//          // ... critical section ...
//      }                                       // m.unlock() here, even on throw
//
//  ASCII flow:
//
//                            ctor
//                           /    \\
//      enter scope -----&gt;  /      \\-----&gt; m.lock()
//      ...critical...
//      exit scope (incl. throw) ------&gt; m.unlock()  &lt;-- via dtor
//
//  Compared to manual lock/unlock:
//
//      Manual                   lock_guard
//      ------------             ----------
//      m.lock();                {
//      try {                       std::lock_guard g(m);
//        ...                       ...
//        m.unlock();             }   // automatic
//      } catch (...) {
//        m.unlock();
//        throw;
//      }
//
//  C++17 added template argument deduction so you can write:
//      std::lock_guard g(m);              // type deduced

#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

class Counter {
    mutable std::mutex m_;
    long              v_ = 0;
public:
    void inc()  { std::lock_guard&lt;std::mutex&gt; g(m_); ++v_; }
    long get() const {
        std::lock_guard&lt;std::mutex&gt; g(m_);
        return v_;
    }
};

int main()
{
    Counter c;
    constexpr int N = 8, ITERS = 100000;
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; N; ++i)
        ts.emplace_back([&amp;]{ for (int k=0;k&lt;ITERS;++k) c.inc(); });
    for (auto&amp; t : ts) t.join();
    std::cout &lt;&lt; &quot;value = &quot; &lt;&lt; c.get()
              &lt;&lt; &quot; (expected &quot; &lt;&lt; N*ITERS &lt;&lt; &quot;)\\n&quot;;
}

</code></pre>` },
  { name: `103. Examples / Cpp11 Threads / Mutex / Unique Lock`, path: `examples/02_cpp11_threads/02_mutex/03_unique_lock.cpp`, dir: `examples/02_cpp11_threads/02_mutex`, words: 249, mins: 1, body: `<h1 id="03_unique_lockcpp">03_unique_lock.cpp</h1>
<pre><code class="language-cpp">// 03_unique_lock.cpp -- The Swiss army knife of locks.
//
//  std::unique_lock is movable, can defer locking, can be released early,
//  can transfer ownership, and is the type required by condition variables
//  (cv.wait expects a unique_lock&lt;mutex&gt;).
//
//      Capability           lock_guard      unique_lock
//      ----------           ----------      ------------
//      RAII unlock          yes             yes
//      Move-only            no              YES (transfer ownership)
//      Defer lock           no              YES (std::defer_lock)
//      Try lock             no              YES (std::try_to_lock)
//      Adopt already-locked no              YES (std::adopt_lock)
//      Manual unlock        no              YES
//      Pass to cv.wait      no              YES
//      Cost                 minimal         tiny extra
//
//  Common idioms:
//
//      // 1. Defer-and-multi-lock to avoid deadlock:
//      std::unique_lock&lt;std::mutex&gt; a(m1, std::defer_lock);
//      std::unique_lock&lt;std::mutex&gt; b(m2, std::defer_lock);
//      std::lock(a, b);            // takes both atomically
//
//      // 2. Lock, do something, briefly release, re-lock:
//      std::unique_lock&lt;std::mutex&gt; g(m);
//      ...
//      g.unlock();
//      do_long_work_without_holding();
//      g.lock();
//      ...
//
//      // 3. Pass into condition_variable::wait:
//      std::unique_lock&lt;std::mutex&gt; g(m);
//      cv.wait(g, [&amp;]{ return ready; });

#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;

static std::mutex m1, m2;

static void atomic_dual()
{
    // Defer locking, then std::lock acquires BOTH atomically (deadlock-free).
    std::unique_lock&lt;std::mutex&gt; a(m1, std::defer_lock);
    std::unique_lock&lt;std::mutex&gt; b(m2, std::defer_lock);
    std::lock(a, b);
    std::cout &lt;&lt; &quot;[&quot; &lt;&lt; std::this_thread::get_id() &lt;&lt; &quot;] holds both\\n&quot;;
    std::this_thread::sleep_for(std::chrono::milliseconds(50));
}

static void release_then_relock()
{
    std::unique_lock&lt;std::mutex&gt; g(m1);
    std::cout &lt;&lt; &quot;phase 1 (locked)\\n&quot;;

    g.unlock();                                  // release temporarily
    std::cout &lt;&lt; &quot;phase 2 (no lock held; do long work)\\n&quot;;
    std::this_thread::sleep_for(std::chrono::milliseconds(100));

    g.lock();                                    // reacquire
    std::cout &lt;&lt; &quot;phase 3 (locked again)\\n&quot;;
}

int main()
{
    std::thread t1(atomic_dual), t2(atomic_dual);
    t1.join(); t2.join();

    release_then_relock();
}

</code></pre>` },
  { name: `104. Examples / Cpp11 Threads / Mutex / Scoped Lock`, path: `examples/02_cpp11_threads/02_mutex/04_scoped_lock.cpp`, dir: `examples/02_cpp11_threads/02_mutex`, words: 216, mins: 1, body: `<h1 id="04_scoped_lockcpp">04_scoped_lock.cpp</h1>
<pre><code class="language-cpp">// 04_scoped_lock.cpp -- C++17's std::scoped_lock: lock_guard for many mutexes.
//
//  Locks ALL its mutex args ATOMICALLY (no deadlock) using a deadlock-
//  avoidance algorithm under the hood (try-and-back-off, like std::lock).
//
//      std::scoped_lock g(m1, m2, m3);     // can never deadlock between these
//
//  Picture: two threads transferring money between accounts.
//
//      thread 1:                   thread 2:
//      transfer(A, B, 10)          transfer(B, A, 5)
//
//      with naive \`lock(A); lock(B);\`:
//          T1 holds A, wants B; T2 holds B, wants A -&gt; DEADLOCK
//
//      with std::scoped_lock(m1, m2):
//          both threads lock both, no fixed order needed,
//          deadlock impossible.
//
//  Differences:
//
//      lock_guard      one mutex
//      scoped_lock     0..N mutexes (C++17), prevents deadlock between them

#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

struct Account {
    int             balance;
    mutable std::mutex m;
};

static void transfer(Account&amp; from, Account&amp; to, int amount)
{
    std::scoped_lock g(from.m, to.m);            // atomic two-mutex lock
    from.balance -= amount;
    to.balance   += amount;
}

int main()
{
    Account A{100, {}}, B{100, {}};

    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; 1000; ++i) {
        ts.emplace_back([&amp;]{ transfer(A, B, 1); });
        ts.emplace_back([&amp;]{ transfer(B, A, 1); });
    }
    for (auto&amp; t : ts) t.join();

    std::cout &lt;&lt; &quot;A=&quot; &lt;&lt; A.balance &lt;&lt; &quot;  B=&quot; &lt;&lt; B.balance
              &lt;&lt; &quot;  total=&quot; &lt;&lt; (A.balance + B.balance) &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `105. Examples / Cpp11 Threads / Mutex / Recursive Mutex`, path: `examples/02_cpp11_threads/02_mutex/05_recursive_mutex.cpp`, dir: `examples/02_cpp11_threads/02_mutex`, words: 193, mins: 1, body: `<h1 id="05_recursive_mutexcpp">05_recursive_mutex.cpp</h1>
<pre><code class="language-cpp">// 05_recursive_mutex.cpp -- std::recursive_mutex.
//
//  Like std::mutex, except the SAME thread can lock it multiple times.
//  An internal counter tracks the depth; you must unlock as many times
//  as you locked.
//
//      thread A: m.lock();   // count 1
//      thread A: m.lock();   // count 2  (no block!)
//      thread A: m.unlock(); // count 1
//      thread A: m.unlock(); // count 0 (released)
//
//  Useful for re-entrant code where one method calls another that also
//  locks the same mutex. But: many designers consider this a code smell --
//  redesign so that public methods lock and call private helpers that
//  assume the lock is held.

#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;

class Tree {
    std::recursive_mutex m_;
    int                  count_ = 0;

    void recurse(int depth) {
        std::lock_guard&lt;std::recursive_mutex&gt; g(m_);
        ++count_;
        if (depth &gt; 0) recurse(depth - 1);
    }
public:
    void run(int depth) { recurse(depth); }
    int  count() const  {
        // const_cast because the mutex is logically mutable;
        // in real code make m_ \`mutable\` instead.
        return count_;
    }
};

int main()
{
    Tree t;
    std::thread th([&amp;]{ t.run(5); });
    th.join();
    std::cout &lt;&lt; &quot;count = &quot; &lt;&lt; t.count() &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `106. Examples / Cpp11 Threads / Mutex / Timed Mutex`, path: `examples/02_cpp11_threads/02_mutex/06_timed_mutex.cpp`, dir: `examples/02_cpp11_threads/02_mutex`, words: 162, mins: 1, body: `<h1 id="06_timed_mutexcpp">06_timed_mutex.cpp</h1>
<pre><code class="language-cpp">// 06_timed_mutex.cpp -- timed_mutex / recursive_timed_mutex.
//
//  Adds two methods over a regular mutex:
//
//      try_lock_for(duration)        wait at most this long
//      try_lock_until(time_point)    wait until this absolute time
//
//  Returns true on success, false on timeout. Combine with std::unique_lock
//  for RAII semantics.
//
//  ASCII:
//
//      time ---&gt;
//      holder:   |================================|     (5s)
//      waiter:   (try_lock_for 1s)
//                  ===timeout (false)
//                                  (try_lock_for 1s)
//                                    ===timeout
//                                                (try_lock_for 5s)
//                                                  ===acquired

#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;

using namespace std::chrono_literals;

static std::timed_mutex m;

void holder()
{
    std::lock_guard&lt;std::timed_mutex&gt; g(m);
    std::this_thread::sleep_for(2s);
}

void waiter()
{
    std::this_thread::sleep_for(50ms);    // let holder grab first
    if (m.try_lock_for(500ms)) {
        std::cout &lt;&lt; &quot;[waiter] got it within 500ms\\n&quot;;
        m.unlock();
    } else {
        std::cout &lt;&lt; &quot;[waiter] timed out after 500ms (holder still busy)\\n&quot;;
    }

    if (m.try_lock_for(3s)) {
        std::cout &lt;&lt; &quot;[waiter] got it within 3s\\n&quot;;
        m.unlock();
    } else {
        std::cout &lt;&lt; &quot;[waiter] timed out after 3s\\n&quot;;
    }
}

int main()
{
    std::thread h(holder), w(waiter);
    h.join(); w.join();
}

</code></pre>` },
  { name: `107. Examples / Cpp11 Threads / Mutex / Shared Mutex`, path: `examples/02_cpp11_threads/02_mutex/07_shared_mutex.cpp`, dir: `examples/02_cpp11_threads/02_mutex`, words: 257, mins: 1, body: `<h1 id="07_shared_mutexcpp">07_shared_mutex.cpp</h1>
<pre><code class="language-cpp">// 07_shared_mutex.cpp -- C++17 std::shared_mutex (read/write lock).
//
//  Two locking modes:
//
//      EXCLUSIVE (writer)  -&gt; std::unique_lock&lt;std::shared_mutex&gt; g(m);
//      SHARED    (reader)  -&gt; std::shared_lock&lt;std::shared_mutex&gt; g(m);
//
//  Many readers OR one writer (never both).
//
//      m state            unique_lock        shared_lock
//      -------            ------------       ------------
//      free               immediately        immediately
//      shared (n)         block              acquire (n+1 readers)
//      exclusive          block              block
//
//  Use this for read-heavy data structures (caches, configs, tables).
//
//  Trade-offs:
//      + Reads scale to many cores.
//      - Higher overhead than plain mutex per acquire.
//      - Risk of writer starvation if reads are constant.
//
//  C++14 also has std::shared_timed_mutex (with try_lock_for variants).

#include &lt;iostream&gt;
#include &lt;shared_mutex&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;
#include &lt;vector&gt;
#include &lt;map&gt;
#include &lt;string&gt;

using namespace std::chrono_literals;

class Config {
    mutable std::shared_mutex      m_;
    std::map&lt;std::string, std::string&gt; kv_;
public:
    void set(std::string k, std::string v) {
        std::unique_lock g(m_);
        kv_[std::move(k)] = std::move(v);
    }
    std::string get(const std::string&amp; k) const {
        std::shared_lock g(m_);            // cheap: parallel reads
        auto it = kv_.find(k);
        return it != kv_.end() ? it-&gt;second : &quot;&quot;;
    }
};

int main()
{
    Config c;
    c.set(&quot;greeting&quot;, &quot;hi&quot;);

    std::vector&lt;std::thread&gt; ts;
    // 6 readers
    for (int i = 0; i &lt; 6; ++i)
        ts.emplace_back([&amp;, i]{
            for (int k = 0; k &lt; 5; ++k) {
                std::cout &lt;&lt; &quot;    reader &quot; &lt;&lt; i &lt;&lt; &quot;: &quot; &lt;&lt; c.get(&quot;greeting&quot;) &lt;&lt; &quot;\\n&quot;;
                std::this_thread::sleep_for(20ms);
            }
        });
    // 1 writer
    ts.emplace_back([&amp;]{
        for (int k = 0; k &lt; 3; ++k) {
            std::this_thread::sleep_for(50ms);
            c.set(&quot;greeting&quot;, &quot;hi #&quot; + std::to_string(k));
            std::cout &lt;&lt; &quot;[writer] updated\\n&quot;;
        }
    });

    for (auto&amp; t : ts) t.join();
}

</code></pre>` },
  { name: `108. Examples / Cpp11 Threads / Condition Variables / Basic Cv`, path: `examples/02_cpp11_threads/03_condition_variables/01_basic_cv.cpp`, dir: `examples/02_cpp11_threads/03_condition_variables`, words: 243, mins: 1, body: `<h1 id="01_basic_cvcpp">01_basic_cv.cpp</h1>
<pre><code class="language-cpp">// 01_basic_cv.cpp -- std::condition_variable basics.
//
//  Same idea as pthread cond vars (mutex + predicate + wait/notify), but
//  modern C++ adds a HUGE convenience: cv.wait(lock, predicate) wraps the
//  while-loop for you and is robust to spurious wakeups.
//
//      // OLD WAY (still legal)
//      while (!ready) cv.wait(lock);
//
//      // PREFERRED: predicate form
//      cv.wait(lock, []{ return ready; });
//
//  Important rules (same as pthread):
//      - Mutex MUST be locked before wait().
//      - wait() atomically releases mutex while sleeping; reacquires on wake.
//      - notify_one / notify_all should be called after the state change
//        (best practice: also while holding the mutex, then unlock).
//
//  ASCII timeline:
//
//      consumer                    producer
//      --------                    --------
//      lock(m)
//      cv.wait(m, pred) ----+
//          (sleeps)         |
//                           |          lock(m)
//                           |          ready=true
//                           |          cv.notify_one()
//                           |          unlock(m)
//          &lt;-- wakes -------+
//          (re-locks m)
//      use shared state
//      unlock(m)

#include &lt;iostream&gt;
#include &lt;condition_variable&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;

using namespace std::chrono_literals;

std::mutex              m;
std::condition_variable cv;
bool                    ready = false;
int                     payload = 0;

void consumer()
{
    std::unique_lock&lt;std::mutex&gt; g(m);
    cv.wait(g, []{ return ready; });           // robust to spurious wakeups
    std::cout &lt;&lt; &quot;[consumer] got &quot; &lt;&lt; payload &lt;&lt; &quot;\\n&quot;;
}

void producer()
{
    std::this_thread::sleep_for(500ms);
    {
        std::lock_guard&lt;std::mutex&gt; g(m);
        payload = 42;
        ready   = true;
    }
    cv.notify_one();                           // can be done outside the lock
    std::cout &lt;&lt; &quot;[producer] notified\\n&quot;;
}

int main()
{
    std::thread c(consumer), p(producer);
    c.join(); p.join();
}

</code></pre>` },
  { name: `109. Examples / Cpp11 Threads / Condition Variables / Producer Consumer`, path: `examples/02_cpp11_threads/03_condition_variables/02_producer_consumer.cpp`, dir: `examples/02_cpp11_threads/03_condition_variables`, words: 289, mins: 1, body: `<h1 id="02_producer_consumercpp">02_producer_consumer.cpp</h1>
<pre><code class="language-cpp">// 02_producer_consumer.cpp -- Bounded thread-safe queue.
//
//  Compared with the C version, this is far cleaner:
//      - templated on element type
//      - RAII locks
//      - lambda predicates
//      - &quot;shutdown&quot; signaling via a sentinel bool
//
//  Picture (capacity 4):
//
//      head                       tail
//       |                          |
//       v                          v
//      [a][b][c][d]                       &lt;-- count = 4 (FULL)
//
//      after pop:
//          [b][c][d]_                     &lt;-- count = 3
//
//      Two predicates:
//          push waits while count == cap
//          pop  waits while count == 0 (and !done)

#include &lt;condition_variable&gt;
#include &lt;mutex&gt;
#include &lt;thread&gt;
#include &lt;queue&gt;
#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;chrono&gt;
#include &lt;optional&gt;

using namespace std::chrono_literals;

template &lt;class T&gt;
class BoundedQueue {
    std::mutex                   m_;
    std::condition_variable      not_full_, not_empty_;
    std::queue&lt;T&gt;                q_;
    size_t                       cap_;
    bool                         done_ = false;
public:
    explicit BoundedQueue(size_t cap) : cap_(cap) {}

    void push(T v) {
        std::unique_lock g(m_);
        not_full_.wait(g, [&amp;]{ return q_.size() &lt; cap_ || done_; });
        if (done_) return;
        q_.push(std::move(v));
        g.unlock();
        not_empty_.notify_one();
    }

    std::optional&lt;T&gt; pop() {
        std::unique_lock g(m_);
        not_empty_.wait(g, [&amp;]{ return !q_.empty() || done_; });
        if (q_.empty()) return std::nullopt;        // closed and drained
        T v = std::move(q_.front());
        q_.pop();
        g.unlock();
        not_full_.notify_one();
        return v;
    }

    void close() {
        {
            std::lock_guard g(m_);
            done_ = true;
        }
        not_empty_.notify_all();
        not_full_.notify_all();
    }
};

int main()
{
    BoundedQueue&lt;int&gt; q(4);

    std::thread producer([&amp;]{
        for (int i = 0; i &lt; 20; ++i) {
            q.push(i);
            std::cout &lt;&lt; &quot;[P] pushed &quot; &lt;&lt; i &lt;&lt; &quot;\\n&quot;;
            std::this_thread::sleep_for(30ms);
        }
        q.close();
    });

    std::vector&lt;std::thread&gt; consumers;
    for (int c = 0; c &lt; 3; ++c) {
        consumers.emplace_back([&amp;, c]{
            while (auto v = q.pop()) {
                std::cout &lt;&lt; &quot;    [C&quot; &lt;&lt; c &lt;&lt; &quot;] got &quot; &lt;&lt; *v &lt;&lt; &quot;\\n&quot;;
                std::this_thread::sleep_for(80ms);
            }
            std::cout &lt;&lt; &quot;    [C&quot; &lt;&lt; c &lt;&lt; &quot;] done\\n&quot;;
        });
    }

    producer.join();
    for (auto&amp; t : consumers) t.join();
}

</code></pre>` },
  { name: `110. Examples / Cpp11 Threads / Condition Variables / Cv Any`, path: `examples/02_cpp11_threads/03_condition_variables/03_cv_any.cpp`, dir: `examples/02_cpp11_threads/03_condition_variables`, words: 127, mins: 1, body: `<h1 id="03_cv_anycpp">03_cv_any.cpp</h1>
<pre><code class="language-cpp">// 03_cv_any.cpp -- std::condition_variable_any.
//
//  std::condition_variable can ONLY use std::unique_lock&lt;std::mutex&gt;.
//  std::condition_variable_any can use ANY Lockable type (e.g.,
//  std::shared_lock&lt;std::shared_mutex&gt;, your own custom RAII lock).
//
//      Use case: you have a shared_mutex protecting the data and want
//      writers to wait under exclusive lock, readers under shared.
//
//  Trade-off:
//      cv          -- faster, but only std::mutex
//      cv_any      -- slightly slower, but works with any lock

#include &lt;condition_variable&gt;
#include &lt;mutex&gt;
#include &lt;shared_mutex&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;
#include &lt;iostream&gt;

using namespace std::chrono_literals;

std::shared_mutex             rw;
std::condition_variable_any   cv;
bool                          go = false;

int main()
{
    std::thread waiter([&amp;]{
        std::shared_lock g(rw);                 // shared lock!
        cv.wait(g, []{ return go; });
        std::cout &lt;&lt; &quot;[waiter] proceed (under shared lock)\\n&quot;;
    });

    std::this_thread::sleep_for(200ms);
    {
        std::unique_lock g(rw);
        go = true;
    }
    cv.notify_one();
    waiter.join();
}

</code></pre>` },
  { name: `111. Examples / Cpp11 Threads / Atomics / Atomic Basic`, path: `examples/02_cpp11_threads/04_atomics/01_atomic_basic.cpp`, dir: `examples/02_cpp11_threads/04_atomics`, words: 235, mins: 1, body: `<h1 id="01_atomic_basiccpp">01_atomic_basic.cpp</h1>
<pre><code class="language-cpp">// 01_atomic_basic.cpp -- std::atomic&lt;T&gt;: concurrency without locks.
//
//  std::atomic&lt;T&gt; guarantees:
//      - INDIVISIBILITY: read or write of the atomic is &quot;all-or-nothing&quot;
//      - VISIBILITY:     stores become visible to other threads (under
//                        the requested memory order, see next examples)
//
//  Common atomic types:
//      std::atomic&lt;int&gt;, std::atomic&lt;bool&gt;, std::atomic&lt;size_t&gt;,
//      std::atomic&lt;T*&gt;, std::atomic_flag, std::atomic&lt;uint64_t&gt;, ...
//      For arbitrary T, std::atomic&lt;T&gt; works if T is trivially copyable
//      AND &lt;= a hardware-supported size (often 8 bytes); otherwise the
//      implementation falls back to a hidden lock (\`is_lock_free()\` -&gt; false).
//
//  Operations (common):
//      a.load([order])                     read
//      a.store(v, [order])                 write
//      a.exchange(v, [order])              swap
//      a.compare_exchange_weak(expected, desired, [order])
//      a.compare_exchange_strong(...)
//      a.fetch_add/sub/and/or/xor          atomic RMW (numeric/integer)
//      ++a / a++                           shorthand for fetch_add
//
//  COUNTER EXAMPLE:
//
//      Without atomic:    ++counter -&gt; race -&gt; wrong total
//      With atomic:       ++counter -&gt; CPU emits LOCK XADD (x86) -&gt; safe

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

std::atomic&lt;long&gt; g_counter{0};

void worker(int n)
{
    for (int i = 0; i &lt; n; ++i)
        ++g_counter;            // atomic increment, no mutex needed
}

int main()
{
    std::cout &lt;&lt; &quot;is_lock_free&lt;long&gt; = &quot;
              &lt;&lt; std::atomic&lt;long&gt;::is_always_lock_free &lt;&lt; &quot;\\n&quot;;

    constexpr int N = 8, ITERS = 200000;
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; N; ++i) ts.emplace_back(worker, ITERS);
    for (auto&amp; t : ts) t.join();

    std::cout &lt;&lt; &quot;counter = &quot; &lt;&lt; g_counter.load()
              &lt;&lt; &quot; (expected &quot; &lt;&lt; long(N) * ITERS &lt;&lt; &quot;)\\n&quot;;
}

</code></pre>` },
  { name: `112. Examples / Cpp11 Threads / Atomics / Atomic Flag`, path: `examples/02_cpp11_threads/04_atomics/02_atomic_flag.cpp`, dir: `examples/02_cpp11_threads/04_atomics`, words: 233, mins: 1, body: `<h1 id="02_atomic_flagcpp">02_atomic_flag.cpp</h1>
<pre><code class="language-cpp">// 02_atomic_flag.cpp -- The lowest-level atomic primitive.
//
//  std::atomic_flag is THE only atomic type guaranteed to be lock-free
//  on every conforming platform. It exposes only:
//
//      test_and_set()  -- set to true, return previous value
//      clear()         -- set to false
//      test()          -- (C++20) read without modify
//
//  Classic spinlock implemented with it:
//
//      class Spinlock {
//          std::atomic_flag f = ATOMIC_FLAG_INIT;
//      public:
//          void lock()   { while (f.test_and_set(std::memory_order_acquire)) {} }
//          void unlock() { f.clear(std::memory_order_release); }
//      };
//
//  Diagram of test_and_set semantics:
//
//      thread A                 thread B
//      --------                 --------
//      t&amp;s -&gt; false             t&amp;s -&gt; true (B is already in)
//      (A wins, enters CS)      (B spins)
//      ...                      ...
//      f.clear()                t&amp;s -&gt; false  (B finally enters)

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

class Spinlock {
    std::atomic_flag f_ = ATOMIC_FLAG_INIT;
public:
    void lock() {
        while (f_.test_and_set(std::memory_order_acquire))
            ;       // could yield/pause here in production
    }
    void unlock() { f_.clear(std::memory_order_release); }
};

Spinlock s;
long     n = 0;

int main()
{
    constexpr int N = 8, ITERS = 100000;
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; N; ++i) {
        ts.emplace_back([]{
            for (int k = 0; k &lt; ITERS; ++k) {
                s.lock();
                ++n;
                s.unlock();
            }
        });
    }
    for (auto&amp; t : ts) t.join();
    std::cout &lt;&lt; &quot;n = &quot; &lt;&lt; n &lt;&lt; &quot; (expected &quot; &lt;&lt; N*ITERS &lt;&lt; &quot;)\\n&quot;;
}

</code></pre>` },
  { name: `113. Examples / Cpp11 Threads / Atomics / Memory Orders`, path: `examples/02_cpp11_threads/04_atomics/03_memory_orders.cpp`, dir: `examples/02_cpp11_threads/04_atomics`, words: 332, mins: 2, body: `<h1 id="03_memory_orderscpp">03_memory_orders.cpp</h1>
<pre><code class="language-cpp">// 03_memory_orders.cpp -- The MEMORY MODEL.
//
//  Modern CPUs and compilers reorder loads/stores. Memory orders tell the
//  HARDWARE/COMPILER which reorderings are forbidden so concurrent code
//  can rely on certain happens-before relationships.
//
//  Six memory_order values (C++11):
//
//      memory_order_relaxed       -- no ordering, only atomicity
//      memory_order_consume       -- (deprecated; treat as acquire)
//      memory_order_acquire       -- pair this with release; reads after
//                                    me see the writes the releaser made
//      memory_order_release       -- pair this with acquire; writes I made
//                                    are visible to the next acquirer
//      memory_order_acq_rel       -- both acquire AND release (RMW ops)
//      memory_order_seq_cst       -- (default) total order across ALL threads,
//                                    &quot;everyone agrees on a single timeline&quot;
//
//  Strength chart (expensive at top, free at bottom on x86):
//
//        seq_cst     &lt;-- DEFAULT, simplest, slowest in some cases
//          |
//        acq_rel
//        /    \\
//      acq    rel
//        \\    /
//        relaxed     &lt;-- fastest, almost no guarantees
//
//  THE ACQUIRE-RELEASE PATTERN (the workhorse):
//
//      shared data ----+---- store with RELEASE  ---&gt;  happens-before
//                                                       chain
//                                                        |
//      consume (load with ACQUIRE) &lt;-- on another thread,  v
//      now sees the data the releaser wrote
//
//  Picture:
//
//      Thread A                       Thread B
//      --------                       --------
//      data = compute();
//      flag.store(1, RELEASE)  ----.
//                                   \`--&gt; flag.load(ACQUIRE) == 1
//                                        use(data);   &lt;-- guaranteed visible
//
//  Without proper ordering, B might see flag==1 BEFORE seeing data --
//  classic bug. We demonstrate this distinction below.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;cassert&gt;

int                 data;
std::atomic&lt;bool&gt;   flag{false};

void producer()
{
    data = 42;                                        // (1) plain write
    flag.store(true, std::memory_order_release);      // (2) release
    // Reads/writes BEFORE (2) cannot be reordered to AFTER it.
}

void consumer()
{
    while (!flag.load(std::memory_order_acquire))     // (3) acquire
        ;
    // Reads/writes AFTER (3) cannot be reordered to BEFORE it.
    // Therefore (1) is visible here.
    assert(data == 42);
    std::cout &lt;&lt; &quot;consumer saw data=&quot; &lt;&lt; data &lt;&lt; &quot;\\n&quot;;
}

int main()
{
    std::thread c(consumer), p(producer);
    p.join(); c.join();
}

</code></pre>` },
  { name: `114. Examples / Cpp11 Threads / Atomics / Compare Exchange`, path: `examples/02_cpp11_threads/04_atomics/04_compare_exchange.cpp`, dir: `examples/02_cpp11_threads/04_atomics`, words: 333, mins: 2, body: `<h1 id="04_compare_exchangecpp">04_compare_exchange.cpp</h1>
<pre><code class="language-cpp">// 04_compare_exchange.cpp -- CAS: the heart of lock-free programming.
//
//  Compare-And-Swap (CAS) atomically does:
//
//      if (atomic == expected) { atomic = desired; return true;  }
//      else                    { expected = atomic; return false; }
//
//  Two variants:
//
//      compare_exchange_weak    -- may fail spuriously even when equal
//                                  (useful inside a retry loop)
//      compare_exchange_strong  -- only fails when actually unequal
//                                  (useful when you don't loop)
//
//  Cost model: the WEAK form maps to a single CPU instruction on most
//  architectures (e.g. ARM's LL/SC); the STRONG form may emit an internal
//  loop on those architectures.
//
//  Canonical &quot;atomically transform a value&quot; pattern:
//
//      auto old = atomic.load();
//      while (!atomic.compare_exchange_weak(old, transform(old))) ;
//
//  ASCII (CAS retry under contention):
//
//      atomic = X
//      thread A: old=X, attempt X -&gt; X+1   .. CAS succeeds
//      thread B: old=X, attempt X -&gt; X+1   .. CAS fails (now atomic=X+1)
//                old=X+1, attempt X+1 -&gt; X+2   .. retry succeeds

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

std::atomic&lt;long&gt; n{0};

// fetch_add equivalent built from CAS:
long my_add(std::atomic&lt;long&gt;&amp; a, long delta)
{
    long old = a.load(std::memory_order_relaxed);
    while (!a.compare_exchange_weak(old, old + delta,
                                    std::memory_order_acq_rel,
                                    std::memory_order_relaxed))
        ;   // loop body intentionally empty: CAS reloads \`old\` for us
    return old;
}

// &quot;Atomic max&quot; -- not provided by std::atomic (yet).
void atomic_max(std::atomic&lt;long&gt;&amp; a, long candidate)
{
    long current = a.load(std::memory_order_relaxed);
    while (candidate &gt; current &amp;&amp;
           !a.compare_exchange_weak(current, candidate,
                                    std::memory_order_acq_rel,
                                    std::memory_order_relaxed))
        ;
}

int main()
{
    std::vector&lt;std::thread&gt; ts;
    for (int t = 0; t &lt; 8; ++t)
        ts.emplace_back([]{ for (int i = 0; i &lt; 100000; ++i) my_add(n, 1); });
    for (auto&amp; t : ts) t.join();
    std::cout &lt;&lt; &quot;n=&quot; &lt;&lt; n.load() &lt;&lt; &quot; (expected 800000)\\n&quot;;

    std::atomic&lt;long&gt; hi{0};
    ts.clear();
    for (int t = 0; t &lt; 8; ++t)
        ts.emplace_back([t, &amp;hi]{
            for (long i = 0; i &lt; 1000; ++i)
                atomic_max(hi, t * 1000 + i);
        });
    for (auto&amp; t : ts) t.join();
    std::cout &lt;&lt; &quot;hi=&quot; &lt;&lt; hi.load() &lt;&lt; &quot; (expected 7999)\\n&quot;;
}

</code></pre>` },
  { name: `115. Examples / Cpp11 Threads / Atomics / Lockfree Stack`, path: `examples/02_cpp11_threads/04_atomics/05_lockfree_stack.cpp`, dir: `examples/02_cpp11_threads/04_atomics`, words: 315, mins: 2, body: `<h1 id="05_lockfree_stackcpp">05_lockfree_stack.cpp</h1>
<pre><code class="language-cpp">// 05_lockfree_stack.cpp -- Treiber stack: the &quot;hello world&quot; of lock-free DS.
//
//  Idea: each push/pop is one CAS on the head pointer.
//
//      head ---&gt; [a] ---&gt; [b] ---&gt; [c] ---&gt; nullptr
//
//  push(x):
//      new_node-&gt;next = head.load();
//      while (!head.CAS(new_node-&gt;next, new_node)) /* retry */;
//
//  pop():
//      old_head = head.load();
//      while (old_head &amp;&amp; !head.CAS(old_head, old_head-&gt;next)) ;
//      if (old_head) value = old_head-&gt;data;
//
//  Diagram of a successful push under contention:
//
//      time --&gt;
//      thread A: load h=[a]    CAS(h,[X]-&gt;a) succeeds
//                                           ^ head now [X]-&gt;a
//      thread B: load h=[a]    CAS fails    load h=[X]-&gt;a   CAS([X]-&gt;a,[Y]-&gt;X) ok
//
//  ATTENTION: This stack is NOT safe for \`pop()\` due to the ABA problem
//  (see 04_pitfalls/06_aba_problem.cpp). It's also unsafe for memory
//  reclamation -- when do we free a popped node? Production lock-free
//  containers use hazard pointers, RCU, or epoch-based reclamation.
//  Here we LEAK popped nodes for clarity. For real use, see folly,
//  TBB, or libcds.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;
#include &lt;optional&gt;

template &lt;class T&gt;
class LockFreeStack {
    struct Node { T value; Node* next; };
    std::atomic&lt;Node*&gt; head_{nullptr};
public:
    void push(T v) {
        Node* n = new Node{std::move(v), head_.load(std::memory_order_relaxed)};
        while (!head_.compare_exchange_weak(
                   n-&gt;next, n,
                   std::memory_order_release,
                   std::memory_order_relaxed))
            ;
    }
    std::optional&lt;T&gt; pop() {
        Node* old = head_.load(std::memory_order_acquire);
        while (old &amp;&amp;
               !head_.compare_exchange_weak(
                   old, old-&gt;next,
                   std::memory_order_acquire,
                   std::memory_order_relaxed))
            ;
        if (!old) return std::nullopt;
        T v = std::move(old-&gt;value);
        // We deliberately LEAK old to avoid the ABA / use-after-free problem.
        // A real implementation would use hazard pointers or epoch-based
        // reclamation.
        return v;
    }
};

int main()
{
    LockFreeStack&lt;int&gt; s;

    std::vector&lt;std::thread&gt; ts;
    for (int p = 0; p &lt; 4; ++p)
        ts.emplace_back([&amp;,p]{ for (int i = 0; i &lt; 1000; ++i) s.push(p*1000+i); });
    for (auto&amp; t : ts) t.join();

    int popped = 0;
    while (s.pop()) ++popped;
    std::cout &lt;&lt; &quot;popped &quot; &lt;&lt; popped &lt;&lt; &quot; (expected 4000)\\n&quot;;
}

</code></pre>` },
  { name: `116. Examples / Cpp11 Threads / Atomics / Atomic Pointer`, path: `examples/02_cpp11_threads/04_atomics/06_atomic_pointer.cpp`, dir: `examples/02_cpp11_threads/04_atomics`, words: 239, mins: 1, body: `<h1 id="06_atomic_pointercpp">06_atomic_pointer.cpp</h1>
<pre><code class="language-cpp">// 06_atomic_pointer.cpp -- atomic&lt;T*&gt; for &quot;publish a snapshot&quot; pattern.
//
//  Common scenario: you have read-mostly data updated occasionally. Instead
//  of locking on every read, build a NEW snapshot and atomically swap the
//  pointer. Readers see either the old or the new -- never a torn state.
//
//      readers       atomic&lt;Snapshot*&gt; ptr      writer
//      -------                                  ------
//      load(acquire) ----.                       build New
//                         \\                       store(release, New)
//                          v
//                    [old snap, immutable]
//                    [new snap, immutable]
//
//  Memory reclamation again: when is it safe to free the old snapshot?
//  Patterns: RCU, hazard pointers, shared_ptr&lt;Atomic&gt; (C++20), or simply
//  &quot;wait until no readers can possibly hold a pointer to the old snap&quot;.
//  Below we LEAK on every update to keep the example simple.

#include &lt;atomic&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;
#include &lt;vector&gt;

using namespace std::chrono_literals;

struct Config {
    int max_connections;
    int timeout_ms;
};

std::atomic&lt;Config*&gt; g_cfg;

int main()
{
    g_cfg.store(new Config{100, 5000}, std::memory_order_release);

    std::atomic&lt;bool&gt; stop{false};

    std::vector&lt;std::thread&gt; readers;
    for (int i = 0; i &lt; 4; ++i)
        readers.emplace_back([&amp;]{
            while (!stop.load(std::memory_order_relaxed)) {
                Config* c = g_cfg.load(std::memory_order_acquire);
                std::cout &lt;&lt; &quot;  reader sees max=&quot; &lt;&lt; c-&gt;max_connections
                          &lt;&lt; &quot; timeout=&quot; &lt;&lt; c-&gt;timeout_ms &lt;&lt; &quot;\\n&quot;;
                std::this_thread::sleep_for(50ms);
            }
        });

    std::thread writer([&amp;]{
        for (int i = 0; i &lt; 5; ++i) {
            std::this_thread::sleep_for(120ms);
            Config* fresh = new Config{100 + i*10, 5000 - i*100};
            g_cfg.store(fresh, std::memory_order_release);
            // OLD pointer is leaked here.
        }
    });

    writer.join();
    stop.store(true, std::memory_order_relaxed);
    for (auto&amp; t : readers) t.join();
}

</code></pre>` },
  { name: `117. Examples / Cpp11 Threads / Futures / Async`, path: `examples/02_cpp11_threads/05_futures/01_async.cpp`, dir: `examples/02_cpp11_threads/05_futures`, words: 244, mins: 1, body: `<h1 id="01_asynccpp">01_async.cpp</h1>
<pre><code class="language-cpp">// 01_async.cpp -- std::async: easy &quot;run-this-elsewhere-and-give-me-result&quot;.
//
//      auto fut = std::async(launch_policy, callable, args...);
//      ... do other work ...
//      auto result = fut.get();    // blocks until ready, throws if work threw
//
//  Launch policies:
//
//      std::launch::async      -- run on a NEW thread (true parallelism)
//      std::launch::deferred   -- DON'T run yet; run on .get() in caller
//      default (both)          -- impl-defined; may not actually run async!
//
//  ALWAYS pass std::launch::async explicitly if you want a separate thread.
//
//  Picture:
//
//      main                              worker (auto thread)
//      ----                              -------
//      auto f = async(slow_fn, x); ----&gt; compute slow_fn(x)
//      do_other_work();
//      auto r = f.get();         &lt;----  return value to f
//
//  Future also propagates EXCEPTIONS: if the callable throws, .get() throws.

#include &lt;future&gt;
#include &lt;iostream&gt;
#include &lt;chrono&gt;
#include &lt;stdexcept&gt;

int slow(int x)
{
    std::this_thread::sleep_for(std::chrono::milliseconds(300));
    if (x &lt; 0) throw std::invalid_argument(&quot;negative not allowed&quot;);
    return x * x;
}

int main()
{
    // Run async, do other work, then collect.
    auto fut = std::async(std::launch::async, slow, 7);
    std::cout &lt;&lt; &quot;[main] doing other work...\\n&quot;;
    std::this_thread::sleep_for(std::chrono::milliseconds(100));
    std::cout &lt;&lt; &quot;[main] result = &quot; &lt;&lt; fut.get() &lt;&lt; &quot;\\n&quot;;

    // Exception propagation:
    try {
        auto bad = std::async(std::launch::async, slow, -1);
        bad.get();
    } catch (const std::exception&amp; e) {
        std::cout &lt;&lt; &quot;[main] caught: &quot; &lt;&lt; e.what() &lt;&lt; &quot;\\n&quot;;
    }

    // Polling with future::wait_for:
    auto f2 = std::async(std::launch::async, slow, 11);
    while (f2.wait_for(std::chrono::milliseconds(100)) != std::future_status::ready)
        std::cout &lt;&lt; &quot;[main] waiting...\\n&quot;;
    std::cout &lt;&lt; &quot;[main] f2 = &quot; &lt;&lt; f2.get() &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `118. Examples / Cpp11 Threads / Futures / Promise`, path: `examples/02_cpp11_threads/05_futures/02_promise.cpp`, dir: `examples/02_cpp11_threads/05_futures`, words: 225, mins: 1, body: `<h1 id="02_promisecpp">02_promise.cpp</h1>
<pre><code class="language-cpp">// 02_promise.cpp -- std::promise / std::future: a one-shot communication channel.
//
//  Imagine an empty mailbox (\`promise\`) with one delivery slot. The recipient
//  is given a key to the box (\`future\`). The sender drops a value (or an
//  exception) into the mailbox once. The recipient blocks until something
//  arrives, then opens the box exactly once.
//
//      sender (worker)                receiver (main)
//      ---------------                ----------------
//      promise&lt;int&gt; p;
//      future&lt;int&gt; f = p.get_future();    --shared state--&gt;   f.get() blocks
//      ...
//      p.set_value(42);                                       f.get() == 42
//
//  Or:
//      p.set_exception(std::current_exception());             f.get() throws
//
//  Useful when:
//   - You manage your own thread (std::async too rigid for your use case).
//   - You want to deliver a result from the middle of an algorithm.

#include &lt;future&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;chrono&gt;
#include &lt;stdexcept&gt;

void compute(std::promise&lt;int&gt; p, int x) noexcept
{
    try {
        std::this_thread::sleep_for(std::chrono::milliseconds(200));
        if (x &lt; 0) throw std::runtime_error(&quot;negative&quot;);
        p.set_value(x * x);
    } catch (...) {
        p.set_exception(std::current_exception());
    }
}

int main()
{
    {   // happy path
        std::promise&lt;int&gt; p;
        auto f = p.get_future();
        std::thread t(compute, std::move(p), 9);
        std::cout &lt;&lt; &quot;result = &quot; &lt;&lt; f.get() &lt;&lt; &quot;\\n&quot;;
        t.join();
    }

    {   // exception path
        std::promise&lt;int&gt; p;
        auto f = p.get_future();
        std::thread t(compute, std::move(p), -1);
        try { f.get(); } catch (const std::exception&amp; e) {
            std::cout &lt;&lt; &quot;caught: &quot; &lt;&lt; e.what() &lt;&lt; &quot;\\n&quot;;
        }
        t.join();
    }
}

</code></pre>` },
  { name: `119. Examples / Cpp11 Threads / Futures / Packaged Task`, path: `examples/02_cpp11_threads/05_futures/03_packaged_task.cpp`, dir: `examples/02_cpp11_threads/05_futures`, words: 290, mins: 1, body: `<h1 id="03_packaged_taskcpp">03_packaged_task.cpp</h1>
<pre><code class="language-cpp">// 03_packaged_task.cpp -- std::packaged_task: callable wired to a future.
//
//  A packaged_task wraps a callable so that, when invoked, its return value
//  (or exception) is stored into the linked future.
//
//      packaged_task&lt;int(int)&gt; task(slow);
//      future&lt;int&gt; fut = task.get_future();
//      thread(std::move(task), 7).detach();   // task() will fill the future
//      ...
//      int r = fut.get();
//
//  Use cases:
//      - Build a TASK QUEUE (your own thread pool) where tasks are
//        std::function&lt;void()&gt; that internally call .operator()() on a
//        packaged_task. The submitter holds the matching future.
//      - More flexibility than std::async (you decide where &amp; when to
//        invoke).

#include &lt;future&gt;
#include &lt;thread&gt;
#include &lt;iostream&gt;
#include &lt;queue&gt;
#include &lt;mutex&gt;
#include &lt;condition_variable&gt;
#include &lt;functional&gt;
#include &lt;vector&gt;
#include &lt;chrono&gt;

class TinyPool {
    std::vector&lt;std::thread&gt;          workers_;
    std::queue&lt;std::function&lt;void()&gt;&gt; q_;
    std::mutex                        m_;
    std::condition_variable           cv_;
    bool                              stop_ = false;
public:
    explicit TinyPool(size_t n) {
        for (size_t i = 0; i &lt; n; ++i)
            workers_.emplace_back([this]{
                for (;;) {
                    std::function&lt;void()&gt; job;
                    {
                        std::unique_lock g(m_);
                        cv_.wait(g, [&amp;]{ return stop_ || !q_.empty(); });
                        if (stop_ &amp;&amp; q_.empty()) return;
                        job = std::move(q_.front()); q_.pop();
                    }
                    job();
                }
            });
    }
    ~TinyPool() {
        { std::lock_guard g(m_); stop_ = true; }
        cv_.notify_all();
        for (auto&amp; w : workers_) w.join();
    }
    template &lt;class F, class... A&gt;
    auto submit(F&amp;&amp; f, A&amp;&amp;... a) -&gt; std::future&lt;std::invoke_result_t&lt;F, A...&gt;&gt; {
        using R = std::invoke_result_t&lt;F, A...&gt;;
        auto task = std::make_shared&lt;std::packaged_task&lt;R()&gt;&gt;(
            [f = std::forward&lt;F&gt;(f),
             tup = std::make_tuple(std::forward&lt;A&gt;(a)...)]() mutable {
                return std::apply(f, std::move(tup));
            });
        std::future&lt;R&gt; fut = task-&gt;get_future();
        {
            std::lock_guard g(m_);
            q_.emplace([task]{ (*task)(); });
        }
        cv_.notify_one();
        return fut;
    }
};

int main()
{
    TinyPool pool(4);
    std::vector&lt;std::future&lt;int&gt;&gt; futs;
    for (int i = 0; i &lt; 8; ++i)
        futs.push_back(pool.submit([](int x){
            std::this_thread::sleep_for(std::chrono::milliseconds(100));
            return x * x;
        }, i));
    for (auto&amp; f : futs) std::cout &lt;&lt; f.get() &lt;&lt; &quot; &quot;;
    std::cout &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `120. Examples / Cpp11 Threads / Futures / Shared Future`, path: `examples/02_cpp11_threads/05_futures/04_shared_future.cpp`, dir: `examples/02_cpp11_threads/05_futures`, words: 165, mins: 1, body: `<h1 id="04_shared_futurecpp">04_shared_future.cpp</h1>
<pre><code class="language-cpp">// 04_shared_future.cpp -- One result, many readers.
//
//  std::future is single-consumer: only ONE thread can call .get(). If you
//  need multiple consumers to read the same result, use std::shared_future.
//
//      std::future&lt;int&gt;        f = ...;
//      std::shared_future&lt;int&gt; sf = f.share();    // sf is COPYABLE
//
//      // Many threads:
//      sf.get();   // each thread can call get()
//
//  Picture:
//
//      promise --once--&gt; shared_future
//                              |
//                +-------------+-------------+
//                |             |             |
//             reader1       reader2       reader3
//             .get()        .get()        .get()
//             (all see the same result, no copy of the actual T)

#include &lt;future&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;
#include &lt;chrono&gt;

int main()
{
    std::promise&lt;int&gt; p;
    std::shared_future&lt;int&gt; sf = p.get_future().share();

    std::vector&lt;std::thread&gt; readers;
    for (int i = 0; i &lt; 4; ++i) {
        readers.emplace_back([sf, i]{           // sf is COPIED -&gt; ok
            int v = sf.get();
            std::cout &lt;&lt; &quot;  reader &quot; &lt;&lt; i &lt;&lt; &quot; got &quot; &lt;&lt; v &lt;&lt; &quot;\\n&quot;;
        });
    }

    std::this_thread::sleep_for(std::chrono::milliseconds(200));
    p.set_value(123);
    for (auto&amp; t : readers) t.join();
}

</code></pre>` },
  { name: `121. Examples / Cpp11 Threads / Call Once / Call Once`, path: `examples/02_cpp11_threads/06_call_once/01_call_once.cpp`, dir: `examples/02_cpp11_threads/06_call_once`, words: 223, mins: 1, body: `<h1 id="01_call_oncecpp">01_call_once.cpp</h1>
<pre><code class="language-cpp">// 01_call_once.cpp -- std::call_once / std::once_flag.
//
//  Guarantees a function is executed EXACTLY ONCE, even with many threads
//  arriving simultaneously. The first to arrive runs it; others block until
//  it completes.
//
//      std::once_flag once;
//      std::call_once(once, init_fn, args...);
//
//  Use cases:
//      - Lazy singleton init.
//      - Lazy resource open (file, db).
//      - Replace double-checked locking (which is hard to get right
//        without atomics).
//
//  Picture:
//
//      thread 1: call_once(once, init) -- runs init, then returns
//      thread 2: call_once(once, init) -- BLOCKS until thread1 finishes,
//                                         then returns without running init
//      thread 3: call_once(once, init) -- since flag is set, returns immediately
//
//  Note: in C++11+, function-local static initialization is ALSO thread-safe
//  (&quot;Meyers singleton&quot;) and is usually simpler:
//
//      Foo&amp; instance() {
//          static Foo f;        // standard guarantees thread-safe init
//          return f;
//      }

#include &lt;mutex&gt;
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

std::once_flag g_init;
std::string    g_data;

void init() {
    std::cout &lt;&lt; &quot;    [init] performing one-time setup\\n&quot;;
    g_data = &quot;initialized&quot;;
}

void worker(int id)
{
    std::call_once(g_init, init);
    std::cout &lt;&lt; &quot;[w&quot; &lt;&lt; id &lt;&lt; &quot;] saw g_data = \\&quot;&quot; &lt;&lt; g_data &lt;&lt; &quot;\\&quot;\\n&quot;;
}

int main()
{
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; 8; ++i) ts.emplace_back(worker, i);
    for (auto&amp; t : ts) t.join();
}

</code></pre>` },
  { name: `122. Examples / Cpp11 Threads / Thread Local / Thread Local`, path: `examples/02_cpp11_threads/07_thread_local/01_thread_local.cpp`, dir: `examples/02_cpp11_threads/07_thread_local`, words: 257, mins: 1, body: `<h1 id="01_thread_localcpp">01_thread_local.cpp</h1>
<pre><code class="language-cpp">// 01_thread_local.cpp -- thread_local storage class.
//
//  A thread_local variable has a SEPARATE INSTANCE in every thread, with
//  its own lifetime tied to that thread. Same syntax as static, but
//  per-thread instead of per-process.
//
//      thread_local int counter = 0;     // each thread starts with 0
//
//  Memory diagram:
//
//      shared (static):    +-----+
//                          |  X  |   &lt;-- one instance, all threads share
//                          +-----+
//
//      thread_local:       +-----+    +-----+    +-----+
//                          | X1  |    | X2  |    | X3  |
//                          +-----+    +-----+    +-----+
//                            T1         T2         T3
//
//  Use cases:
//      - Per-thread RNG.
//      - Per-thread allocator/arena.
//      - Per-thread caches.
//      - Per-thread logging buffer.
//
//  Caveats:
//      - First access in each thread can be slower (TLS slot lookup,
//        constructor on first use).
//      - For non-trivial types, the destructor runs at thread exit.

#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;
#include &lt;random&gt;

thread_local std::mt19937 rng{std::random_device{}()};
thread_local int          calls = 0;

int rand_in(int lo, int hi)
{
    ++calls;
    std::uniform_int_distribution&lt;int&gt; d(lo, hi);
    return d(rng);
}

int main()
{
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; 4; ++i) {
        ts.emplace_back([i]{
            int sum = 0;
            for (int k = 0; k &lt; 5; ++k) sum += rand_in(1, 100);
            std::cout &lt;&lt; &quot;thread &quot; &lt;&lt; i
                      &lt;&lt; &quot; sum=&quot; &lt;&lt; sum
                      &lt;&lt; &quot; calls=&quot; &lt;&lt; calls &lt;&lt; &quot;\\n&quot;;
        });
    }
    for (auto&amp; t : ts) t.join();
    // main thread's \`calls\` is still 0 (its own per-thread instance).
    std::cout &lt;&lt; &quot;main calls=&quot; &lt;&lt; calls &lt;&lt; &quot;\\n&quot;;
}

</code></pre>` },
  { name: `123. Examples / Cpp11 Threads / Jthread Cpp20 / Jthread`, path: `examples/02_cpp11_threads/08_jthread_cpp20/01_jthread.cpp`, dir: `examples/02_cpp11_threads/08_jthread_cpp20`, words: 204, mins: 1, body: `<h1 id="01_jthreadcpp">01_jthread.cpp</h1>
<pre><code class="language-cpp">// 01_jthread.cpp -- C++20 std::jthread + std::stop_token.
//
//  Two things every C++20 program should adopt:
//
//   1. std::jthread auto-joins in its destructor (no more &quot;forgot to join&quot;).
//   2. std::stop_token gives cooperative, safe cancellation.
//
//      std::jthread t([](std::stop_token st){
//          while (!st.stop_requested()) { ... }
//      });
//      t.request_stop();   // sets the token
//      // destructor join()s
//
//  Picture:
//
//      main                            jthread worker
//      ----                            --------------
//      jthread t(fn);                  fn(stop_token) {
//      ...                                while (!st.stop_requested())
//      // t goes out of scope:                do_work();
//      //   t.request_stop();              cleanup;
//      //   t.join();                    }
//
//  Compile: g++ -std=c++20 -pthread -O2 -o 01_jthread 01_jthread.cpp
//
//  Falls back to a friendly message if compiled without C++20 jthread support.

#include &lt;version&gt;     // brings __cpp_lib_jthread macro
#include &lt;iostream&gt;

#if __cpp_lib_jthread &gt;= 201911L

#include &lt;thread&gt;
#include &lt;stop_token&gt;
#include &lt;chrono&gt;

using namespace std::chrono_literals;

int main()
{
    std::jthread t([](std::stop_token st){
        int n = 0;
        while (!st.stop_requested()) {
            std::cout &lt;&lt; &quot;  worker tick &quot; &lt;&lt; ++n &lt;&lt; &quot;\\n&quot;;
            std::this_thread::sleep_for(150ms);
        }
        std::cout &lt;&lt; &quot;  worker exiting cleanly\\n&quot;;
    });

    std::this_thread::sleep_for(800ms);
    std::cout &lt;&lt; &quot;[main] requesting stop\\n&quot;;
    t.request_stop();          // jthread destructor will also auto-join
}

#else

int main() {
    std::cout &lt;&lt; &quot;Compile with -std=c++20 and a recent libc++/libstdc++ for jthread.\\n&quot;;
}

/* Join a relative href onto a base directory and normalize . / .. segments. */
function joinPath(baseDir, rel) {
    if (rel.charAt(0) === '/') { baseDir = ''; rel = rel.replace(/^\/+/, ''); }

    const out = [];
    for (const p of parts) {
        if (p === '' || p === '.') continue;
        if (p === '..') { out.pop(); continue; }
        out.push(p);
    }
    return out.join('/');

function mdTarget(rawHref, baseDir) {
    if (!rawHref || rawHref.charAt(0) === '#') return null;
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(rawHref) || /^(mailto|tel):/i.test(rawHref)) return null;

    let anchor = '';
    let pathPart = rawHref;
    const hashIdx = pathPart.indexOf('#');
    if (hashIdx >= 0) {
        anchor = pathPart.substring(hashIdx + 1);
        pathPart = pathPart.substring(0, hashIdx);
        try { anchor = decodeURIComponent(anchor); } catch (e) {}
    }
    const qIdx = pathPart.indexOf('?');
    if (qIdx >= 0) pathPart = pathPart.substring(0, qIdx);
    if (!pathPart) return null;

    const joined = joinPath(baseDir || '', pathPart).toLowerCase();
    let idx;
    if (/\.md$/i.test(pathPart)) {
        idx = BY_PATH[joined];
        if (idx === undefined) {
            const base = joined.split('/').pop();
            idx = BY_BASENAME[base];
        }
    } else {

        idx = BY_DIR_README[joined];
    }
    if (idx === undefined) return null;
    return { idx: idx, anchor: anchor };
