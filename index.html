<p>Not all state should be shared. <strong>Thread-local storage (TLS)</strong> gives each
thread its own copy of a variable — per-thread buffers, errno-like scratch
space, request context. <strong>Cancellation</strong> lets one thread forcibly stop another —
powerful, fragile, and largely superseded by cooperative shutdown flags.</p>
<hr />
<h2 id="161-why-thread-local-storage">1.6.1 Why thread-local storage?</h2>
<p>Part 0.1 listed TLS in the &ldquo;private to each thread&rdquo; column. Without it, a
function using a static buffer would be a race:</p>
<pre><code class="language-c">static char buf[4096];   /* BUG if two threads call format() concurrently */
</code></pre>
<p>TLS moves <code>buf</code> into each thread&rsquo;s private storage:</p>
<pre><code>   process address space
   ┌──────────────────────────────────────────────┐
   │  global key k  ──▶  per-thread slot table    │
   │                        │         │         │  │
   │                     thread A  thread B  thread C
   │                     buf_A     buf_B     buf_C
   └──────────────────────────────────────────────┘
</code></pre>
<p>No mutex needed for thread-private data — different memory locations, no shared
mutable access (Part 0.4).</p>
<hr />
<h2 id="162-posix-tls-pthread_key_t">1.6.2 POSIX TLS: pthread_key_t</h2>
<blockquote>
<p><strong>The API ▸</strong> <code>#include &lt;pthread.h&gt;</code>
<code>c
int pthread_key_create(pthread_key_t *key, void (*destructor)(void *));
int pthread_key_delete(pthread_key_t key);
int pthread_setspecific(pthread_key_t key, const void *value);
void *pthread_getspecific(pthread_key_t key);

</blockquote>
<ul>
<li>
<p><code>pthread_key_create</code> — once per process; optional <strong>destructor</strong> runs at
  thread exit when the thread had a non-NULL value.</p>
</li>
<li>
<p><code>pthread_setspecific</code> / <code>pthread_getspecific</code> — per-thread get/set.</p>
</li>
<li><code>pthread_once</code> — initialize the key exactly once (thread-safe singleton pattern).</li>

<h2 id="163-compiler-tls-__thread--_thread_local">1.6.3 Compiler TLS: <code>__thread</code> / <code>_Thread_local</code></h2>
<blockquote>
<p><strong>The API ▸</strong> (GCC/Clang, C11)
<code>c

<code>pthread_getspecific</code>.</p>
</blockquote>
<p><strong>Trade-offs ▸</strong></p>
<table>
<thead>
<tr>
<th></th>
<th><code>pthread_key_t</code></th>
<th><code>__thread</code> / <code>_Thread_local</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Destructor at thread exit</td>
<td>✓</td>
<td>✗ (C11 TLS has no destructor)</td>
</tr>
<tr>
<td>Dynamic per-key allocation</td>
<td>✓</td>
<td>static/link-time only</td>
</tr>
<tr>
<td>Access cost</td>
<td>indirect lookup</td>
<td>direct, faster</td>
</tr>

<td>C++ <code>thread_local</code></td>

<h2 id="164-tls-example-with-destructor">1.6.4 TLS example with destructor</h2>
<pre><code class="language-c">// gcc -Wall -pthread tls_demo.c -o tls_demo

#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;string.h&gt;

static pthread_key_t  key;
static pthread_once_t key_once = PTHREAD_ONCE_INIT;

static void buf_destroy(void *p)

    free(p);
}

static void make_key(void)

    return NULL;   /* destructor runs here for this thread's buffer */

<h2 id="165-thread-cancellation">1.6.5 Thread cancellation</h2>
<blockquote>
<p><strong>The API ▸</strong> <code>#include &lt;pthread.h&gt;</code>
<code>c
int pthread_cancel(pthread_t thread);
int pthread_setcancelstate(int state, int *oldstate);
   /* PTHREAD_CANCEL_ENABLE | PTHREAD_CANCEL_DISABLE */
int pthread_setcanceltype(int type, int *oldtype);
   /* PTHREAD_CANCEL_DEFERRED | PTHREAD_CANCEL_ASYNCHRONOUS */
void pthread_testcancel(void);

</blockquote>
<pre><code>   cancellation flow (DEFERRED, default):

   main                          worker
   ────                          ──────
                                 (cancel ENABLED, DEFERRED)
   pthread_cancel(worker) ──▶    flag set; worker still running
                                 ...
                                 hits cancellation point (sleep, cond_wait, ...)
                                 cleanup handlers run LIFO

<pre><code class="language-c">void cleanup(void *arg) { free(arg); }

pthread_cleanup_push(cleanup, resource);
/* ... cancellation points ... */

control-flow macros are fragile.</p>
<hr />
<h2 id="167-cooperative-shutdown-is-usually-better">1.6.7 Cooperative shutdown is usually better</h2>
<p><strong>Trade-offs ▸</strong> Modern practice favors an <strong><code>atomic</code> or <code>volatile sig_atomic_t</code>

#include &lt;stdatomic.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;

static void *worker(void *arg)
{
    (void)arg;
    while (!atomic_load(&amp;stop)) {

<table>
<thead>
<tr>
<th></th>
<th>Cancellation</th>
<th>Atomic stop flag</th>

</thead>
<tbody>
<tr>
<td>Portable mental model</td>

</tr>

<td>good</td>

<h2 id="summary">Summary</h2>
<ul>
<li><strong>TLS</strong> gives each thread private storage — no lock for thread-private data.</li>

<p>C++11 gave us a portable, type-safe thread API in <code>&lt;thread&gt;</code>. Under the hood it
wraps the same OS primitives as pthreads (Part 1.1), but the surface is RAII-friendly
callables instead of <code>void* (*)(void*)</code>. This chapter is the lifecycle: spawn,
join, detach, move — and the rules that keep you out of <code>std::terminate</code>.</p>
<hr />
<h2 id="211-constructing-a-thread">2.1.1 Constructing a thread</h2>
<p>A <code>std::thread</code> runs a <strong>callable</strong> (function, functor, lambda) on a new thread.
Arguments after the callable are <strong>decayed and copied/moved</strong> into thread-local
storage, then passed to the callable:</p>
<pre><code>   main thread                          new std::thread
   ───────────                          ───────────────
   std::thread t(f, arg1, arg2)  ──▶    copies/moves args into thread storage
                                        invokes f(decayed_args...)
</code></pre>
<blockquote>
<p><strong>The API ▸</strong>
\`\`\`cpp</p>
<h1 id="include">include <thread></h1>
<p>template<class F, class... Args>
explicit thread(F&amp;&amp; f, Args&amp;&amp;&hellip; args);
<code>\`\`
Creates a joinable thread that executes</code>INVOKE(decay_copy(f), decay_copy(args)&hellip;)<code>.
The thread begins running **before** the constructor returns (as-if concurrent
with the caller). Requires linking with</code>-pthread\`.</p>
</blockquote>
<p>The copy-by-default behavior is the #1 surprise for C++ newcomers:</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Passing a reference without <code>std::ref</code>:
<code>cpp
void inc(int&amp; n) { ++n; }
int x = 0;
std::thread t(inc, x);           // ✗ compiles on some compilers, copies x
std::thread t(inc, std::ref(x)); // ✓ thread sees the real x</code>
<code>std::thread</code> always stores arguments by value in its internal tuple. A
<code>T&amp;</code> parameter receives a reference to a <strong>copy inside the thread</strong> — which
dies when the thread ends. Use <code>std::ref</code> / <code>std::cref</code>, or capture by
reference in a lambda: <code>std::thread t([&amp;x]{ ++x; });</code>.</p>
</blockquote>
<p>Member functions work with <code>std::bind</code> or a lambda:</p>
<pre><code class="language-cpp">struct Worker {
    void run(int id) { /* ... */ }
};
Worker w;
std::thread t1(&amp;Worker::run, &amp;w, 42);           // pointer + args
std::thread t2([&amp;w]{ w.run(42); });             // often clearer
</code></pre>

<h2 id="212-join-vs-detach">2.1.2 join() vs detach()</h2>
<p>Every joinable thread must end its life in exactly one of two ways:</p>
<pre><code>   joinable thread at destruction

<p><strong>The API ▸</strong>
<code>cpp
void join();    // blocks until thread finishes; releases OS resources
void detach();  // thread runs independently; handle becomes non-joinable
bool joinable() const noexcept;</code>

non-joinable thread throws <code>std::system_error</code>.</p>
<p><strong>Rule ▸</strong> Never let a <strong>joinable</strong> <code>std::thread</code> be destroyed. Its destructor
calls <code>std::terminate()</code> — a hard abort, not an exception. This is deliberate:
the standard refuses to guess whether you meant to join or detach.</p>
<p><strong>Under the hood ▸</strong> <code>join()</code> maps to <code>pthread_join</code> on POSIX: the kernel

a clear lifetime (logging, telemetry). Detached threads are easy to leak or
race with shutdown.</p>
<hr />
<h2 id="213-thread-identity-and-hardware-concurrency">2.1.3 Thread identity and hardware concurrency</h2>

<p><strong>The API ▸</strong>
<code>cpp

</blockquote>
<p>Useful for logging and associating per-thread data (Part 2.5):</p>
<pre><code class="language-cpp">std::cout &lt;&lt; &quot;worker &quot; &lt;&lt; std::this_thread::get_id() &lt;&lt; &quot;\\n&quot;;
int n = std::thread::hardware_concurrency();  // e.g. 8 — not a promise of 8 threads
</code></pre>
<p>Do <strong>not</strong> treat <code>hardware_concurrency()</code> as a hard cap — I/O-bound workloads
often benefit from more threads than cores; compute-bound pools usually match
core count (Part 4.1).</p>
<hr />
<h2 id="214-moving-threads">2.1.4 Moving threads</h2>
<p><code>std::thread</code> is <strong>move-only</strong> (not copyable). Ownership of the OS thread handle
transfers on move:</p>
<pre><code class="language-cpp">std::thread t1(worker);
std::thread t2 = std::move(t1);   // t1 is now non-joinable (empty)
// t2 owns the thread — must join or detach t2
t2.join();
</code></pre>
<p>This enables containers and thread pools:</p>
<pre><code class="language-cpp">std::vector&lt;std::thread&gt; pool;
pool.emplace_back(worker, 0);
pool.emplace_back(worker, 1);
for (auto&amp; t : pool) t.join();
</code></pre>
<p>A moved-from thread is not joinable — destroying it is safe.</p>
<hr />
<h2 id="215-exceptions-do-not-cross-the-thread-boundary">2.1.5 Exceptions do not cross the thread boundary</h2>
<p>If the callable throws and the exception escapes, <strong><code>std::terminate</code> is called</strong>
(same as an uncaught exception in a C callback). There is no stack unwinding
into the spawning thread.</p>
<pre><code>   thread A spawns thread B
   thread B throws std::runtime_error
              │
              ▼
   terminate() — thread A never sees the exception
</code></pre>
<p>To propagate errors, use <code>std::promise</code> / <code>std::future</code> (Part 2.4) or catch inside
the thread and signal failure through shared state protected by a mutex.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Letting exceptions fly out of a thread callable. Always catch
inside the thread or use futures.</p>
</blockquote>
<hr />
<h2 id="216-a-complete-example">2.1.6 A complete example</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread std_thread_demo.cpp -o std_thread_demo
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;functional&gt;
#include &lt;vector&gt;
#include &lt;chrono&gt;

void worker(int id, int&amp; shared) {
    using namespace std::chrono_literals;
    std::this_thread::sleep_for(50ms * id);
    ++shared;   // ⚠ data race — fix with mutex (Part 2.2) or atomic (Part 3.1)
    std::cout &lt;&lt; &quot;thread &quot; &lt;&lt; id &lt;&lt; &quot; id=&quot; &lt;&lt; std::this_thread::get_id() &lt;&lt; &quot;\\n&quot;;
}

int main() {
    int total = 0;
    std::vector&lt;std::thread&gt; threads;

    for (int i = 0; i &lt; 4; ++i)
        threads.emplace_back(worker, i, std::ref(total));

    for (auto&amp; t : threads)
        if (t.joinable()) t.join();

    std::cout &lt;&lt; &quot;done (total may be &lt; 4 — unsynchronized)\\n&quot;;
    return 0;
}
</code></pre>
<p>The unsynchronized <code>++shared</code> is intentional — it connects back to Part 0.4&rsquo;s
shared-state problem. Real code wraps that increment in a mutex or atomic.</p>
<hr />
<h2 id="217-teaser-stdjthread-part-26">2.1.7 Teaser: std::jthread (Part 2.6)</h2>
<p>C++20 adds <code>std::jthread</code> — a <strong>joining thread</strong>: its destructor automatically
<code>request_stop()</code> + <code>join()</code>, so you cannot forget. It also wires cooperative
cancellation through <code>std::stop_token</code>. If you&rsquo;ve ever hit <code>std::terminate</code> because
a joinable <code>std::thread</code> went out of scope, <code>jthread</code> is the fix:</p>
<pre><code class="language-cpp">// C++20 — full treatment in Part 2.6
std::jthread t([](std::stop_token st) {
    while (!st.stop_requested()) { /* work */ }
});  // joins here — no terminate
</code></pre>
<p>For now, treat every <code>std::thread</code> as <strong>must join or detach before destruction</strong>.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p><code>std::thread(callable, args...)</code> <strong>copies/decays</strong> arguments — use <code>std::ref</code>
  for references; lambdas with <code>[&amp;]</code> are often clearer.</p>
</li>
<li>
<p>A joinable thread <strong>must</strong> be <code>join()</code>ed or <code>detach()</code>ed before destruction;
  otherwise <code>std::terminate()</code>.</p>
</li>
<li>
<p><code>join()</code> waits and reaps; <code>detach()</code> orphans the thread — prefer join unless
  lifetime is truly independent.</p>
</li>
<li>
<p><code>std::thread</code> is move-only; moved-from threads are empty and non-joinable.</p>
</li>
<li>
<p>Exceptions in the thread callable call <code>std::terminate</code> — use futures or catch
  internally.</p>
</li>
<li>
<p><code>hardware_concurrency()</code> is a hint, not a law; <code>get_id()</code> identifies threads
  opaquely.</p>
</li>
<li>
<p>C++20 <code>std::jthread</code> auto-joins and supports cancellation (Part 2.6).</p>
</li>
</ul>

<p>A mutex (<strong>mut</strong>ual <strong>ex</strong>clusion) is the simplest fix for the shared-state
problem (Part 0.4): only one thread at a time may execute a <strong>critical section</strong>
that touches shared mutable data. C++ wraps the same pthread mutex idea (Part 1.2)
with RAII lock types so you cannot forget to unlock on every exit path.</p>
<hr />
<h2 id="221-the-mutex-family">2.2.1 The mutex family</h2>
<p><img alt="Mutex types and lock wrappers" src="figures/lock-types.svg" /></p>
<pre><code>   thread wants critical section
              │
              ▼
         lock(mutex)  ──▶  if free: enter
              │           if held: block (kernel wait queue)
              ▼
         ... critical section — ONE thread only ...
              │
              ▼
         unlock(mutex)  ──▶  wake a waiter
</code></pre>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;mutex&gt;</code>
<code>cpp
class mutex {
    void lock();
    bool try_lock();              // non-blocking
    void unlock();
};
class recursive_mutex { /* same + same thread may re-lock */ };
class timed_mutex {
    bool try_lock_for(const chrono::duration&amp; d);
    bool try_lock_until(const chrono::time_point&amp; t);
};
class shared_mutex {              // C++17
    void lock();                  // exclusive (writer)
    void lock_shared();           // shared (reader)
    void unlock(); void unlock_shared();
};</code>
All are <strong>non-copyable, non-movable</strong>. A thread that <code>lock()</code>s must <code>unlock()</code>.
<code>lock()</code> blocks; <code>try_lock()</code> returns immediately.</p>
</blockquote>
<table>
<thead>
<tr>
<th>Type</th>
<th>When to use</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>mutex</code></td>
<td>Default — one owner, no re-entry</td>
</tr>
<tr>
<td><code>recursive_mutex</code></td>
<td>Callbacks / legacy code that re-locks same mutex (prefer redesign)</td>
</tr>
<tr>
<td><code>timed_mutex</code></td>
<td>Bounded wait — timeout instead of block forever</td>
</tr>
<tr>
<td><code>shared_mutex</code></td>
<td>Many readers OR one writer (Part 4.3)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Under the hood ▸</strong> Uncontended <code>lock()</code> is often a single atomic compare-and-swap
in userspace. On contention the runtime falls through to a <strong>futex</strong> (Linux) or
similar  — the thread sleeps in the kernel until <code>unlock()</code> wakes it. That
syscall path is why mutexes are cheap when uncontended and expensive under fight.</p>
</blockquote>
<hr />
<h2 id="222-lock_guard--minimal-raii">2.2.2 lock_guard — minimal RAII</h2>
<blockquote>
<p><strong>The API ▸</strong>
<code>cpp
template&lt;class Mutex&gt; class lock_guard {
public:
    explicit lock_guard(Mutex&amp; m);
    lock_guard(Mutex&amp; m, adopt_lock_t);  // mutex already locked
    ~lock_guard();   // unlocks m
};</code>
Construct → lock. Destroy → unlock. <strong>Not movable.</strong> Use when the lock scope
equals the guard&rsquo;s lifetime and you never need to defer or hand off.</p>
</blockquote>
<pre><code class="language-cpp">std::mutex m;
int counter = 0;

void increment() {
    std::lock_guard&lt;std::mutex&gt; lk(m);
    ++counter;   // critical section
}   // unlock here, even if exception thrown
</code></pre>
<hr />
<h2 id="223-unique_lock--the-flexible-one">2.2.3 unique_lock — the flexible one</h2>
<p><code>unique_lock</code> is what condition variables require (Part 2.3):</p>
<blockquote>
<p><strong>The API ▸</strong>
<code>cpp
template&lt;class Mutex&gt; class unique_lock {
public:
    explicit unique_lock(Mutex&amp; m);
    unique_lock(Mutex&amp; m, defer_lock_t);    // don't lock yet
    unique_lock(Mutex&amp; m, try_to_lock_t);
    unique_lock(Mutex&amp; m, adopt_lock_t);
    void lock(); void unlock(); bool owns_lock() const;
    // movable; not copyable
};</code></p>
</blockquote>
<pre><code>   lock_guard          unique_lock
   ──────────          ───────────
   lock on ctor        defer_lock → lock later
   unlock on dtor      try_lock / timed try
   fixed scope         movable — transfer ownership
   no condvar          required by condition_variable::wait
</code></pre>
<p><strong>Trade-offs ▸</strong> <code>lock_guard</code> is lighter when you only need scoped lock/unlock.
<code>unique_lock</code> pays for flexibility: deferred locking, timed waits, and releasing
the mutex inside <code>wait()</code>.</p>
<hr />
<h2 id="224-scoped_lock--multiple-mutexes-no-deadlock">2.2.4 scoped_lock — multiple mutexes, no deadlock</h2>
<p>Locking two mutexes in inconsistent order is a classic deadlock (Part 5.2).
C++17&rsquo;s <code>scoped_lock</code> locks <strong>all</strong> mutexes atomically via <code>std::lock</code>:</p>
<blockquote>
<p><strong>The API ▸</strong>
<code>cpp
template&lt;class... Mutexes&gt;
class scoped_lock {
public:
    explicit scoped_lock(Mutexes&amp;... m);  // locks all via std::lock
    ~scoped_lock();                        // unlocks all
};</code></p>
</blockquote>
<pre><code class="language-cpp">std::mutex m1, m2;

void transfer() {
    std::scoped_lock lk(m1, m2);   // deadlock-safe — order doesn't matter
    // touch data guarded by both
}
</code></pre>
<blockquote>
<p><strong>The API ▸</strong> — free function
<code>cpp
template&lt;class L1, class L2, class... L3&gt;
void lock(L1&amp; m1, L2&amp; m2, L3&amp;... ms);   // deadlock-avoiding multi-lock
void adopt_lock(adopt_lock_t, Mutex&amp;...);  // mark already-locked mutexes</code>
<code>std::lock</code> uses a deadlock-avoidance algorithm (try, back off, retry). After
manual multi-locking, pass <code>std::adopt_lock</code> to the guard so it unlocks on exit
without re-locking.</p>
</blockquote>
<hr />
<h2 id="225-shared_lock--concurrent-readers">2.2.5 shared_lock — concurrent readers</h2>
<p>With <code>shared_mutex</code>, many <code>shared_lock</code> holders can read simultaneously; a
<code>unique_lock</code>/<code>lock_guard</code> writer excludes everyone:</p>
<pre><code class="language-cpp">std::shared_mutex rw;
std::map&lt;std::string, int&gt; cache;

int lookup(const std::string&amp; key) {
    std::shared_lock lk(rw);          // shared — readers OK together
    return cache.at(key);
}

void insert(std::string key, int val) {
    std::lock_guard&lt;std::shared_mutex&gt; lk(rw);  // exclusive writer
    cache[std::move(key)] = val;
}
</code></pre>
<p>Readers-writer patterns are developed fully in Part 4.3.</p>
<hr />
<h2 id="226-example-protecting-shared-state">2.2.6 Example: protecting shared state</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread mutex_demo.cpp -o mutex_demo
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;mutex&gt;
#include &lt;vector&gt;

std::mutex m;
long counter = 0;

void worker(int n) {
    for (int i = 0; i &lt; n; ++i) {
        std::lock_guard&lt;std::mutex&gt; lk(m);
        ++counter;
    }
}

int main() {
    constexpr int per_thread = 250'000;
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; 4; ++i)
        ts.emplace_back(worker, per_thread);
    for (auto&amp; t : ts) t.join();
    std::cout &lt;&lt; &quot;counter = &quot; &lt;&lt; counter &lt;&lt; &quot; (expected &quot;
              &lt;&lt; 4 * per_thread &lt;&lt; &quot;)\\n&quot;;
    return 0;
}
</code></pre>
<p>Every increment is inside the critical section → no data race → result is exact.
The cost: threads serialize on <code>m</code> — fine for tiny sections, a bottleneck if the
work inside the lock grows (Part 5.4 false sharing, Part 3 atomics for counters).</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Holding a lock while doing I/O or slow work — you turn parallelism
into serial execution. Keep critical sections <strong>short</strong>.</p>
<p><strong>Rule ▸</strong> If two threads can touch the same mutable location and at least one
writes, that access must be inside a critical section (or atomic). The mutex
only protects what happens <strong>between</strong> <code>lock</code> and <code>unlock</code>.</p>
</blockquote>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p><code>std::mutex</code> gives exclusive access; variants add re-entry, timeouts, or
  shared/exclusive modes (<code>shared_mutex</code>).</p>
</li>
<li>
<p><code>lock_guard</code> — simple RAII; <code>unique_lock</code> — defer/try/timed, movable, required
  by condition variables.</p>
</li>
<li>
<p><code>scoped_lock</code> + <code>std::lock</code> lock multiple mutexes without deadlock ordering bugs.</p>
</li>
<li><code>shared_lock</code> pairs with <code>shared_mutex</code> for reader concurrency.</li>
<li>Mutex contention may syscall to the kernel; keep critical sections short.</li>
<li>Always prefer RAII guards over raw <code>lock()</code>/<code>unlock()</code>.</li>
</ul>

<p>A mutex answers &ldquo;who may touch shared state right now?&rdquo; A <strong>condition variable</strong>
answers &ldquo;wake me when shared state <strong>becomes</strong> what I need.&rdquo; It is the standard
way to block a thread until a predicate on guarded data is true — producer/consumer
queues, thread pools waiting for work, barriers between phases.</p>
<p>Unlike a busy-wait spin loop, a CV puts the thread to sleep in the kernel until
another thread <code>notify</code>s.</p>
<hr />
<h2 id="231-the-waitnotify-contract">2.3.1 The wait/notify contract</h2>
<pre><code>   waiter                              notifier
   ──────                              ────────
   lock(m)                             lock(m)
   while (!predicate)                  mutate shared state
       wait(cv, m)  ── unlock+sleep ──▶  predicate now true
       ▲                                 notify_one/all(cv)
       └── wake, re-lock m
   use shared state
   unlock(m)
</code></pre>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;condition_variable&gt;</code>
<code>cpp
class condition_variable {
    void wait(unique_lock&lt;mutex&gt;&amp; lock);
    template&lt;class Pred&gt; void wait(unique_lock&lt;mutex&gt;&amp; lock, Pred pred);
    void notify_one() noexcept;
    void notify_all() noexcept;
    // wait_for, wait_until with chrono overloads...
};</code>
<code>wait</code> <strong>requires</strong> <code>unique_lock&lt;std::mutex&gt;</code> — it atomically unlocks the
mutex and blocks; on wakeup it re-acquires the lock before returning.
<code>notify_*</code> does not require holding the mutex (but see pitfalls below).</p>
</blockquote>
<p>The two-argument form is what you should always use:</p>
<pre><code class="language-cpp">cv.wait(lock, []{ return ready; });
// equivalent to:
while (!ready) cv.wait(lock);
</code></pre>
<p>It loops for you — critical for spurious wakeups and lost-wakeup avoidance.</p>
<hr />
<h2 id="232-why-the-predicate-loop-is-mandatory">2.3.2 Why the predicate loop is mandatory</h2>
<p>Two separate mechanisms force the <code>while</code>:</p>
<p><strong>Spurious wakeup</strong> — POSIX and the C++ standard permit <code>wait</code> to return even
when nobody called <code>notify</code>. Without re-checking the predicate you may proceed
when the condition is false.</p>
<p><strong>Lost wakeup</strong> — if the waiter checks the predicate <strong>before</strong> locking, or if
<code>notify</code> fires <strong>before</strong> <code>wait</code> begins sleeping, the signal is missed:</p>
<pre><code>   WRONG (no lock around check):
   thread B: if (queue.empty()) wait...   // sees empty
   thread A: push item; notify            // fires before B sleeps → LOST

   RIGHT:
   thread B: lock; while (empty) wait;    // check under lock
   thread A: lock; push; notify; unlock
</code></pre>
<blockquote>
<p><strong>Rule ▸</strong> Always wait on a <strong>predicate</strong> tied to shared state, checked under
the same mutex the CV uses. Pattern: lock → while (!pred) wait → act → unlock.</p>
</blockquote>
<p>This is the same invariant as Part 1.3 and Part 5.6 (lost wakeups).</p>
<hr />
<h2 id="233-notify_one-vs-notify_all">2.3.3 notify_one vs notify_all</h2>
<pre><code>   notify_one()              notify_all()
   ────────────              ────────────
   wake ONE waiter           wake EVERY waiter
   cheaper if one suffices   safe when many must re-check
   risk: wrong one wakes     thundering herd — all re-contend for lock
</code></pre>
<p>Use <code>notify_one</code> when exactly one thread can make progress (one slot in a bounded
buffer). Use <code>notify_all</code> when the predicate change affects many waiters (shutdown
flag, phase change) or when you&rsquo;re unsure.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Calling <code>notify</code> before mutating shared state, or without the
waiter holding the lock during the predicate check. The predicate must be
updated <strong>before</strong> notify, under the mutex.</p>
</blockquote>
<hr />
<h2 id="234-timed-waits">2.3.4 Timed waits</h2>
<blockquote>
<p><strong>The API ▸</strong>
\`\`\`cpp
template<class Rep, class Period>
cv_status wait_for(unique_lock<mutex>&amp; lock,
                   const chrono::duration<Rep, Period>&amp; rel_time);
template<class Pred, class Rep, class Period>
bool wait_for(unique_lock<mutex>&amp; lock,
              const chrono::duration<Rep, Period>&amp; rel_time, Pred pred);</p>
<p>cv_status wait_until(unique_lock<mutex>&amp; lock,
                     const chrono::time_point&lt;&hellip;&gt;&amp; abs_time);
<code>\`\`
Returns</code>cv_status::timeout<code>if the deadline passes with predicate still false.
The predicate overload returns</code>bool<code>—</code>true\` if pred became true.</p>
</blockquote>
<p>Timed waits still follow the same predicate discipline.</p>
<hr />
<h2 id="235-condition_variable_any">2.3.5 condition_variable_any</h2>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;condition_variable&gt;</code>
<code>cpp
class condition_variable_any {
    template&lt;class Lock&gt; void wait(Lock&amp; lock);
    template&lt;class Lock, class Pred&gt; void wait(Lock&amp; lock, Pred pred);
    // ...
};</code>
Works with <strong>any</strong> BasicLockable, not just <code>unique_lock&lt;mutex&gt;</code>. Use when you
need a <code>shared_lock</code> or custom lock type. Slightly heavier internally.</p>
</blockquote>
<p>For 99% of code, <code>condition_variable</code> + <code>unique_lock&lt;mutex&gt;</code> is the right choice.</p>
<hr />
<h2 id="236-producerconsumer-sketch">2.3.6 Producer–consumer sketch</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread cv_producer_consumer.cpp -o cv_producer_consumer
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;mutex&gt;
#include &lt;condition_variable&gt;
#include &lt;queue&gt;

std::mutex m;
std::condition_variable cv;
std::queue&lt;int&gt; q;
bool done = false;

void producer() {
    for (int i = 0; i &lt; 10; ++i) {
        {
            std::lock_guard&lt;std::mutex&gt; lk(m);
            q.push(i);
        }
        cv.notify_one();
    }
    {
        std::lock_guard&lt;std::mutex&gt; lk(m);
        done = true;
    }
    cv.notify_one();
}

void consumer() {
    while (true) {
        std::unique_lock&lt;std::mutex&gt; lk(m);
        cv.wait(lk, []{ return !q.empty() || done; });
        if (q.empty() &amp;&amp; done) break;
        int v = q.front();
        q.pop();
        lk.unlock();
        std::cout &lt;&lt; &quot;got &quot; &lt;&lt; v &lt;&lt; &quot;\\n&quot;;
    }
}

int main() {
    std::thread p(producer), c(consumer);
    p.join();
    c.join();
    return 0;
}
</code></pre>
<p>The consumer waits until <code>!q.empty() || done</code> — the predicate covers both &ldquo;data
available&rdquo; and &ldquo;clean shutdown.&rdquo; Full producer–consumer design is Part 4.2.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> <code>wait</code> compiles to: unlock mutex → <code>futex_wait</code> (sleep) →
on wakeup, compete for mutex again. <code>notify</code> marks waiters runnable; they don&rsquo;t
run until they re-acquire the lock.</p>
</blockquote>
<p><strong>Trade-offs ▸</strong> Condition variables are efficient for &ldquo;wait until event&rdquo; but
require careful pairing with mutex + predicate. Alternatives: semaphores (Part 2.6),
polling atomics (Part 3), or blocking queues in libraries.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>A condition variable blocks until shared state satisfies a predicate, in
  cooperation with a mutex.</p>
</li>
<li>
<p>Always use <code>wait(lock, predicate)</code> — handles spurious wakeups and forces
  re-check after every wake.</p>
</li>
<li>
<p>Update shared state under the lock <strong>before</strong> <code>notify_one</code> / <code>notify_all</code>.</p>
</li>
<li><code>unique_lock&lt;mutex&gt;</code> is required; <code>condition_variable_any</code> generalizes locks.</li>
<li><code>wait_for</code> / <code>wait_until</code> add timeouts with the same predicate rules.</li>
<li>Producer–consumer is the canonical pattern; lost wakeups happen when you skip
  the lock/predicate discipline (Part 5.6).</li>
</ul>

<p>Threads give you parallel <strong>execution</strong>. <strong>Futures</strong> give you parallel <strong>results</strong>:
a typed channel to retrieve a value (or exception) computed elsewhere, without
manual mutex/condition-variable wiring. The trio — <code>std::async</code>, <code>std::promise</code>,
<code>std::packaged_task</code> — covers most &ldquo;run this, give me that&rdquo; patterns.</p>
<hr />
<h2 id="241-the-futurepromise-model">2.4.1 The future/promise model</h2>
<p><img alt="Future and async execution paths" src="figures/future-async.svg" /></p>
<pre><code>   async world                         your thread
   ───────────                         ───────────
   std::promise ──shared state──▶ std::future
        │                              │
   set_value(v)                    get() blocks
   set_exception(e)                rethrows e
        │                              │
        └──── one-shot channel ────────┘
              (get() consumes it)
</code></pre>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;future&gt;</code>
<code>cpp
template&lt;class T&gt; class future {
    T get();                          // blocks; move-only result; ONE call
    void wait();
    bool valid() const;
    // wait_for, wait_until...
};
template&lt;class T&gt; class promise {
    void set_value(/* T or void */);
    void set_exception(std::exception_ptr p);
    future&lt;T&gt; get_future();
};</code>
<code>promise</code> is the <strong>sender</strong>; <code>future</code> is the <strong>receiver</strong>. They share an internal
reference-counted state. <code>get_future()</code> may be called once per promise.</p>
<p><strong>Rule ▸</strong> <code>future::get()</code> may be called <strong>once</strong>. It blocks until the result
is ready, then <strong>moves</strong> the value out (or rethrows the stored exception).</p>
</blockquote>
<hr />
<h2 id="242-stdasync--fire-and-forget-almost">2.4.2 std::async — fire and forget (almost)</h2>
<blockquote>
<p><strong>The API ▸</strong>
\`\`\`cpp
template<class F, class... Args>
future<invoke_result_t\\<F, Args...>>
async(launch policy, F&amp;&amp; f, Args&amp;&amp;&hellip; args);</p>
<p>enum class launch { async, deferred };
<code>\`\`</code>async(launch::async, f, args&hellip;)<code>— runs</code>f<code>on a **new thread** (implementation
may pool). Returns a</code>future<code>for the result.</code>async(launch::deferred, f, args&hellip;)<code>— **lazy**:</code>f<code>runs on the thread that
first calls</code>wait()<code>or</code>get()\` on the future.</p>
</blockquote>
<p>The default policy is <code>launch::async | launch::deferred</code> — the implementation
<strong>chooses</strong>:</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Default <code>std::async(f)</code> may run <strong>deferred</strong> — no parallelism,
surprise latency on <code>get()</code>, and the callable runs on the <strong>calling</strong> thread.
For real background work, pass <code>launch::async</code> explicitly:
<code>cpp
auto fut = std::async(std::launch::async, heavy_work, arg);</code></p>
<p><strong>Pitfall ▸</strong> Destroying a <code>std::future</code> returned from <code>std::async</code> with
default policy <strong>blocks</strong> until the async work completes — like an implicit
join. This can deadlock if the async task tries to touch objects being
destroyed. Keep the <code>future</code> alive until you&rsquo;re done, or use <code>launch::deferred</code>
knowingly.</p>
</blockquote>
<hr />
<h2 id="243-exceptions-cross-the-boundary-via-futures">2.4.3 Exceptions cross the boundary via futures</h2>
<p>Unlike raw <code>std::thread</code> (Part 2.1), exceptions in an <code>async</code> task or
<code>packaged_task</code> are stored and <strong>rethrown</strong> from <code>future::get()</code>:</p>
<pre><code class="language-cpp">auto fut = std::async(std::launch::async, []{
    throw std::runtime_error(&quot;boom&quot;);
});
try {
    fut.get();
} catch (const std::exception&amp; e) {
    // &quot;boom&quot; — propagated
}
</code></pre>
<p>This is the idiomatic way to surface errors from background work.</p>
<hr />
<h2 id="244-stdpackaged_task">2.4.4 std::packaged_task</h2>
<blockquote>
<p><strong>The API ▸</strong>
<code>cpp
template&lt;class Sig&gt; class packaged_task;  // Sig = R(Args...)
packaged_task(F&amp;&amp; f);
future&lt;R&gt; get_future();
void operator()(Args... args);   // run the task; result → future</code>
Wraps any callable in a <code>future</code>-backed task. Useful with thread pools: the pool
runs <code>task()</code>, you keep the <code>future</code>:</p>
</blockquote>
<pre><code class="language-cpp">std::packaged_task&lt;int()&gt; task([]{ return 42; });
std::future&lt;int&gt; fut = task.get_future();
std::thread t(std::move(task));   // run task in thread
std::cout &lt;&lt; fut.get() &lt;&lt; &quot;\\n&quot;;
t.join();
</code></pre>
<hr />
<h2 id="245-stdshared_future--many-getters">2.4.5 std::shared_future — many getters</h2>
<p><code>future</code> is move-only; only one owner may <code>get()</code>. <code>shared_future</code> copies the
shared state — multiple threads can wait and read the same result:</p>
<blockquote>
<p><strong>The API ▸</strong>
<code>cpp
template&lt;class T&gt; class shared_future {
    const T&amp; get() const;   // reference to stored value — not moved out
};
shared_future&lt;T&gt; fut2 = fut.share();  // from future&lt;T&gt;</code></p>
</blockquote>
<p>Use when several threads need the same async outcome (e.g. broadcast config load).</p>
<hr />
<h2 id="246-example-parallel-map-with-async">2.4.6 Example: parallel map with async</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread futures_demo.cpp -o futures_demo
#include &lt;iostream&gt;
#include &lt;future&gt;
#include &lt;vector&gt;
#include &lt;numeric&gt;

long long heavy(int i) {
    long long s = 0;
    for (int j = 0; j &lt; 1'000'000; ++j) s += (i + j);
    return s;
}

int main() {
    std::vector&lt;std::future&lt;long long&gt;&gt; futs;
    for (int i = 0; i &lt; 8; ++i)
        futs.push_back(std::async(std::launch::async, heavy, i));

    long long total = 0;
    for (auto&amp; f : futs)
        total += f.get();   // blocks per future; could use wait_all pattern

    std::cout &lt;&lt; &quot;total = &quot; &lt;&lt; total &lt;&lt; &quot;\\n&quot;;
    return 0;
}
</code></pre>
<p>For many small tasks, a thread pool (Part 4.1) amortizes thread creation cost;
<code>std::async</code> spawns (or reuses) per call — fine for coarse-grained work.</p>
<p><strong>Trade-offs ▸</strong> Futures simplify result plumbing but hide scheduling policy.
Promises allow manual fulfillment (callbacks, thread pools) but require discipline:
don&rsquo;t forget to set value/exception, don&rsquo;t set twice, and keep the <code>promise</code> alive
until the <code>future</code> side consumes it.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p><code>promise</code> sets value/exception; <code>future::get()</code> blocks once and retrieves or
  rethrows.</p>
</li>
<li>
<p><code>std::async(launch::async, ...)</code> for real parallelism; default policy may defer.</p>
</li>
<li>Destroying an async <code>future</code> can block — keep it alive or choose policy explicitly.</li>
<li><code>packaged_task</code> decouples &ldquo;work object&rdquo; from &ldquo;thread that runs it.&rdquo;</li>
<li><code>shared_future</code> allows multiple getters; <code>future</code> is single-consumer.</li>
<li>Futures are how exceptions legally cross thread boundaries in C++.</li>
</ul>

<p>Not every shared-state problem is a counter or a queue. Two recurring needs are:
<strong>(1)</strong> run expensive initialization exactly once, safely, from many threads;
<strong>(2)</strong> give each thread its <strong>own</strong> copy of data without locking. C++11 provides
<code>std::call_once</code> and <code>thread_local</code> for exactly that.</p>
<hr />
<h2 id="251-stdcall_once--one-time-init">2.5.1 std::call_once — one-time init</h2>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;mutex&gt;</code>
<code>cpp
struct once_flag {};
template&lt;class Callable, class... Args&gt;
void call_once(once_flag&amp; flag, Callable&amp;&amp; f, Args&amp;&amp;... args);</code>
Calls <code>f(args...)</code> <strong>exactly once</strong>, no matter how many threads invoke
<code>call_once</code> concurrently. Subsequent calls are no-ops. Synchronizes with the
first completion — threads returning from <code>call_once</code> see fully initialized
side effects.</p>
</blockquote>
<pre><code>   thread A ── call_once(flag, init) ──┐
   thread B ── call_once(flag, init) ──┼──▶ exactly ONE runs init()
   thread C ── call_once(flag, init) ──┘    others block until done
</code></pre>
<p>Typical singleton:</p>
<pre><code class="language-cpp">std::once_flag init_flag;
std::unique_ptr&lt;Database&gt; db;

void ensure_db() {
    std::call_once(init_flag, []{
        db = std::make_unique&lt;Database&gt;(&quot;connection string&quot;);
    });
}
</code></pre>
<p>All threads calling <code>ensure_db()</code> get a fully constructed <code>db</code> with no data race
on the init path.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> Implementations use a fast path (atomic check) plus a
slow path (mutex or futex) for the first caller. You get correct publication
without hand-rolled double-checked locking.</p>
</blockquote>
<hr />
<h2 id="252-why-not-hand-roll-double-checked-locking">2.5.2 Why not hand-roll double-checked locking?</h2>
<p>The broken pattern (Part 4.7):</p>
<pre><code class="language-cpp">// ✗ DO NOT — data race + reordering bugs
if (!ptr) {
    lock(m);
    if (!ptr) ptr = new Thing;
    unlock(m);
}
</code></pre>
<p>Even with two checks, unsynchronized reads of <code>ptr</code> race with the writer, and
reordering can publish a pointer before the object is visible. <code>call_once</code> and
magic statics fix this at the language/library level.</p>
<blockquote>
<p><strong>Rule ▸</strong> Use <code>std::call_once</code> or function-local statics for lazy one-time
init. Do not invent your own double-checked locking unless you are implementing
low-level atomics with explicit <code>memory_order</code> (Part 3.3–3.4).</p>
</blockquote>
<p><strong>Trade-offs ▸</strong> <code>call_once</code> has small overhead on every call (atomic check).
For init that truly runs once at startup, a static initializer or <code>main()</code> before
threads spawn is simpler.</p>
<hr />
<h2 id="253-magic-statics-function-local-statics">2.5.3 Magic statics (function-local statics)</h2>
<p>Since C++11, initialization of a <strong>function-local static</strong> is thread-safe:</p>
<pre><code class="language-cpp">Database&amp; get_db() {
    static Database instance(&quot;connection string&quot;);  // thread-safe once
    return instance;
}
</code></pre>
<p>The compiler emits guard variables (often <code>call_once</code> under the hood). First caller
initializes; concurrent callers block until complete. Destruction happens at
program exit (reverse order of construction) — watch static deinitialization order
if background threads outlive <code>main</code>.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Thread-safe <strong>initialization</strong> does not make the object itself
thread-safe. If <code>Database</code> methods mutate shared state, you still need mutexes
or immutability after init.</p>
</blockquote>
<hr />
<h2 id="254-thread_local--per-thread-storage">2.5.4 thread_local — per-thread storage</h2>
<blockquote>
<p><strong>The API ▸</strong> — keyword <code>thread_local</code> (storage class)
<code>cpp
thread_local int tls_counter = 0;</code>
Each thread gets a <strong>distinct</strong> instance with static storage duration (lifetime
= entire thread). No sharing → no data race on that variable.</p>
</blockquote>
<p>Recall Part 0.1: threads share heap/globals but have private stacks. <code>thread_local</code>
places data in a thread-specific area the runtime manages (like POSIX <code>pthread_key_t</code>,
Part 1.6):</p>
<pre><code>   thread A                    thread B
   tls_counter = 3             tls_counter = 7
   (same name, different       (no mutex needed —
    memory addresses)           no interaction)
</code></pre>
<p>Common uses:</p>
<ul>
<li>Per-thread caches, RNGs, arena allocators</li>
<li>Errno-style &ldquo;last error&rdquo; without locking</li>
<li>Thread IDs or request context in server worker threads</li>
</ul>
<pre><code class="language-cpp">thread_local std::string log_prefix;

void worker(int id) {
    log_prefix = &quot;worker-&quot; + std::to_string(id);
    // all logging in this thread sees its prefix
}
</code></pre>
<hr />
<h2 id="255-per-thread-singleton-pattern">2.5.5 Per-thread singleton pattern</h2>
<p>Combine <code>thread_local</code> with lazy init for &ldquo;one X per thread&rdquo;:</p>
<pre><code class="language-cpp">struct PerThreadBuffer {
    std::vector&lt;char&gt; buf;
    PerThreadBuffer() { buf.reserve(4096); }
};

PerThreadBuffer&amp; thread_buffer() {
    thread_local PerThreadBuffer instance;
    return instance;
}
</code></pre>
<p>Each thread&rsquo;s first call constructs its buffer; subsequent calls are free. This
eliminates false sharing on hot counters (Part 5.4) when you aggregate at the end.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> <code>thread_local</code> destructors run at <strong>thread exit</strong>. If thread A&rsquo;s
destructor touches state already torn down by thread B or by static destruction
order, you get subtle crashes. Keep TLS destructors simple.</p>
</blockquote>
<hr />
<h2 id="256-example-call_once--thread_local">2.5.6 Example: call_once + thread_local</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread once_tls_demo.cpp -o once_tls_demo
#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;mutex&gt;
#include &lt;vector&gt;
#include &lt;atomic&gt;

std::once_flag config_once;
int shared_config = 0;

void init_config() {
    std::call_once(config_once, []{
        shared_config = 42;   // expensive read simulated
        std::cout &lt;&lt; &quot;config initialized once\\n&quot;;
    });
}

thread_local int hits = 0;

void worker() {
    init_config();
    ++hits;
    std::cout &lt;&lt; &quot;thread &quot; &lt;&lt; std::this_thread::get_id()
              &lt;&lt; &quot; hits=&quot; &lt;&lt; hits &lt;&lt; &quot; config=&quot; &lt;&lt; shared_config &lt;&lt; &quot;\\n&quot;;
}

int main() {
    std::vector&lt;std::thread&gt; ts;
    for (int i = 0; i &lt; 4; ++i)
        ts.emplace_back(worker);
    for (auto&amp; t : ts) t.join();
    return 0;
}
</code></pre>
<p><code>shared_config</code> is written once under <code>call_once</code> — safe. <code>hits</code> is per-thread —
no synchronization needed.</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p><code>std::call_once</code> + <code>once_flag</code> runs initialization exactly once, with proper
  synchronization — prefer over hand-rolled double-checked locking.</p>
</li>
<li>
<p>Function-local <code>static</code> objects have thread-safe one-time init since C++11.</p>
</li>
<li><code>thread_local</code> gives each thread its own instance — no races on that variable.</li>
<li>Magic statics init safely; they don&rsquo;t make the object thread-safe for mutation.</li>
<li>TLS destructors run at thread exit — mind lifetime with shutdown.</li>
</ul>

  { name: `17. Cpp Threads / Cpp20 Concurrency`, path: `02-cpp-threads/06-cpp20-concurrency.md`, dir: `02-cpp-threads`, words: 908, mins: 5, body: `<h1 id="26--c20-concurrency">2.6 — C++20 Concurrency</h1>
<p>C++20 filled gaps that engineers had been patching with third-party libraries or
raw pthread patterns: a thread that <strong>always joins</strong>, cooperative <strong>cancellation</strong>,
and standard <strong>latch</strong>, <strong>barrier</strong>, and <strong>semaphore</strong> types. This chapter covers
the <code>&lt;thread&gt;</code> / <code>&lt;stop_token&gt;</code> / <code>&lt;latch&gt;</code> / <code>&lt;barrier&gt;</code> / <code>&lt;semaphore&gt;</code> additions
and <code>atomic::wait</code> / <code>notify</code>.</p>
<p>Build with <strong>C++20</strong>: <code>g++ -std=c++20 -pthread</code>.</p>
<hr />
<h2 id="261-stdjthread--raii--cancellation">2.6.1 std::jthread — RAII + cancellation</h2>
<p><code>std::jthread</code> wraps <code>std::thread</code> with two fixes from Part 2.1:</p>
<pre><code>   std::thread destructor + joinable  →  std::terminate()
   std::jthread destructor            →  request_stop(); join();
</code></pre>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;thread&gt;</code>
<code>cpp
class jthread {
public:
    template&lt;class F, class... Args&gt;
    explicit jthread(F&amp;&amp; f, Args&amp;&amp;... args);
    ~jthread();                    // joins if joinable
    void join();
    void detach();                 // discouraged — loses stop coordination
    bool joinable() const;
    stop_source get_stop_source();
    stop_token get_stop_token() const;
};</code>
If the callable accepts <code>stop_token</code> as first parameter, the runtime injects
one tied to the <code>jthread</code>&rsquo;s internal <code>stop_source</code>.</p>
</blockquote>
<p>Cancellation is <strong>cooperative</strong> — nothing preempts your thread:</p>
<pre><code class="language-cpp">void work(std::stop_token st) {
    while (!st.stop_requested()) {
        // do chunk; check st periodically
    }
}
</code></pre>
<p>When the <code>jthread</code> is destroyed (or <code>request_stop()</code> is called on its source), waiters
see <code>stop_requested() == true</code>.</p>
<hr />
<h2 id="262-stop_token-stop_source-stop_callback">2.6.2 stop_token, stop_source, stop_callback</h2>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;stop_token&gt;</code>
<code>cpp
class stop_token {
    bool stop_requested() const noexcept;
    bool stop_possible() const noexcept;
};
class stop_source {
    void request_stop() noexcept;
    stop_token get_token() const;
};
template&lt;class Callback&gt;
class stop_callback { /* registers; unregisters on destroy */ };</code>
One <code>stop_source</code> fans out to many <code>stop_token</code>s. <code>stop_callback</code> runs your
functor when stop is requested — useful to unblock a blocking call:</p>
</blockquote>
<pre><code>   jthread dtor / request_stop()
              │
              ▼
   stop_source flag set
              │
      ┌───────┴───────┐
      ▼               ▼
   token in worker   stop_callback → cv.notify_all()
</code></pre>
<blockquote>
<p><strong>Rule ▸</strong> Cancellation is not forced. Long-running loops must poll
<code>stop_requested()</code> or register a callback. There is no POSIX-style cancel.</p>
</blockquote>
<hr />
<h2 id="263-stdlatch--single-use-countdown">2.6.3 std::latch — single-use countdown</h2>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;latch&gt;</code>
<code>cpp
class latch {
public:
    explicit latch(ptrdiff_t expected);
    void count_down(ptrdiff_t n = 1);
    bool try_wait() const noexcept;
    void wait() const;
    void arrive_and_wait(ptrdiff_t n = 1);
    static constexpr ptrdiff_t max() noexcept;
};</code>
A <strong>single-phase</strong> barrier: wait until the counter hits zero. <code>count_down</code>
decrements; <code>wait</code> blocks until zero. <strong>Not reusable</strong> — once released, done.</p>
</blockquote>
<p>Use case: &ldquo;main waits until N workers finish setup&rdquo;:</p>
<pre><code class="language-cpp">std::latch start_latch(1);
std::latch ready_latch(N);

// each worker:
ready_latch.count_down();   // signal ready
start_latch.wait();         // wait for go
// work...
</code></pre>
<p>Compare pthread barrier (Part 1.4) — <code>latch</code> is one-shot only.</p>
<hr />
<h2 id="264-stdbarrier--reusable-synchronization">2.6.4 std::barrier — reusable synchronization</h2>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;barrier&gt;</code>
<code>cpp
template&lt;class CompletionFunction = /* see standard */&gt;
class barrier {
public:
    explicit barrier(ptrdiff_t expected,
                     CompletionFunction completion = {});
    void arrive_and_drop();   // C++20; reduce count permanently
    ptrdiff_t arrive(ptrdiff_t update = 1);
    void wait();
};</code>
Threads <strong>arrive</strong> at phases; when <code>expected</code> arrivals complete a phase, the
<strong>completion function</strong> runs (serially, by one thread), then the barrier resets
for the next phase.</p>
</blockquote>
<pre><code>   phase 1:  [A][B][C] all arrive → completion() → phase 2
   phase 2:  [A][B][C] all arrive → completion() → phase 3
</code></pre>
<p>Ideal for iterative parallel algorithms (Jacobi, time-step loops) where all threads
must finish step <em>k</em> before any starts step <em>k+1</em>.</p>
<hr />
<h2 id="265-semaphores">2.6.5 Semaphores</h2>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;semaphore&gt;</code>
<code>cpp
template&lt;ptrdiff_t LeastMaxValue = /* impl-defined */&gt;
class counting_semaphore {
    explicit counting_semaphore(ptrdiff_t desired);
    void acquire();
    void release(ptrdiff_t update = 1);
    bool try_acquire() noexcept;
    // try_acquire_for, try_acquire_until...
};
using binary_semaphore = counting_semaphore&lt;1&gt;;</code>
A counter of permits: <code>acquire</code> decrements (blocks at 0); <code>release</code> increments.
<code>binary_semaphore</code> is mutex-like but can <strong>signal without holding</strong> the lock —
useful for producer–consumer (Part 4.2), unlike a mutex which must be unlocked
by the owner.</p>
</blockquote>
<p><strong>Trade-offs ▸</strong> Semaphores are flexible but easy to misuse (forgotten <code>release</code>,</p>
<blockquote>
<p>wrong initial count). Prefer mutex + CV when ownership semantics matter; prefer
semaphores for resource counting.</p>
</blockquote>
<hr />
<h2 id="266-atomicwait--notify">2.6.6 atomic::wait / notify</h2>
<p>C++20 adds blocking wait on atomics (futex-like):</p>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;atomic&gt;</code>
<code>cpp
void atomic&lt;T&gt;::wait(T old, memory_order order = memory_order::seq_cst) const;
void atomic&lt;T&gt;::notify_one();

indivisible operation on a single word — increment a counter, publish a flag,
swap a pointer. <strong><code>std::atomic&lt;T&gt;</code></strong> promises that concurrent read-modify-write

with <strong>no torn reads or writes</strong>. That is the foundation of lock-free code and
the memory model (Part 3.3–3.4).</p>

<h2 id="311-what-atomic-guarantees">3.1.1 What &ldquo;atomic&rdquo; guarantees</h2>
<p>Without atomics, <code>count++</code> on a shared <code>int</code> is three steps (load, add, store) —
another thread can interleave anywhere (Part 0.4):</p>
<pre><code>   thread A: LOAD count (=5)
   thread B: LOAD count (=5)   ADD 1   STORE 6
   thread A:            ADD 1   STORE 6   ← lost update (expected 7)
</code></pre>

<pre><code>   atomic fetch_add:  read old, write old+1 — no interleaving inside
</code></pre>
<blockquote>
<p><strong>Rule ▸</strong> Atomicity ≠ full synchronization of arbitrary data structures. It
applies to <strong>one atomic object at a time</strong>. Publishing a struct still needs
release/acquire or a mutex (Part 3.3).</p>
</blockquote>
<hr />
<h2 id="312-stdatomic">3.1.2 std::atomic<T></h2>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;atomic&gt;</code>
<code>cpp

explicit atomic(T desired);
T load(memory_order order = memory_order_seq_cst) const noexcept;
void store(T desired, memory_order order = memory_order_seq_cst) noexcept;
T exchange(T desired, memory_order order = memory_order_seq_cst) noexcept;
bool compare_exchange_weak/strong(T&amp; expected, T desired, ...);

</blockquote>

<code>desired</code> atomically.</p>

stall: at least one operation completes in a finite number of steps. <strong>Wait-free</strong>
is stronger — every thread finishes in bounded steps. Most production &ldquo;lock-free&rdquo;

harder than it looks (ABA, reclamation).</p>

<blockquote>
<p><strong>The API ▸</strong>
<code>cpp

bool compare_exchange_strong(T&amp; expected, T desired, ...);</code>

</blockquote>
<table>
<thead>
<tr>
<th></th>
<th>weak</th>
<th>strong</th>
</tr>
</thead>
<tbody>
<tr>
<td>Spurious failure</td>
<td>yes — may fail when value == expected</td>
<td>no</td>
</tr>
<tr>
<td>Use in loop</td>
<td>preferred — may be faster on ARM</td>
<td>OK but no benefit</td>
</tr>
<tr>

<pre><code>   CAS loop (weak):

<pre><code>   1. READ  current state (relaxed or acquire)
   2. COMPUTE new state from current

#include &lt;vector&gt;

<p>Atomicity stops torn reads on <strong>one word</strong>. It does <strong>not</strong> tell you when writes
to <strong>other</strong> memory become visible. The C++ <strong>memory model</strong> is the contract between
your code, the compiler, and the CPU about which reorderings are allowed and which
<strong>happens-before</strong> edges make concurrent programs well-defined.</p>

optimizer can reorder anyway (Part 3.5).</p>

<h2 id="331-why-a-memory-model-exists">3.3.1 Why a memory model exists</h2>
<p>Two adversaries reorder your program:</p>
<pre><code>   COMPILER                    CPU
   ────────                    ───
   hoist loads early           store buffer delays stores
   sink stores late            out-of-order execution
   eliminate &quot;redundant&quot; ops    LoadLoad, StoreStore, LoadStore, StoreLoad
</code></pre>

machine. <strong>Multi-threaded</strong> programs need explicit <strong>synchronizes-with</strong> edges so
threads agree on which writes they see (Part 0.4&rsquo;s data races become defined behavior
when synchronized).</p>

   release store on atomic X  ──synchronizes-with──▶  acquire load of X

   writes before release      ──happens-before──▶     reads after acquire
</code></pre>

  order where required).
- <strong>synchronizes-with</strong>: a release operation on an atomic <strong>pairs</strong> with an acquire
  load that reads the stored value (or RMW acq_rel).
- <strong>happens-before</strong>: transitive closure of sequenced-before + synchronizes-with +

<p>If action A happens-before B, B observes A&rsquo;s side effects (for non-racy non-atomic

in doubt, <code>mutex</code> or default <code>seq_cst</code> atomics — optimize orders later with proof

<hr />

<ul>

<p>Every <code>load</code>, <code>store</code>, and RMW on <code>std::atomic</code> takes a <strong><code>memory_order</code></strong>. The
order controls <strong>which</strong> other memory operations may be reordered across the atomic
and <strong>what</strong> synchronizes-with edges you get. Default is <code>memory_order_seq_cst</code> —
safest, often slowest. Expert concurrency means picking the <strong>weakest order that
still proves correct</strong>.</p>
<hr />
<h2 id="341-the-six-orders-and-one-deprecated">3.4.1 The six orders (and one deprecated)</h2>
<p><img alt="Memory order strength ladder" src="figures/memory-orders.svg" /></p>
<pre><code>   STRONGEST ─────────────────────────────────────────▶ WEAKEST
   seq_cst    acq_rel (RMW only)    acquire / release    relaxed
      │              │                    │                  │
   total global   RMW both dirs      one-way sync      atomicity only
   order          read+write edge    publish OR         no cross-thread
                                       consume            ordering
</code></pre>
<blockquote>
<p><strong>The API ▸</strong> — <code>&lt;atomic&gt;</code>
<code>cpp
enum class memory_order {
    relaxed, consume, acquire, release, acq_rel, seq_cst
};</code></p>
</blockquote>
<table>
<thead>
<tr>
<th>Order</th>
<th>Typical use</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>seq_cst</code></td>
<td>Default; reasoning is easiest</td>
</tr>
<tr>
<td><code>acquire</code></td>
<td>Loads that <strong>receive</strong> published data</td>
</tr>
<tr>
<td><code>release</code></td>
<td>Stores that <strong>publish</strong> data</td>
</tr>
<tr>
<td><code>acq_rel</code></td>
<td>RMW that both publishes and observes (CAS, <code>fetch_add</code> with ordering)</td>
</tr>
<tr>
<td><code>relaxed</code></td>
<td>Counters, stats — no ordering of other memory</td>
</tr>
<tr>
<td><code>consume</code></td>
<td><strong>Discouraged</strong> — rarely implemented; use <code>acquire</code></td>
</tr>
</tbody>
</table>
<hr />
<h2 id="342-memory_order_seq_cst">3.4.2 memory_order_seq_cst</h2>
<p>Single <strong>total order</strong> on all <code>seq_cst</code> operations — all threads agree on one global
timeline:</p>
<pre><code>   thread A: seq_cst store X=1; seq_cst store Y=1
   thread B: seq_cst load Y; seq_cst load X
   // impossible: see Y==1 and X==0 (with no other writers)
</code></pre>
<blockquote>
<p><strong>Trade-offs ▸</strong> Easiest mental model — &ldquo;just works&rdquo; for small programs. On weak
ISAs, <code>seq_cst</code> may emit fences on every operation → measurable cost on hot paths.</p>
</blockquote>
<p>Use <code>seq_cst</code> until profiling and proof justify weakening.</p>
<hr />
<h2 id="343-acquire-and-release--one-directional-sync">3.4.3 acquire and release — one-directional sync</h2>
<p><strong>Release</strong> (store/RMW success side): prior <strong>ordinary</strong> writes in this thread cannot
be reordered <strong>after</strong> the release.</p>
<p><strong>Acquire</strong> (load/RMW success side): subsequent <strong>ordinary</strong> reads in this thread
cannot be reordered <strong>before</strong> the acquire.</p>
<pre><code>   producer:  data = x;  flag.store(1, release);
   consumer:  if (flag.load(acquire)) use(data);
</code></pre>
<p>Pair forms <strong>synchronizes-with</strong> (Part 3.3). No global total order required between
unrelated atomics — cheaper than <code>seq_cst</code>.</p>
<blockquote>
<p><strong>Rule ▸</strong> Release on the publisher, acquire on the consumer, for every handoff
of non-atomic data.</p>
</blockquote>
<hr />
<h2 id="344-acq_rel--for-read-modify-write">3.4.4 acq_rel — for read-modify-write</h2>
<p>CAS and <code>fetch_add</code> both read and write:</p>
<pre><code class="language-cpp">head.compare_exchange_weak(old, new,
    std::memory_order_acq_rel,   // success
    std::memory_order_acquire);  // failure (still need to see current head)
</code></pre>
<p>Success: release prior writes + acquire subsequent reads. Failure load side often
uses <code>acquire</code> or <code>relaxed</code> depending on loop logic (Treiber stack, Part 3.2).</p>
<hr />
<h2 id="345-relaxed--atomicity-only">3.4.5 relaxed — atomicity only</h2>
<pre><code class="language-cpp">stats.fetch_add(1, std::memory_order_relaxed);
</code></pre>
<p>Guarantees no torn RMW on <code>stats</code>. <strong>Does not</strong> order other memory. Safe for
monotonic counters where no other data is published through the counter.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Using <code>relaxed</code> on a flag that guards visibility of non-atomic
payload — classic bug. Relaxed is for &ldquo;this word alone matters.&rdquo;</p>
</blockquote>
<hr />
<h2 id="346-consume--why-its-discouraged">3.4.6 consume — why it&rsquo;s discouraged</h2>
<p><code>memory_order_consume</code> was meant to allow <strong>dependency-ordered</strong> reads (pointer
chains) without full acquire cost. Implementations largely treat it as <code>acquire</code>;
the standard marked it deprecated. <strong>Use <code>acquire</code></strong> on pointer loads that start
a dependent read chain.</p>
<hr />
<h2 id="347-decision-guide">3.4.7 Decision guide</h2>
<pre><code>   Q: Does another thread read non-atomic data you wrote?
      YES → release (you) + acquire (them) on a flag/pointer
      NO  → continue

   Q: Is it a pure statistic / counter with no linked data?
      YES → relaxed on the counter
      NO  → continue

   Q: Do you need global ordering across several atomics?
      YES → seq_cst (or careful proof with acq/rel)
      NO  → acquire/release on handoff atomics only

   Q: Unsure?
      → seq_cst or mutex
</code></pre>
<p><strong>Cost ladder</strong> (typical weak ISA):</p>
<pre><code>   relaxed  &lt;  acquire/release  &lt;  seq_cst  ≈  mutex (for single ops; mutex worse under contention)
</code></pre>
<p>On x86, many orders collapse in hardware (Part 3.5) — still respect the C++ rules;
ARM/POWER do not forgive sloppy orders.</p>
<hr />
<h2 id="348-example-three-counters-three-orders">3.4.8 Example: three counters, three orders</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread memory_orders.cpp -o memory_orders
#include &lt;atomic&gt;
#include &lt;thread&gt;
#include &lt;iostream&gt;

std::atomic&lt;int&gt; relaxed_cnt{0};
std::atomic&lt;int&gt; seq_cnt{0};
std::atomic&lt;bool&gt; done{false};

void worker() {
    for (int i = 0; i &lt; 100'000; ++i) {
        relaxed_cnt.fetch_add(1, std::memory_order_relaxed);
        seq_cnt.fetch_add(1, std::memory_order_seq_cst);
    }
    done.store(true, std::memory_order_release);
}

int main() {
    std::thread a(worker), b(worker);
    a.join(); b.join();
    while (!done.load(std::memory_order_acquire)) { }
    std::cout &lt;&lt; &quot;relaxed=&quot; &lt;&lt; relaxed_cnt.load(std::memory_order_relaxed)
              &lt;&lt; &quot; seq_cst=&quot; &lt;&lt; seq_cnt.load(std::memory_order_relaxed)
              &lt;&lt; &quot; (both expected 200000)\\n&quot;;
    return 0;
}
</code></pre>
<p>Both counters are exact — only atomicity needed. <code>done</code> uses release/acquire so
main doesn&rsquo;t print early (pedantic here since <code>join</code> already synchronizes).</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>Six orders; default <code>seq_cst</code> is strongest and simplest.</li>
<li><code>release</code>/<code>acquire</code> pair for publishing non-atomic data safely.</li>
<li><code>acq_rel</code> for RMW; <code>relaxed</code> for standalone counters/stats.</li>
<li>Avoid <code>consume</code> — use <code>acquire</code>.</li>
<li>Weaken orders only with a happens-before proof; when unsure, stay strong.</li>
<li>Hardware cost varies by ISA — Part 3.5 covers fences and TSO vs weak models.</li>
</ul>

<p>Memory orders on atomics tell the compiler and CPU how an <strong>atomic operation</strong> relates
to surrounding memory. Sometimes you need a <strong>standalone fence</strong> — ordering without
an associated load/store on a particular object — or you need to understand <strong>why</strong>
StoreLoad reordering breaks naive synchronization. This chapter maps the four
hardware reorderings, <code>atomic_thread_fence</code>, and x86 vs ARM differences.</p>
<hr />
<h2 id="351-the-four-reorderings">3.5.1 The four reorderings</h2>
<p>For two ordinary operations A then B in program order, the CPU/compiler may reorder:</p>
<pre><code>   LoadLoad    (LL):  r1; r2;     — often reordered on weak ISAs
   LoadStore   (LS):  r1; w2;    — often reordered
   StoreStore  (SS):  w1; w2;    — often reordered on weak ISAs
   StoreLoad   (SL):  w1; r2;    — the surprising one
</code></pre>
<p><img alt="StoreLoad reordering via store buffer" src="figures/store-load-reorder.svg" /></p>
<p><strong>StoreLoad</strong> is special: even <strong>x86</strong> (TSO) allows it via the <strong>store buffer</strong>:</p>
<pre><code>   thread A                    thread B
   ────────                    ────────
   x = 1;                      y = 1;
   r1 = y;   (may see 0)        r2 = x;   (may see 0)
   // both r1==0 and r2==0 possible without proper sync!
</code></pre>
<p>Each core buffers stores before they drain to cache/coherence. A load can execute
before an earlier store to a <strong>different</strong> address becomes globally visible.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> x86 gives strong <strong>Total Store Order</strong> for same-thread
visibility rules, but StoreLoad still bites without fences or locked instructions.
ARM and POWER are <strong>weak</strong> — all four reorderings are fair game unless constrained.</p>
</blockquote>

<p>Classic mutual exclusion without atomics fails because of StoreLoad:</p>
<pre><code class="language-cpp">// Illustrative broken Dekker — DO NOT USE
// g++ -std=c++17 -pthread dekker_broken.cpp -o dekker_broken
#include &lt;atomic&gt;
#include &lt;thread&gt;
#include &lt;iostream&gt;

std::atomic&lt;bool&gt; flag_a{false}, flag_b{false};
int turn = 0;   // intentionally non-atomic for illustration of races

void thread_a() {
    flag_a.store(true, std::memory_order_relaxed);
    while (flag_b.load(std::memory_order_relaxed)) {
        if (turn != 0) {
            flag_a.store(false, std::memory_order_relaxed);
            while (flag_b.load(std::memory_order_relaxed)) { }
            flag_a.store(true, std::memory_order_relaxed);
        }
    }

        if (turn != 1) {

            while (flag_a.load(std::memory_order_relaxed)) { }

<h2 id="353-stdatomic_thread_fence">3.5.3 std::atomic_thread_fence</h2>
<blockquote>
<p><strong>The API ▸</strong>
<code>cpp

<pre><code>   release fence:  all prior writes  ──▶  ordered before  ──▶  subsequent atomics

<h2 id="354-when-fences-vs-atomic-orders">3.5.4 When fences vs atomic orders</h2>

<h2 id="355-x86-tso-vs-armpower-weak">3.5.5 x86 (TSO) vs ARM/POWER (weak)</h2>

<p><strong>Under the hood ▸</strong> <code>memory_order_seq_cst</code> load/store on x86 often uses <code>mov</code>

</blockquote>
<hr />
<h2 id="356-storeload-example-with-fences">3.5.6 StoreLoad example with fences</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread store_load_fence.cpp -o store_load_fence

#include &lt;thread&gt;

<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>Four reordering classes: LL, LS, SS, SL — StoreLoad bites via store buffers.</li>
<li>x86 is TSO-strong but not sequentially consistent for racy plain accesses.</li>
<li>ARM/POWER need explicit ordering — portable code uses C++ memory orders.</li>

<li>Dekker and similar protocols expose why naive flag spinning fails — use mutexes
  or proven lock-free algorithms.</li>
</ul>

<p>Spawning a <code>std::thread</code> per task is simple — and wrong for most production
workloads. Part 0.1 showed that thread creation costs tens of microseconds and
allocates a large stack. A <strong>thread pool</strong> keeps a fixed set of <strong>worker
threads</strong> alive, feeding them work from a <strong>shared task queue</strong>. Submitting a
task becomes a cheap enqueue + notify; you amortize creation cost and <strong>bound
concurrency</strong> to a known number of cores.</p>
<p><img alt="Thread pool: submitters enqueue tasks; workers dequeue and run" src="figures/thread-pool.svg" /></p>
<pre><code>   submitters (any thread)                worker threads (fixed N)
         │                                       │
         │  enqueue std::function&lt;void()&gt;      │
         ▼                                       ▼
   ┌─────────────────────────────────────────────────────┐
   │  task queue  ◀── mutex + condition_variable ──▶     │
   └─────────────────────────────────────────────────────┘
         │         pop when non-empty / not stopping
         └──────▶ worker runs job() outside the lock
</code></pre>
<p>This is the default architecture behind HTTP servers, game engines, and most
<code>std::async</code>-style runtimes. Part 4.6 extends it with per-worker queues and
work-stealing; Part 4.2 supplies the bounded queue variant when you need
back-pressure on submit.</p>
<hr />
<h2 id="411-why-pool-instead-of-per-task-threads">4.1.1 Why pool instead of per-task threads</h2>
<pre><code>   per-task thread model:
      task arrives → pthread_create / std::thread → run → join
      1000 tasks/sec → 1000 creates + 1000 joins → scheduler thrash

   pool model:
      startup: create N workers once
      each task: lock → push to queue → notify_one → return
      workers: wait → pop → unlock → execute → repeat
</code></pre>
<p><strong>Trade-offs ▸</strong> A pool wins when tasks are <strong>short</strong>, <strong>numerous</strong>, and
<strong>similar in cost</strong>. It loses when tasks are long-running and heterogeneous —
you may need dynamic sizing, priority queues, or cancellation (C++20
<code>stop_token</code>, Part 2.6). It also does not help CPU-bound work that exceeds
<code>hardware_concurrency()</code> unless you accept oversubscription and context-switch
overhead.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> Each worker is an ordinary kernel task (Part 0.3). The
pool does not pin threads to cores unless you call <code>pthread_setaffinity_np</code>
or platform equivalents. On a 4-core machine with an 8-thread pool, the OS
time-slices eight runnable workers — you get parallelism up to four cores and
contention for the queue mutex on top.</p>
</blockquote>
<hr />
<h2 id="412-the-core-design">4.1.2 The core design</h2>
<p>Four pieces, always the same shape:</p>
<pre><code>   1. std::vector&lt;std::thread&gt; workers_
   2. std::queue&lt;std::function&lt;void()&gt;&gt; tasks_
   3. std::mutex mu_  +  std::condition_variable cv_
   4. bool stop_  (or std::atomic&lt;bool&gt;)
</code></pre>
<p>Worker loop (the heart of every pool):</p>
<pre><code>   loop forever:

       job = move(tasks_.front()); pop
       unlock mu_

</code></pre>
<blockquote>
<p><strong>Rule ▸</strong> Never execute a task while holding the queue mutex. A slow or
blocking task under the lock serializes every other worker and can deadlock
if the task itself tries to submit work to the same pool.</p>
<p><strong>The API ▸</strong> Submit side: wrap the callable in a
<code>std::packaged_task&lt;R()&gt;</code> (Part 2.4), push a lambda that invokes it onto the
queue, return <code>pkg-&gt;get_future()</code>. Callers block on <code>future::get()</code> without
holding any pool lock.</p>
</blockquote>
<hr />
<h2 id="413-submitting-tasks-and-returning-futures">4.1.3 Submitting tasks and returning futures</h2>
<p><code>std::function&lt;void()&gt;</code> erases type but cannot propagate return values. The
standard pattern pairs it with <code>std::packaged_task</code>:</p>
<pre><code>   submit(f, args...):
       pkg = make_shared&lt;packaged_task&lt;R()&gt;&gt;(
           bind f with args into nullary callable)
       fut = pkg-&gt;get_future()
       lock mu_
       tasks_.push([pkg]{ (*pkg)(); })
       unlock; cv_.notify_one()
       return fut
</code></pre>
<p><code>notify_one()</code> wakes <strong>one</strong> sleeping worker — enough when each task is
independent. Use <code>notify_all()</code> only when every worker must re-check state
(e.g. shutdown).</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Capturing a <code>packaged_task</code> by reference in the queue lambda
is a use-after-free once <code>submit()</code> returns. Capture a <code>shared_ptr</code> to the
task, as in the example below.</p>
</blockquote>
<hr />
<h2 id="414-graceful-shutdown">4.1.4 Graceful shutdown</h2>
<p>Destruction order matters:</p>
<pre><code>   1. lock mu_;  stop_ = true;  unlock
   2. cv_.notify_all()          // wake every worker blocked on empty queue
   3. join every worker thread
</code></pre>
<p>Workers that wake with <code>stop_ == true</code> and an empty queue <strong>exit</strong>. Workers
mid-task finish the current job before checking again — pending work drains
unless you explicitly choose to drop it on shutdown.</p>
<blockquote>
<p><strong>Pitfall ▸</strong> Setting <code>stop_</code> without <code>notify_all()</code> leaves workers sleeping
forever → <code>join()</code> blocks indefinitely (Part 5.6 lost-wakeup family).</p>
</blockquote>
<p><strong>Trade-offs ▸</strong> Draining pending tasks on shutdown is polite but can delay
process exit. Production pools often expose <code>shutdown(now=true)</code> that clears
the queue and rejects new submits.</p>
<hr />
<h2 id="415-sizing-the-pool">4.1.5 Sizing the pool</h2>
<pre><code>   CPU-bound tasks:     N ≈ std::thread::hardware_concurrency()
   I/O-bound tasks:     N can exceed core count (threads block in kernel)
   mixed workload:      start at hardware_concurrency(), measure, tune
</code></pre>
<p><code>std::thread::hardware_concurrency()</code> returns logical processors (cores × SMT
if enabled). Zero means &ldquo;unknown&rdquo; — fall back to 2 or 4.</p>
<blockquote>
<p><strong>Under the hood ▸</strong> Oversubscribing CPU-bound work creates runnable threads
that fight for cores. Each extra thread adds cache pressure and context
switches without increasing useful throughput (Part 0.2, Amdahl&rsquo;s law in the
glossary). Undersubscribing leaves cores idle when the queue is deep.</p>
</blockquote>
<hr />
<h2 id="416-a-minimal-compilable-thread-pool">4.1.6 A minimal, compilable thread pool</h2>
<pre><code class="language-cpp">// g++ -std=c++17 -pthread 01_thread_pool.cpp -o 01_thread_pool
#include &lt;condition_variable&gt;
#include &lt;functional&gt;
#include &lt;future&gt;
#include &lt;iostream&gt;
#include &lt;mutex&gt;
#include &lt;queue&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;

class ThreadPool {
public:
    explicit ThreadPool(size_t n = std::thread::hardware_concurrency()) {
        if (n == 0) n = 2;
        for (size_t i = 0; i &lt; n; ++i)
            workers_.emplace_back([this] { worker_loop(); });
    }

    ~ThreadPool() {
        { std::lock_guard g(mu_); stop_ = true; }
        cv_.notify_all();
        for (auto&amp; w : workers_) w.join();
    }

    template &lt;class F, class... Args&gt;
    auto submit(F&amp;&amp; f, Args&amp;&amp;... args)
        -&gt; std::future&lt;std::invoke_result_t&lt;F, Args...&gt;&gt;
    {
        using R = std::invoke_result_t&lt;F, Args...&gt;;
        auto pkg = std::make_shared&lt;std::packaged_task&lt;R()&gt;&gt;(
            [fn = std::forward&lt;F&gt;(f),
             tup = std::make_tuple(std::forward&lt;Args&gt;(args)...)]() mutable {
                return std::apply(fn, std::move(tup));
            });
        std::future&lt;R&gt; fut = pkg-&gt;get_future();
        {
            std::lock_guard g(mu_);
            if (stop_) throw std::runtime_error(&quot;pool shut down&quot;);
            tasks_.emplace([pkg] { (*pkg)(); });
        }
        cv_.notify_one();
        return fut;
    }

private:
    void worker_loop() {
        for (;;) {
            std::function&lt;void()&gt; job;
            {
                std::unique_lock g(mu_);
                cv_.wait(g, [&amp;] { return stop_ || !tasks_.empty(); });
                if (stop_ &amp;&amp; tasks_.empty()) return;
                job = std::move(tasks_.front());
                tasks_.pop();
            }
            job();
        }
    }

    std::vector&lt;std::thread&gt;          workers_;
    std::queue&lt;std::function&lt;void()&gt;&gt; tasks_;
    std::mutex                        mu_;
    std::condition_variable           cv_;
    bool                              stop_ = false;
};

int main() {
    ThreadPool pool(4);
    std::vector&lt;std::future&lt;int&gt;&gt; futs;
    for (int i = 0; i &lt; 12; ++i)
        futs.push_back(pool.submit([i] { return i * i; }));
    for (int i = 0; i &lt; 12; ++i)
        std::cout &lt;&lt; &quot;f(&quot; &lt;&lt; i &lt;&lt; &quot;) = &quot; &lt;&lt; futs[i].get() &lt;&lt; &quot;\\n&quot;;
}
</code></pre>
<p>Extensions worth knowing (not shown): bounded queue + blocking <code>submit</code> for
back-pressure (Part 4.2), work-stealing deques (Part 4.6), and
<code>std::jthread</code> workers with <code>stop_token</code> (Part 2.6).</p>
<hr />
<h2 id="summary">Summary</h2>
<ul>
<li>
<p>A thread pool <strong>amortizes thread creation</strong> and <strong>caps concurrency</strong> with N
  long-lived workers pulling from a shared queue.</p>
</li>
<li>
<p>The queue is guarded by <strong>mutex + condition_variable</strong>; workers wait on a
  predicate (<code>stop_ || !empty</code>), pop under the lock, <strong>run outside</strong> the lock.</p>
</li>
<li>
<p><strong>Submit</strong> via <code>std::packaged_task</code> + <code>std::function&lt;void()&gt;</code> to return a
  <code>std::future</code> to the caller.</p>
</li>
<li>
<p><strong>Shutdown</strong>: set <code>stop_</code>, <code>notify_all()</code>, <code>join()</code> — wake every sleeper.</p>
</li>
<li>Size near <strong><code>hardware_concurrency()</code></strong> for CPU-bound work; measure for I/O.</li>
</ul>
